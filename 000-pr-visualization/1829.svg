<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1829 · Drop backend crate-wide unwrap allow</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The backend hid every unwrap behind one crate-wide allow — survey found one class per site;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now each is fixed at its root, and the allow is gone with clippy clean to prove it.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="250" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#7aa2f7">#![allow(unwrap_used, expect_used)] on lib.rs</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">whole-crate suppression — new violations land silent</text>
    <text x="104" y="364" font-size="22" fill="#565f89">frontend finished per-file; backend never started</text>
  </g>
  <g>
    <rect x="80" y="402" width="860" height="132" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="444" font-size="26" fill="#7aa2f7">13 sites: router, cache, proxy, dev, signals</text>
    <text x="104" y="482" font-size="23" fill="#a9b1d6">GovernorConfig unwrap; 3 cache locks; Location; dev ×2…</text>
    <text x="104" y="516" font-size="22" fill="#565f89">test_support expects are fixture-only (never shipped)</text>
  </g>
  <line x1="510" y1="534" x2="510" y2="940" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">one allow hides thirteen decisions</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">each panic class needs its own answer</text>
  </g>

  <g>
    <rect x="1065" y="250" width="860" height="170" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="292" font-size="26" fill="#9ece6a">router: anyhow::Result end to end</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">rate_limit + build_router fallible; run() already returns it</text>
    <text x="1089" y="364" font-size="22" fill="#565f89">4 test call sites use expect (exempt); misconfig fails loud</text>
  </g>
  <g>
    <rect x="1065" y="440" width="860" height="246" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="482" font-size="26" fill="#9ece6a">cache, proxy, dev, signals each answered</text>
    <text x="1089" y="520" font-size="23" fill="#a9b1d6">poison → rescan; Location binds the Option</text>
    <text x="1089" y="554" font-size="23" fill="#a9b1d6">missing dev user → fatal ack; signals warn-continue</text>
    <text x="1089" y="588" font-size="22" fill="#565f89">test_support keeps one documented module-scoped allow</text>
    <text x="1089" y="622" font-size="22" fill="#565f89">crate allow deleted — deny-by-default holds backend-wide</text>
  </g>
  <line x1="1495" y1="686" x2="1495" y2="940" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">clippy --all-targets clean, no allow</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">318 backend lib tests pass</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Survey method: delete the allow, let the compiler enumerate — 13 sites, each fixed, none hidden.</text>
</svg>
