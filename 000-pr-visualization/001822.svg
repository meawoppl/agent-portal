<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1822 · Remove dead lint allow on finalize</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">finalize() carried a too_many_arguments allow for a signature far under the limit;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now the line is gone and a clean clippy run proves it was dead weight.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="250" width="860" height="170" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#7aa2f7">TurnTracker::finalize(&amp;mut self, …)</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">self + instant + utc + outcome — four params total</text>
    <text x="104" y="364" font-size="22" fill="#565f89">session-lib/src/turn_tracker.rs — shared turn lifecycle</text>
  </g>
  <line x1="510" y1="420" x2="510" y2="490" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="526" y="462" font-size="22" fill="#565f89">threshold 7</text>
  <g>
    <rect x="80" y="495" width="860" height="170" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="537" font-size="26" fill="#7aa2f7">#[allow(clippy::too_many_arguments)]</text>
    <text x="104" y="575" font-size="23" fill="#a9b1d6">suppresses a lint that cannot fire here</text>
    <text x="104" y="609" font-size="22" fill="#565f89">leftover from an older, wider signature</text>
  </g>
  <line x1="510" y1="665" x2="510" y2="940" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">dead suppression hides real drift</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">a future 8th param would slip past silently</text>
  </g>

  <g>
    <rect x="1065" y="250" width="860" height="170" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="292" font-size="26" fill="#7aa2f7">TurnTracker::finalize(&amp;mut self, …)</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">signature untouched — one line removed above it</text>
    <text x="1089" y="364" font-size="22" fill="#565f89">no behavior, no signature, no call-site change</text>
  </g>
  <line x1="1495" y1="420" x2="1495" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1511" y="462" font-size="22" fill="#565f89">deleted</text>
  <g>
    <rect x="1065" y="495" width="860" height="170" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="537" font-size="26" fill="#9ece6a">allow line removed</text>
    <text x="1089" y="575" font-size="23" fill="#a9b1d6">clippy -p session-lib clean — the proof it was dead</text>
    <text x="1089" y="609" font-size="22" fill="#565f89">deny-by-default now watches this signature again</text>
  </g>
  <line x1="1495" y1="665" x2="1495" y2="940" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">one deletion, lint coverage restored</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">54 session-lib tests pass</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">If the signature ever grows past seven params, clippy will now say so at the right time.</text>
</svg>
