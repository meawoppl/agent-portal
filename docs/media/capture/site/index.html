<!doctype html>
<html><head><meta charset="utf-8"><title>acme-api · dev</title>
<style>
 body{margin:0;background:#11131c;color:#c0caf5;font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
 .wrap{max-width:620px;margin:0 auto;padding:28px 24px}
 h1{font-size:20px;margin:0 0 2px;color:#e6ecff;font-weight:650}

 .card{background:#171a26;border:1px solid #232838;border-radius:10px;padding:16px 18px;margin-bottom:14px}
 .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:5px 0;border-bottom:1px solid #1e2331}
 .row:last-child{border-bottom:0}
 .k{color:#8b93b0}.v{color:#7dcfff}
 svg{display:block;margin-top:6px}

   </svg>
 </div>
</div></body></html>
