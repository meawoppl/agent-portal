<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img"
     aria-label="Agent Portal data flow: an agent CLI supervised by the launcher daemon on your machine talks to the portal server over a WebSocket; the server persists transcripts and serves the browser and mobile clients; a forwarded local port is tunnelled back out to the browser.">
  <defs>
    <style>
      .box   { fill: #171a26; stroke: #2b3145; stroke-width: 1.2; rx: 10; }
      .inner { fill: #1b1f2e; stroke: #333a52; stroke-width: 1; }
      .lbl   { fill: #c0caf5; font-size: 13px; font-weight: 600; }
      .sub   { fill: #6b7392; font-size: 11px; }
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#565f89"/>
    </marker>
  </defs>

  <rect x="18"  y="40" width="250" height="300" class="box"/>
  <rect x="332" y="40" width="236" height="300" class="box"/>
  <rect x="632" y="40" width="250" height="300" class="box"/>

  <text x="34"  y="30" class="sub">YOUR MACHINE</text>
  <text x="348" y="30" class="sub">PORTAL SERVER</text>
  <text x="648" y="30" class="sub">ANY BROWSER</text>

  <rect x="38" y="64" width="210" height="120" rx="8" class="inner"/>
  <text x="52" y="86" class="lbl">agent-portal</text>
  <text x="52" y="103" class="sub">launcher daemon</text>
  <rect x="56" y="116" width="174" height="52" rx="6" fill="#20263a" stroke="#3b4463" stroke-width="1"/>
  <text x="70" y="137" class="lbl" font-size="12">claude · codex · muse</text>
  <text x="70" y="154" class="sub">one process per session</text>

  <rect x="38" y="212" width="210" height="60" rx="8" class="inner"/>
  <text x="52" y="236" class="lbl" font-size="12">127.0.0.1:8899</text>
  <text x="52" y="253" class="sub">dev server, notebook, UI</text>

  <rect x="352" y="76" width="196" height="76" rx="8" class="inner"/>
  <text x="366" y="100" class="lbl">Axum + WebSocket hub</text>
  <text x="366" y="118" class="sub">typed protocol, replay</text>
  <text x="366" y="134" class="sub">watermarks, input outbox</text>

  <rect x="352" y="176" width="92" height="60" rx="8" class="inner"/>
  <text x="366" y="199" class="lbl" font-size="12">Postgres</text>
  <text x="366" y="216" class="sub">transcripts</text>

  <rect x="456" y="176" width="92" height="60" rx="8" class="inner"/>
  <text x="470" y="199" class="lbl" font-size="12">archive</text>
  <text x="470" y="216" class="sub">disk / S3</text>

  <rect x="352" y="260" width="196" height="52" rx="8" class="inner"/>
  <text x="366" y="283" class="lbl" font-size="12">reverse proxy</text>
  <text x="366" y="299" class="sub">forward subdomains</text>

  <rect x="652" y="76" width="210" height="86" rx="8" class="inner"/>
  <text x="666" y="100" class="lbl">Yew · WebAssembly</text>
  <text x="666" y="118" class="sub">transcript, permissions,</text>
  <text x="666" y="134" class="sub">metrics, port preview</text>

  <rect x="652" y="192" width="98" height="120" rx="12" class="inner"/>
  <text x="666" y="216" class="lbl" font-size="12">phone</text>
  <text x="666" y="233" class="sub">same UI,</text>
  <text x="666" y="248" class="sub">push</text>

  <rect x="764" y="192" width="98" height="120" rx="8" class="inner"/>
  <text x="778" y="216" class="lbl" font-size="12">viewer</text>
  <text x="778" y="233" class="sub">shared,</text>
  <text x="778" y="248" class="sub">read-only</text>

  <path id="up"   d="M248 124 L352 114" stroke="#565f89" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path id="down" d="M548 114 L652 110" stroke="#565f89" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path id="tun"  d="M248 242 C300 242, 300 286, 352 286" stroke="#565f89" stroke-width="1.4"
        fill="none" stroke-dasharray="4 4"/>
  <path id="fwd"  d="M548 286 C600 286, 620 150, 652 140" stroke="#565f89" stroke-width="1.4"
        fill="none" stroke-dasharray="4 4"/>
  <path id="psh"  d="M548 130 C600 160, 620 220, 652 240" stroke="#565f89" stroke-width="1.2" fill="none"/>

  <text x="262" y="108" class="sub">session WS</text>
  <text x="574" y="98" class="sub">client WS</text>
  <text x="252" y="304" class="sub">tunnel</text>
  <text x="600" y="186" class="sub">push</text>

  <circle r="4" fill="#9ece6a">
    <animateMotion dur="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#up"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#9ece6a">
    <animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" calcMode="linear">
      <mpath href="#down"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#7dcfff">
    <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" calcMode="linear">
      <mpath href="#tun"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#7dcfff">
    <animateMotion dur="3.2s" begin="1.9s" repeatCount="indefinite" calcMode="linear">
      <mpath href="#fwd"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#bb9af7">
    <animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite" calcMode="linear">
      <mpath href="#psh"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
