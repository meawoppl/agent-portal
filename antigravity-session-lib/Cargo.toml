[package]
name = "antigravity-session-lib"
version.workspace = true
edition.workspace = true
description = "Antigravity localharness backend for session-lib (AntigravityAgent preview)."
license = "MIT"

[dependencies]
session-lib = { path = "../session-lib" }
shared = { path = "../shared" }
antigravity-codes = { workspace = true, features = ["async-client"] }
