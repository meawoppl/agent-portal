<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="58" fill="#565f89" font-family="Arial, sans-serif" font-size="24">PR #2026 · Faster PR container and platform checks</text>
  <text x="55" y="112" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">PRs prove packaging and portability; main produces release artifacts</text>
  <line x1="55" y1="160" x2="1945" y2="160" stroke="#565f89" stroke-width="2"/>
  <line x1="1000" y1="195" x2="1000" y2="1115" stroke="#565f89" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="75" y="225" fill="#f7768e" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">BEFORE · EVERY PR</text>
  <rect x="75" y="265" width="830" height="330" rx="18" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="110" y="315" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Build Container · median 7m 07s</text>
  <rect x="110" y="350" width="615" height="48" rx="6" fill="#f7768e"/>
  <text x="125" y="382" fill="#16161e" font-family="Arial, sans-serif" font-size="22">release backend · 308s</text>
  <rect x="725" y="350" width="132" height="48" rx="6" fill="#bb9af7"/>
  <text x="744" y="382" fill="#16161e" font-family="Arial, sans-serif" font-size="20">WASM</text>
  <text x="110" y="450" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Optimized backend embeds a release frontend.</text>
  <text x="110" y="490" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Docker then packages the already-built binary.</text>
  <text x="110" y="540" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">The production work is repeated after merge.</text>

  <rect x="75" y="650" width="830" height="330" rx="18" fill="#1e202e" stroke="#e0af68" stroke-width="3"/>
  <text x="110" y="700" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Four optimized binary lanes</text>
  <text x="110" y="750" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Linux x86_64 · Linux ARM64</text>
  <text x="110" y="790" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">macOS ARM64 · Windows x86_64</text>
  <text x="110" y="840" fill="#e0af68" font-family="Arial, sans-serif" font-size="23">Windows is critical path in 67/85 CI runs.</text>
  <text x="110" y="890" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Sign and upload eight artifacts per PR.</text>
  <text x="110" y="930" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">No PR consumer downloads those artifacts.</text>

  <text x="1075" y="225" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">AFTER · CONTRACT-FOCUSED PRS</text>
  <rect x="1095" y="265" width="830" height="330" rx="18" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1130" y="315" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Build Container · package contract</text>
  <rect x="1130" y="350" width="155" height="48" rx="6" fill="#7dcfff"/>
  <text x="1154" y="382" fill="#16161e" font-family="Arial, sans-serif" font-size="22">/bin/true</text>
  <line x1="1285" y1="374" x2="1390" y2="374" stroke="#7dcfff" stroke-width="4"/>
  <polygon points="1410,374 1385,362 1385,386" fill="#7dcfff"/>
  <rect x="1410" y="335" width="360" height="78" rx="10" fill="#16161e" stroke="#7dcfff" stroke-width="3"/>
  <text x="1440" y="368" fill="#c0caf5" font-family="Arial, sans-serif" font-size="22">Dockerfile + build context</text>
  <text x="1440" y="397" fill="#565f89" font-family="Arial, sans-serif" font-size="19">COPY and runtime layers validated</text>
  <text x="1130" y="465" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">No Rust, Trunk, WASM, or release compilation.</text>
  <text x="1130" y="510" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Full embedded backend and image push stay on main.</text>
  <text x="1130" y="550" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Existing Build Container check name is preserved.</text>

  <rect x="1095" y="650" width="830" height="330" rx="18" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1130" y="700" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Four debug link checks</text>
  <text x="1130" y="750" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">cargo build -p claude-portal -p agent-portal</text>
  <text x="1130" y="800" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Still executes each platform linker and cfg paths.</text>
  <text x="1130" y="850" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Drops release optimization, signing, and uploads.</text>
  <text x="1130" y="900" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Release owns optimized artifacts after merge.</text>
  <text x="1130" y="940" fill="#565f89" font-family="Arial, sans-serif" font-size="20">All four existing PR check names remain stable.</text>

  <rect x="1095" y="1035" width="830" height="90" rx="16" fill="#1e202e" stroke="#bb9af7" stroke-width="3"/>
  <text x="1130" y="1073" fill="#bb9af7" font-family="Arial, sans-serif" font-size="23" font-weight="bold">Expected PR wall time: about 7.4m -&gt; 3.9m</text>
  <text x="1130" y="1106" fill="#c0caf5" font-family="Arial, sans-serif" font-size="18">Production outputs remain unchanged after merge.</text>
  <text x="55" y="1170" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Measured from 300 completed Actions runs, 2026-09-15 through 2026-09-22.</text>
</svg>
