<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2306 · Wrap long background task commands instead of clipping them</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">A long one-line command ran off the Task Started card behind a hidden</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">horizontal scrollbar; it now wraps inside the card at any width.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="840" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">.task-code (messages.css)</text>
  <text x="79" y="325" font-size="23" fill="#f7768e">white-space: pre; overflow: auto</text>
  <text x="79" y="360" font-size="23" fill="#a9b1d6">one line, sideways scroll</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">for i in $(seq 1 60); do p=$(ls /dev/cu.usbm</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">rest of the command past the card edge</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">macOS hides the scrollbar: looks clipped</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Also: task notification summary</text>
  <text x="79" y="725" font-size="23" fill="#a9b1d6">render_task_code, same class</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">same clipping</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">.task-code</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">white-space: pre-wrap; overflow-wrap: anywhere</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">overflow-y: auto; max-height: 260px kept</text>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">Whole command, wrapped</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">scrollWidth == clientWidth at 1400px</text>
  <text x="1069" y="560" font-size="23" fill="#9ece6a">and at 390px (phone)</text>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">Same fix for notifications</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">one CSS rule, both renderers</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">no markup change</text>
</svg>
