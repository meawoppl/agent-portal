<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2522 · Reset the live status strip when a reconnect replays history</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">A tool that finished while the browser was offline kept its running pill forever;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">a reconnect replay now resets the strip, and live tools return on their heartbeat.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="240" width="840" height="120" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="282" font-size="26" fill="#7aa2f7">Live: tool_result / result arrives</text>
    <text x="104" y="322" font-size="23" fill="#a9b1d6">handle_received_output retires the pill</text>
  </g>
  <g>
    <rect x="80" y="410" width="840" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="452" font-size="26" fill="#7aa2f7">Offline, then WsEvent::HistoryBatch</text>
    <text x="104" y="492" font-size="23" fill="#a9b1d6">muse_live_turn reset; messages.edit().extend(..)</text>
    <text x="104" y="528" font-size="23" fill="#f7768e">replayed result skips handle_received_output</text>
  </g>
  <line x1="500" y1="560" x2="500" y2="606" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <g>
    <rect x="80" y="610" width="840" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="652" font-size="26" fill="#f7768e">live_status keeps "Bash running - 3m"</text>
    <text x="104" y="692" font-size="23" fill="#a9b1d6">until another durable message ever arrives</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1040" y="240" width="880" height="120" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1064" y="282" font-size="26" fill="#7aa2f7">Live: tool_result / result arrives</text>
    <text x="1064" y="322" font-size="23" fill="#a9b1d6">handle_received_output retires the pill</text>
  </g>
  <g>
    <rect x="1040" y="410" width="880" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="452" font-size="26" fill="#7aa2f7">Offline, then WsEvent::HistoryBatch</text>
    <text x="1064" y="492" font-size="23" fill="#a9b1d6">muse_live_turn reset, as before</text>
    <text x="1064" y="528" font-size="23" fill="#9ece6a">live_status = LiveStatusSnapshot::default()</text>
  </g>
  <line x1="1480" y1="560" x2="1480" y2="606" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1040" y="610" width="880" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="652" font-size="26" fill="#9ece6a">publish_live_status() clears the strip</text>
    <text x="1064" y="692" font-size="23" fill="#a9b1d6">a still-running tool reappears on ToolProgress</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Trade-off: a tool still running at reconnect disappears until its next heartbeat (a few seconds).</text>
</svg>
