<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="pr2009-title pr2009-desc">
  <title id="pr2009-title">PR 2009 shared case-insensitive contains</title>
  <desc id="pr2009-desc">Four lower-then-contains checks in three crates now call one tested shared helper.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="58" fill="#565f89" font-family="Arial, sans-serif" font-size="24" letter-spacing="1">PR #2009 · Share case-insensitive contains via shared strings</text>
  <text x="55" y="112" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">Four lower-then-contains checks in three crates;</text>
  <text x="55" y="154" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">now one tested helper owns the shape.</text>
  <line x1="55" y1="184" x2="1945" y2="184" stroke="#565f89" stroke-width="2"/>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="75" y="235" fill="#f7768e" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">BEFORE</text>
  <rect x="75" y="275" width="830" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="105" y="320" fill="#7aa2f7" font-family="monospace" font-size="26">archive scan.rs x2</text>
  <text x="105" y="365" fill="#c0caf5" font-family="monospace" font-size="23">email filter lowers haystack only</text>
  <text x="105" y="401" fill="#c0caf5" font-family="monospace" font-size="23">name filter lowers both sides</text>
  <text x="105" y="437" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Two arms, two shapes, one file.</text>
  <rect x="75" y="500" width="830" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="105" y="545" fill="#7aa2f7" font-family="monospace" font-size="26">model_version.rs</text>
  <text x="105" y="590" fill="#c0caf5" font-family="monospace" font-size="23">has_one_million_tag lowers, contains [1m]</text>
  <text x="105" y="626" fill="#c0caf5" font-family="monospace" font-size="23">on an already-lowered id - twice</text>
  <text x="105" y="662" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Wasted second lowercase per lookup.</text>
  <rect x="75" y="725" width="830" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="105" y="770" fill="#7aa2f7" font-family="monospace" font-size="26">voice_input.rs</text>
  <text x="105" y="815" fill="#c0caf5" font-family="monospace" font-size="23">iOS abort check lowers, contains literal</text>
  <text x="105" y="851" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Third crate, same inline shape.</text>
  <text x="75" y="990" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">Same idea in four places.</text>
  <text x="75" y="1030" fill="#565f89" font-family="Arial, sans-serif" font-size="23">A fix in one leaves three behind.</text>

  <text x="1075" y="235" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">AFTER</text>
  <rect x="1095" y="275" width="830" height="200" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="320" fill="#7aa2f7" font-family="monospace" font-size="26">shared::strings helper</text>
  <text x="1125" y="365" fill="#9ece6a" font-family="monospace" font-size="23">pub, tested, std-only, WASM-safe</text>
  <text x="1125" y="401" fill="#c0caf5" font-family="monospace" font-size="23">lowers both sides, one contains</text>
  <text x="1125" y="437" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Single home for the match shape.</text>
  <line x1="1510" y1="475" x2="1510" y2="535" stroke="#9ece6a" stroke-width="4"/>
  <polygon points="1510,555 1500,530 1520,530" fill="#9ece6a"/>
  <rect x="1095" y="570" width="830" height="200" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="615" fill="#7aa2f7" font-family="monospace" font-size="26">four call sites</text>
  <text x="1125" y="660" fill="#c0caf5" font-family="monospace" font-size="23">scan user + name, 1m tag, iOS abort</text>
  <text x="1125" y="696" fill="#c0caf5" font-family="monospace" font-size="23">frontend via utils:: re-export</text>
  <text x="1125" y="732" fill="#565f89" font-family="Arial, sans-serif" font-size="23">2 new tests, full suite green.</text>
  <line x1="1510" y1="770" x2="1510" y2="830" stroke="#9ece6a" stroke-width="4"/>
  <polygon points="1510,850 1500,825 1520,825" fill="#9ece6a"/>
  <rect x="1095" y="865" width="830" height="130" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="910" fill="#7aa2f7" font-family="monospace" font-size="26">drift-proof by construction</text>
  <text x="1125" y="955" fill="#565f89" font-family="Arial, sans-serif" font-size="23">No arm can lower only one side again.</text>
  <text x="1095" y="1060" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">One definition - every caller agrees.</text>
  <text x="1095" y="1100" fill="#565f89" font-family="Arial, sans-serif" font-size="23">No behavior change; empty needle matches like str::contains.</text>

  <text x="55" y="1172" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Caveat: ASCII-only folding, matching every call site it replaces - no Unicode case behavior changes.</text>
</svg>
