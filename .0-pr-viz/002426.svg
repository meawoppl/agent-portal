<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2426 · Verify the Portal session in place</text>
<text x="55" y="105" font-family="sans-serif" font-size="34" fill="#e6e9f5">Verification used to navigate away for another provider round-trip.</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">An inline server check now keeps the page and its pending action in place.</text>
<path d="M55 180 H1945 M1000 200 V1130" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="235" font-family="sans-serif" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="24" fill="#9ece6a">AFTER</text>
<rect x="55" y="285" width="890" height="210" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="330" font-family="sans-serif" font-size="28" fill="#7aa2f7">Verify with Google</text>
<text x="80" y="390" font-family="sans-serif" font-size="25" fill="#c0caf5">The button changes the entire tab location.</text>
<text x="80" y="438" font-family="sans-serif" font-size="25" fill="#f7768e">The pending page must load again on return.</text>
<rect x="1055" y="285" width="890" height="210" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="330" font-family="sans-serif" font-size="28" fill="#7aa2f7">Verify Portal session</text>
<text x="1080" y="390" font-family="sans-serif" font-size="25" fill="#c0caf5">POST /api/secrets/verification/check</text>
<text x="1080" y="438" font-family="sans-serif" font-size="25" fill="#9ece6a">Spinner and retry stay beside the pending action.</text>
<rect x="55" y="550" width="890" height="210" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="595" font-family="sans-serif" font-size="28" fill="#7aa2f7">Provider round-trip</text>
<text x="80" y="655" font-family="sans-serif" font-size="25" fill="#c0caf5">A new OAuth response confirms the linked account.</text>
<text x="80" y="703" font-family="sans-serif" font-size="25" fill="#f7768e">Requires provider navigation and a callback.</text>
<rect x="1055" y="550" width="890" height="210" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="595" font-family="sans-serif" font-size="28" fill="#7aa2f7">Server-side account policy</text>
<text x="1080" y="655" font-family="sans-serif" font-size="25" fill="#c0caf5">Signed browser cookie, active user, CSRF, allow-list.</text>
<text x="1080" y="703" font-family="sans-serif" font-size="25" fill="#9ece6a">No provider token storage or browser navigation.</text>
<rect x="55" y="815" width="890" height="210" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="860" font-family="sans-serif" font-size="28" fill="#7aa2f7">Return to the page</text>
<text x="80" y="920" font-family="sans-serif" font-size="25" fill="#c0caf5">Restore application state after the redirect.</text>
<text x="80" y="968" font-family="sans-serif" font-size="25" fill="#f7768e">Verification still needs a separate approval.</text>
<rect x="1055" y="815" width="890" height="210" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="860" font-family="sans-serif" font-size="28" fill="#7aa2f7">Stable verified status</text>
<text x="1080" y="920" font-family="sans-serif" font-size="25" fill="#c0caf5">Success enables the explicit approval action.</text>
<text x="1080" y="968" font-family="sans-serif" font-size="25" fill="#9ece6a">No success polling, reload, popup or auto-approval.</text>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: validates Portal session/account policy, not a fresh Google/GitHub token or password/MFA challenge.</text>
</svg>