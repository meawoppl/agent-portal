<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 2135 - Plugin discovery surface</title>
  <desc id="desc">Plugin metadata is now discovered by the backend and shown in launch and session surfaces.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="68" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="1">PR #2135 - Plugin discovery surface</text>
  <text x="55" y="122" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Plugins used to be invisible until a system reminder appeared.</text>
  <text x="55" y="164" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Now Portal exposes discovery, context cost, and a docked plugin view.</text>
  <line x1="55" y1="192" x2="1945" y2="192" stroke="#3d4666" stroke-width="2"/>

  <text x="55" y="244" fill="#f7768e" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1055" y="244" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <line x1="1000" y1="210" x2="1000" y2="1140" stroke="#3d4666" stroke-width="3" stroke-dasharray="14 16"/>

  <rect x="70" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="115" y="340" width="760" height="125" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="386" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">LaunchDialog</text>
  <text x="145" y="430" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">User picks an agent and working directory</text>

  <rect x="115" y="535" width="760" height="130" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="582" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Session header</text>
  <text x="145" y="626" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">No first-class hint that plugins matched</text>

  <rect x="115" y="735" width="760" height="190" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="145" y="784" fill="#f7768e" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Plugin context appears late</text>
  <text x="145" y="832" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="24">Skills and plugin protocol live in hidden files</text>
  <text x="145" y="872" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="24">No visible context byte or token estimate</text>
  <text x="145" y="912" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="24">No launch-time suggestion for KiCad or Verilog</text>

  <path d="M495 480 L495 520" fill="none" stroke="#f7768e" stroke-width="4" stroke-dasharray="10 12"/>
  <path d="M495 670 L495 720" fill="none" stroke="#f7768e" stroke-width="4" stroke-dasharray="10 12"/>
  <text x="205" y="702" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">capability is present but hard to see</text>

  <rect x="1085" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="1125" y="335" width="765" height="125" rx="16" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1155" y="382" fill="#7aa2f7" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">GET /api/plugins</text>
  <text x="1155" y="424" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="23">Reads agent-portal-plugin.toml plus skill files</text>
  <text x="1645" y="424" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="23">PluginInventory</text>

  <rect x="1125" y="520" width="325" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1152" y="568" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">LaunchDialog</text>
  <text x="1152" y="610" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">PluginSuggestionStrip</text>
  <text x="1152" y="648" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">directory-aware hints</text>

  <rect x="1515" y="520" width="375" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1542" y="568" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Session header</text>
  <text x="1542" y="610" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">Plugins N chip</text>
  <text x="1542" y="648" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">opens docked surface</text>

  <rect x="1125" y="765" width="325" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1152" y="813" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Plugin context</text>
  <text x="1152" y="855" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">collapsed card</text>
  <text x="1152" y="893" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">bytes and token estimate</text>

  <rect x="1515" y="765" width="375" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1542" y="813" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Plugins dock</text>
  <text x="1542" y="855" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">SessionSurfaceKind::Plugins</text>
  <text x="1542" y="893" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">reason, skills, root path</text>

  <path d="M1505 460 L1300 510" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1284,514 1312,494 1318,523" fill="#7aa2f7"/>
  <path d="M1515 460 L1715 510" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1731,514 1697,523 1704,494" fill="#7aa2f7"/>
  <path d="M1300 705 L1300 752" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1300,765 1284,736 1316,736" fill="#7aa2f7"/>
  <path d="M1715 705 L1715 752" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1715,765 1699,736 1731,736" fill="#7aa2f7"/>

  <rect x="110" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="138" y="1103" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">Plugin matches existed, but users could not discover or audit them.</text>
  <rect x="1125" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1153" y="1103" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">The first slice is read-only discovery; install toggles come later.</text>

  <text x="55" y="1172" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="22">Scope: manifest scanning uses PORTAL_PLUGIN_DIRS and ~/agent-portal-plugins; no database migration in this slice.</text>
</svg>
