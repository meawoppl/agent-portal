<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2319 · Sort the session rail by pill name</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The rail sorted by working folder while pills show the session name, so it</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">looked unsorted; it now sorts by the name you see.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="840" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">display_sort_key (session_order.rs)</text>
  <text x="79" y="325" font-size="23" fill="#f7768e">(extract_folder(working_directory), agent, key)</text>
  <text x="79" y="360" font-size="23" fill="#a9b1d6">pill shows session_name</text>

  <rect x="55" y="445" width="900" height="350" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">cfl-test-bench rail</text>
  <text x="79" y="530" font-size="23" fill="#f7768e">fsw-phasing      (aperture1-fsw)</text>
  <text x="79" y="565" font-size="23" fill="#a9b1d6">bp-test-breakup</text>
  <text x="79" y="600" font-size="23" fill="#a9b1d6">fcdk-update</text>
  <text x="79" y="635" font-size="23" fill="#a9b1d6">fsm-driver-firmware</text>
  <text x="79" y="670" font-size="23" fill="#a9b1d6">fsw-game-loop</text>
  <text x="79" y="705" font-size="23" fill="#f7768e">jlg-shared       (justletgo)</text>
  <text x="79" y="740" font-size="23" fill="#a9b1d6">tiny-tracker</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">display_sort_key</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">(session_name.to_lowercase(), folder, agent, key)</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">still total; no branch / host / time</text>

  <rect x="1045" y="445" width="900" height="350" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">cfl-test-bench rail</text>
  <text x="1069" y="530" font-size="23" fill="#9ece6a">bp-test-breakup</text>
  <text x="1069" y="565" font-size="23" fill="#9ece6a">fcdk-update</text>
  <text x="1069" y="600" font-size="23" fill="#9ece6a">fsm-driver-firmware</text>
  <text x="1069" y="635" font-size="23" fill="#9ece6a">fsw-game-loop</text>
  <text x="1069" y="670" font-size="23" fill="#9ece6a">fsw-phasing</text>
  <text x="1069" y="705" font-size="23" fill="#9ece6a">jlg-shared</text>
  <text x="1069" y="740" font-size="23" fill="#9ece6a">tiny-tracker</text>
</svg>
