<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2217 · Stop posting reconnect notices and hide commands_changed</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Every proxy reconnect wrote a transcript row, and COMMANDS_CHANGED split each run;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now reconnects only go to the log and both frames are dropped before grouping.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE ==================== -->
  <g>
    <rect x="80" y="250" width="860" height="170" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#7aa2f7">run_single_connection (proxy_session)</text>
    <text x="104" y="330" font-size="23" fill="#f7768e">on every reconnect: SequencedOutput of</text>
    <text x="104" y="364" font-size="23" fill="#f7768e">ConnectionCycle or "**Proxy reconnected** after ..."</text>
    <text x="104" y="398" font-size="22" fill="#565f89">stored in messages, replayed forever</text>
  </g>

  <line x1="510" y1="420" x2="510" y2="490" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>

  <g>
    <rect x="80" y="495" width="860" height="200" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="535" font-size="26" fill="#7aa2f7">group_messages (frontend)</text>
    <text x="104" y="575" font-size="23" fill="#a9b1d6">system subtype commands_changed -> Single group</text>
    <text x="104" y="609" font-size="23" fill="#f7768e">breaks the Portal run after every reconnect</text>
    <text x="104" y="643" font-size="23" fill="#a9b1d6">render_reconnect_notice_run collapses only</text>
    <text x="104" y="677" font-size="22" fill="#565f89">consecutive notices, so each run is 1-3 lines</text>
  </g>

  <line x1="510" y1="695" x2="510" y2="955" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="960" width="860" height="140" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">idle transcript = wall of alternating rows</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">"reconnected 3x after 3s (unexpected ...)"</text>
    <text x="104" y="1080" font-size="23" fill="#f7768e">COMMANDS_CHANGED, repeat</text>
  </g>

  <!-- ==================== AFTER ==================== -->
  <g>
    <rect x="1065" y="250" width="860" height="170" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="290" font-size="26" fill="#7aa2f7">run_single_connection (proxy_session)</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">first_connection: "**Session started**" card</text>
    <text x="1089" y="364" font-size="23" fill="#9ece6a">reconnect: info!("Connection restored ...")</text>
    <text x="1089" y="398" font-size="22" fill="#565f89">log only; disconnected_at_utc removed</text>
  </g>

  <line x1="1495" y1="420" x2="1495" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="495" width="860" height="200" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="535" font-size="26" fill="#9ece6a">is_transcript_noise(frame) -> continue</text>
    <text x="1089" y="575" font-size="23" fill="#a9b1d6">System subtype "commands_changed"</text>
    <text x="1089" y="609" font-size="23" fill="#a9b1d6">Portal is_reconnect_notice: ConnectionCycle or</text>
    <text x="1089" y="643" font-size="23" fill="#a9b1d6">historical "Proxy reconnected" text</text>
    <text x="1089" y="677" font-size="22" fill="#565f89">skipped before classify, so runs stay joined</text>
  </g>

  <line x1="1495" y1="695" x2="1495" y2="955" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="960" width="860" height="140" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">no reconnect or COMMANDS_CHANGED rows</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">old transcripts hidden too; neighbours stay grouped</text>
    <text x="1089" y="1080" font-size="22" fill="#565f89">reconnect run renderer and its CSS deleted</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Stored notices are hidden, not deleted from the DB or archives; unexpected disconnects now surface only in proxy logs, not the transcript.</text>
</svg>
