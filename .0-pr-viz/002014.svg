<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-label="Visual summary of PR 2014: session forward surfaces gain generic state, resizing, fullscreen, persistence, and iframe-preserving collapse.">
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="64" y="105" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700">Forward previews become durable session surfaces</text>
  <text x="64" y="154" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">PR 2014 completes the implementation described after PR 2013: resizable split, fullscreen, persisted size, and state-preserving collapse.</text>

  <line x1="1000" y1="205" x2="1000" y2="1115" stroke="#565f89" stroke-width="2" stroke-dasharray="10 12"/>

  <g transform="translate(80 230)">
    <rect x="0" y="0" width="840" height="720" rx="14" fill="#1e202e" stroke="#3d4666" stroke-width="3"/>
    <rect x="0" y="0" width="840" height="64" rx="14" fill="#16161e"/>
    <text x="32" y="42" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">Session chat</text>
    <rect x="620" y="18" width="112" height="30" rx="6" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="642" y="39" fill="#9ece6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">:8080</text>
    <rect x="34" y="104" width="520" height="56" rx="8" fill="#1e202e"/>
    <rect x="34" y="190" width="660" height="56" rx="8" fill="#1e202e"/>
    <rect x="34" y="276" width="470" height="56" rx="8" fill="#1e202e"/>
    <rect x="34" y="602" width="772" height="78" rx="10" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
    <text x="60" y="650" fill="#565f89" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">prompt stays in the chat pane</text>

    <rect x="842" y="0" width="18" height="720" fill="#7aa2f7" opacity="0.36"/>
    <rect x="880" y="0" width="840" height="720" rx="14" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
    <rect x="880" y="0" width="840" height="64" rx="14" fill="#16161e"/>
    <circle cx="916" cy="32" r="8" fill="#9ece6a"/>
    <text x="942" y="42" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">python3 :8080</text>
    <rect x="1520" y="17" width="136" height="31" rx="7" fill="#1e202e" stroke="#7dcfff" stroke-width="2"/>
    <text x="1539" y="39" fill="#7dcfff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Visit site</text>
    <rect x="914" y="110" width="752" height="530" rx="10" fill="#e6e9f5"/>
    <rect x="950" y="148" width="330" height="34" rx="6" fill="#7aa2f7"/>
    <rect x="950" y="214" width="640" height="26" rx="5" fill="#a9b1d6"/>
    <rect x="950" y="260" width="590" height="26" rx="5" fill="#a9b1d6"/>
    <rect x="950" y="332" width="240" height="170" rx="10" fill="#9ece6a"/>
    <rect x="1220" y="332" width="240" height="170" rx="10" fill="#e0af68"/>
  </g>

  <g transform="translate(80 1010)">
    <rect x="0" y="0" width="520" height="86" rx="12" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
    <text x="28" y="35" fill="#7aa2f7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Generic surface state</text>
    <text x="28" y="65" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Forward today; board/BOM/3D artifact tomorrow.</text>

    <rect x="570" y="0" width="410" height="86" rx="12" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
    <text x="598" y="35" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">30-70 resize</text>
    <text x="598" y="65" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Remembered per session.</text>

    <rect x="1030" y="0" width="410" height="86" rx="12" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
    <text x="1058" y="35" fill="#bb9af7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Fullscreen + Escape</text>
    <text x="1058" y="65" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Phone opens straight to surface mode.</text>

    <rect x="1490" y="0" width="350" height="86" rx="12" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
    <text x="1518" y="35" fill="#e0af68" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Collapse keeps iframe</text>
    <text x="1518" y="65" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Local app state survives.</text>
  </g>
</svg>
