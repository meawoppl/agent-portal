<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2109 - Route agent labels via shared AgentType</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Two inline lowercase matches move onto AgentType display_name.</text>
<path d="M55 178 H1945 M1000 195 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g><rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#7aa2f7"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#7aa2f7">Inline lowercase match</text>
<text x="79" y="371" font-family="monospace" font-size="23" fill="#c0caf5">match s.to_ascii_lowercase()</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">Two sites re-match claude and codex.</text>
</g>
<g><rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#7aa2f7"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#7aa2f7">One shared parse</text>
<text x="1079" y="371" font-family="monospace" font-size="23" fill="#c0caf5">parse AgentType, use display_name()</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">Single source of truth for labels.</text>
</g>
<g><rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Muse mislabeled</text>
<text x="79" y="656" font-family="monospace" font-size="23" fill="#c0caf5">muse hits the fallback arm</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">Shows generic agent instead of Muse.</text>
</g>
<g><rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">Muse labeled</text>
<text x="1079" y="656" font-family="monospace" font-size="23" fill="#c0caf5">Muse renders as Muse</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">Unknown input still falls back to agent.</text>
</g>
<g><rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#a9b1d6"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#a9b1d6">Behavior unchanged</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Same labels for claude and codex;</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">trim and case handling via FromStr.</text>
</g>
<g><rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">Verified locally</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Frontend tests pass; clippy</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">and fmt clean.</text>
</g>
