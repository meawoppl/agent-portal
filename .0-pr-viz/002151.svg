<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2151 - Give the mobile composer a full-width textarea row</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">On a phone the composer squeezed everything into one row; the</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">textarea now takes a full row with the controls evenly beneath it.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">Composer row</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Textarea, effort select, mic and Send shared one</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">row, leaving the textarea about 145px wide.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">Two-row composer</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">flex-wrap gives the textarea the full width (374px)</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">with effort, mic and Send in a row below.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Alignment</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">The effort select had align-self center while the</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">row was bottom-aligned, so it floated higher.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">Controls</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">Effort select, mic and Send are all 40px tall at</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">the same y, with Send pushed to the right.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">Placeholder</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Type your message... (Shift+Enter for new line)</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">wrapped across four lines in a narrow box.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">Placeholder on touch</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">pointer coarse devices drop the Shift+Enter hint;</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">desktop keeps it and its layout is unchanged.</text>
</g>
</svg>
