<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2293 · Type the claude_args and open_prs JSONB columns</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Three JSONB list columns were serde_json::Value, hand-decoded at every read;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">they are now a typed JsonVec&lt;T&gt; with the same bytes on disk and on the wire.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="840" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">models.rs</text>
  <text x="79" y="325" font-size="23" fill="#f7768e">claude_args: serde_json::Value</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">open_prs: serde_json::Value</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">Reads</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">jsonb_string_vec(&amp;session.claude_args)</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">at 6 call sites</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Writes</text>
  <text x="79" y="725" font-size="23" fill="#a9b1d6">serde_json::to_value(args)</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">.unwrap_or_else(|_| Value::Array(Vec::new()))</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">db/jsonb.rs: JsonVec&lt;T&gt;</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">claude_args: JsonVec&lt;String&gt;</text>
  <text x="1069" y="360" font-size="23" fill="#9ece6a">open_prs: JsonVec&lt;shared::PrRef&gt;</text>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">FromSql&lt;Jsonb, Pg&gt;</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">session.claude_args.0</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">garbage reads as empty, with a warning</text>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">ToSql + serde(transparent)</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">bare JSON array: no migration</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">SessionWithRole still sends open_prs: [...]</text>

  <text x="55" y="900" font-size="23" fill="#565f89">Also scheduled_tasks.claude_args</text>
  <text x="1045" y="900" font-size="23" fill="#565f89">DB round-trip test in db/jsonb.rs</text>
</svg>
