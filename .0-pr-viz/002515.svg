<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="monospace" font-size="24" fill="#a9b1d6">PR #2515 · Refresh session lists from WebSocket changes and compress JSON reads</text>
<text x="55" y="103" font-family="monospace" font-size="34" fill="#e6e9f5">Connected accounts get a WebSocket invalidation when their session list changes.</text>
<text x="55" y="146" font-family="monospace" font-size="34" fill="#e6e9f5">Large JSON reads can use gzip or Brotli after redaction.</text>
<path d="M55 175H1945 M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="monospace" font-size="22" fill="#f7768e">BEFORE</text>
<rect x="55" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">use_sessions</text>
<text x="79" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Each tab requests the complete list every five seconds.</text>
<path d="M500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">GET /api/sessions</text>
<text x="79" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Each request fetches and redacts the account list.</text>
<path d="M500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">JSON reads</text>
<text x="79" y="939" font-family="monospace" font-size="23" fill="#c0caf5">API payloads are sent without compression.</text>
<text x="1055" y="230" font-family="monospace" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="1055" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">watch_session_lists</text>
<text x="1079" y="399" font-family="monospace" font-size="23" fill="#c0caf5">One revision query covers all connected accounts.</text>
<path d="M1500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">SessionListChanged</text>
<text x="1079" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Compatible browsers refetch only the changed connection.</text>
<path d="M1500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">compress_json_reads</text>
<text x="1079" y="939" font-family="monospace" font-size="23" fill="#c0caf5">Negotiate gzip or Brotli after the JSON response is redacted.</text>
<text x="55" y="1172" font-family="monospace" font-size="22" fill="#a9b1d6">The user socket carries only invalidations. The browser reloads the authorized REST list and keeps a slow fallback.</text>
</svg>
