<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2334 · Provider-scoped output diagnostics</text>
<text x="55" y="110" font-family="sans-serif" font-size="34" fill="#e6e9f5">Valid Codex and Portal events triggered Claude parser warnings.</text>
<text x="55" y="155" font-family="sans-serif" font-size="34" fill="#e6e9f5">Only Claude protocol events now enter Claude-specific validation.</text>
<path d="M1000 190 V1140" stroke="#565f89" stroke-dasharray="8 10"/>
<text x="60" y="230" font-family="sans-serif" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1060" y="230" font-family="sans-serif" font-size="24" fill="#9ece6a">AFTER</text>
<rect x="60" y="280" width="820" height="180" rx="14" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
<text x="84" y="322" font-family="sans-serif" font-size="28" fill="#565f89">handle_claude_output</text>
<text x="84" y="370" font-family="sans-serif" font-size="24" fill="#c0caf5">All providers share this handler.</text>
<text x="84" y="406" font-family="sans-serif" font-size="24" fill="#c0caf5">agent_type is available but ignored by validation.</text>
<rect x="1060" y="280" width="820" height="180" rx="14" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1084" y="322" font-family="sans-serif" font-size="28" fill="#9ece6a">handle_agent_output</text>
<text x="1084" y="370" font-family="sans-serif" font-size="24" fill="#c0caf5">Same transport, deduplication and persistence.</text>
<text x="1084" y="406" font-family="sans-serif" font-size="24" fill="#c0caf5">The handler name reflects its shared role.</text>
<rect x="60" y="540" width="820" height="180" rx="14" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
<text x="84" y="582" font-family="sans-serif" font-size="28" fill="#f7768e">ClaudeOutput::deserialize for every frame</text>
<text x="84" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Codex item.completed and Portal notices fail.</text>
<text x="84" y="666" font-family="sans-serif" font-size="24" fill="#c0caf5">Warnings print raw tool outputs and diffs.</text>
<rect x="1060" y="540" width="820" height="180" rx="14" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1084" y="582" font-family="sans-serif" font-size="28" fill="#9ece6a">parse_claude_event</text>
<text x="1084" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Gate on AgentType::Claude; skip type=portal.</text>
<text x="1084" y="666" font-family="sans-serif" font-size="24" fill="#c0caf5">Claude task-token accounting is preserved.</text>
<rect x="60" y="800" width="820" height="180" rx="14" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
<text x="84" y="842" font-family="sans-serif" font-size="28" fill="#f7768e">Misleading diagnostics</text>
<text x="84" y="890" font-family="sans-serif" font-size="24" fill="#c0caf5">Parsing failure is logged, not a delivery failure.</text>
<text x="84" y="926" font-family="sans-serif" font-size="24" fill="#c0caf5">Events still reach storage and clients.</text>
<rect x="1060" y="800" width="820" height="180" rx="14" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1084" y="842" font-family="sans-serif" font-size="28" fill="#9ece6a">Useful diagnostics, unchanged delivery</text>
<text x="1084" y="890" font-family="sans-serif" font-size="24" fill="#c0caf5">Real Claude failures still warn with session ID.</text>
<text x="1084" y="926" font-family="sans-serif" font-size="24" fill="#c0caf5">Error detail is bounded; payload dumps removed.</text>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: does not fix expired bearer retries or liveness evictions; non-Claude schemas are not validated here.</text>
</svg>