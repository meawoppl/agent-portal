<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2533 · Probe count retention with a bounded index-only count</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Every 60 s, each active session's over-limit probe materialized the whole session;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now it is a bounded count over the session_id index that stops at the cap + 1.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="240" width="840" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="282" font-size="26" fill="#7aa2f7">queue_truncation(session) on every message</text>
    <text x="104" y="322" font-size="23" fill="#a9b1d6">pending_truncations: DashSet&lt;Uuid&gt;</text>
    <text x="104" y="358" font-size="23" fill="#f7768e">drain_pending_truncations: all of them, every 60 s</text>
  </g>
  <line x1="500" y1="390" x2="500" y2="436" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <g>
    <rect x="80" y="440" width="840" height="230" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="482" font-size="26" fill="#f7768e">SELECT id ... WHERE session_id = $1</text>
    <text x="104" y="518" font-size="26" fill="#f7768e">OFFSET 2000 LIMIT 1   (no ORDER BY)</text>
    <text x="104" y="560" font-size="23" fill="#a9b1d6">prod plan: Bitmap Heap Scan via idx_messages_session_id</text>
    <text x="104" y="596" font-size="23" fill="#f7768e">whole session read, heap pages included</text>
    <text x="104" y="636" font-size="22" fill="#565f89">13k scans, 157M tuples in 2.4 days of prod counters</text>
  </g>
  <g>
    <rect x="80" y="730" width="840" height="130" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="772" font-size="26" fill="#7aa2f7">truncate_session_messages (no archive)</text>
    <text x="104" y="812" font-size="23" fill="#f7768e">OFFSET seek with row fetches, even under the cap</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1040" y="240" width="880" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1064" y="282" font-size="26" fill="#7aa2f7">queue_truncation(session) on every message</text>
    <text x="1064" y="322" font-size="23" fill="#a9b1d6">pending_truncations: DashSet&lt;Uuid&gt; (unchanged)</text>
    <text x="1064" y="358" font-size="23" fill="#a9b1d6">drain_pending_truncations every 60 s (unchanged)</text>
  </g>
  <line x1="1480" y1="390" x2="1480" y2="436" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1040" y="440" width="880" height="230" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="482" font-size="26" fill="#9ece6a">session_over_limit(conn, session, max)</text>
    <text x="1064" y="522" font-size="23" fill="#9ece6a">SELECT count(*) &gt; $2 FROM</text>
    <text x="1064" y="558" font-size="23" fill="#9ece6a">(SELECT 1 ... WHERE session_id = $1 LIMIT $2+1)</text>
    <text x="1064" y="596" font-size="23" fill="#a9b1d6">stops at max+1; index-only where pages are all-visible</text>
    <text x="1064" y="636" font-size="22" fill="#565f89">same exact answer; DB test pins the boundary</text>
  </g>
  <g>
    <rect x="1040" y="730" width="880" height="130" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="772" font-size="26" fill="#7aa2f7">truncate_session_messages (no archive)</text>
    <text x="1064" y="812" font-size="23" fill="#9ece6a">returns early unless session_over_limit</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Not covered: probing less often; that needs durable dirty state and is a separate follow-up.</text>
</svg>
