<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<defs>
  <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
  </marker>
  <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
  </marker>
</defs>
<g font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif" fill="#c0caf5">

<text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2321 · Add Claude auto mode as a launch and schedule option</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">Claude sessions offered only "ask for everything" or "skip all permissions";</text>
<text x="55" y="140" font-size="34" fill="#e6e9f5">an Auto mode checkbox now passes --permission-mode auto at the same level.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

<text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
<text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
<line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

<!-- BEFORE -->
<rect x="65" y="250" width="870" height="190" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="89" y="292" font-size="26" fill="#7aa2f7">launch_dialog.rs / schedule_dialog.rs</text>
<text x="89" y="334" font-size="23" fill="#a9b1d6">one permission checkbox: skip_permissions_label</text>
<text x="89" y="374" font-size="23" fill="#a9b1d6">Claude: --dangerously-skip-permissions</text>
<text x="89" y="412" font-size="22" fill="#565f89">auto mode only by typing it into extra args</text>

<line x1="500" y1="440" x2="500" y2="520" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
<text x="516" y="486" font-size="22" fill="#565f89">claude_args</text>

<rect x="65" y="525" width="870" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="567" font-size="26" fill="#f7768e">Two choices, both bad for long sessions</text>
<text x="89" y="609" font-size="23" fill="#a9b1d6">unchecked: permissionMode "default"</text>
<text x="89" y="649" font-size="23" fill="#a9b1d6">checked: every permission check bypassed</text>
<text x="89" y="687" font-size="22" fill="#565f89">no Shift+Tab mode switch in the portal</text>

<line x1="500" y1="715" x2="500" y2="795" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>

<rect x="65" y="800" width="870" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="842" font-size="26" fill="#f7768e">Routine tool calls become permission cards</text>
<text x="89" y="884" font-size="23" fill="#a9b1d6">more prompts than the same work in the CLI</text>
<text x="89" y="922" font-size="22" fill="#565f89">unless the user disables checks entirely</text>

<!-- AFTER -->
<rect x="1040" y="250" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="292" font-size="26" fill="#7aa2f7">skip_permissions.rs</text>
<text x="1064" y="334" font-size="23" fill="#9ece6a">auto_mode_args(Claude) = --permission-mode auto</text>
<text x="1064" y="374" font-size="23" fill="#9ece6a">AUTO_MODE_LABEL checkbox in both dialogs</text>
<text x="1064" y="412" font-size="22" fill="#565f89">None for Codex, Muse, Antigravity: box hidden</text>

<line x1="1487" y1="440" x2="1487" y2="520" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="1503" y="486" font-size="22" fill="#9ece6a">claude_args</text>

<rect x="1040" y="525" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="567" font-size="26" fill="#9ece6a">Three choices, mutually exclusive</text>
<text x="1064" y="609" font-size="23" fill="#a9b1d6">checking auto clears skip_permissions, and back</text>
<text x="1064" y="649" font-size="23" fill="#a9b1d6">skip wins if both are ever set</text>
<text x="1064" y="687" font-size="22" fill="#565f89">agent switch in schedule dialog resets auto_mode</text>

<line x1="1487" y1="715" x2="1487" y2="795" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

<rect x="1040" y="800" width="895" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="842" font-size="26" fill="#9ece6a">Classifier approves routine calls</text>
<text x="1064" y="884" font-size="23" fill="#a9b1d6">the rest still surface as permission cards</text>
<text x="1064" y="922" font-size="22" fill="#565f89">verified: CLI reports permissionMode "auto"</text>

<rect x="1040" y="990" width="895" height="135" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="1032" font-size="26" fill="#9ece6a">Editing a task restores the box</text>
<text x="1064" y="1074" font-size="23" fill="#a9b1d6">strip_auto_mode_args: both spellings, incl. =auto</text>
<text x="1064" y="1108" font-size="22" fill="#565f89">--permission-mode plan etc. left in extra args</text>

<text x="55" y="1172" font-size="22" fill="#565f89">Scope: launch-time only, no mid-session mode switch; on models without auto mode (e.g. Haiku) the CLI silently stays in default.</text>
</g>
</svg>
