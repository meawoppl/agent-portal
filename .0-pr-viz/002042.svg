<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2042 · compact_count stops owning its own k-formatting</text>

  <!-- Thesis -->
  <text x="55" y="100" font-size="34" fill="#e6e9f5">Two sibling helpers each formatted the one-decimal k suffix by hand;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now compact_count delegates, so the suffix has a single definition.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <!-- Panel labels + center divider (keep) -->
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE panel: x 55-945 ==================== -->
  <g>
    <rect x="80" y="250" width="860" height="150" fill="#1e202e" stroke="#7aa2f7" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#7aa2f7">compact_count(n: i64)</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">n &lt; 1000 -&gt; integer, else format "{:.1}k" - own copy</text>
    <text x="104" y="366" font-size="22" fill="#565f89">token in/out chips, count-up values</text>
  </g>

  <g>
    <rect x="80" y="450" width="860" height="150" fill="#1e202e" stroke="#7aa2f7" stroke-width="1.5"/>
    <text x="104" y="490" font-size="26" fill="#7aa2f7">compact_metric_count(v: f64)</text>
    <text x="104" y="530" font-size="23" fill="#a9b1d6">v &lt; 1000.0 -&gt; "{:.0}", else format "{:.1}k" - own copy</text>
    <text x="104" y="566" font-size="22" fill="#565f89">thinking / subagent sparkline values</text>
  </g>

  <line x1="320" y1="600" x2="320" y2="690" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="336" y="650" font-size="22" fill="#565f89">same suffix, twice</text>

  <g>
    <rect x="80" y="700" width="860" height="160" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="740" font-size="26" fill="#f7768e">"{:.1}k" written twice</text>
    <text x="104" y="780" font-size="23" fill="#a9b1d6">a tweak to rounding or the suffix must land in both</text>
    <text x="104" y="816" font-size="22" fill="#565f89">turn_metrics_display.rs - adjacent functions</text>
  </g>

  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">one suffix, 2 definitions</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">copies drift - chips disagree on large counts</text>
  </g>

  <!-- ==================== AFTER panel: x 1040-1945 ==================== -->
  <g>
    <rect x="1065" y="250" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="290" font-size="26" fill="#9ece6a">compact_count(n: i64)</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">n &lt; 1000 -&gt; integer, else compact_metric_count(n as f64)</text>
    <text x="1089" y="366" font-size="22" fill="#565f89">exact ints kept - negatives and huge values unchanged</text>
  </g>

  <line x1="1305" y1="400" x2="1305" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1321" y="450" font-size="22" fill="#565f89">delegates</text>

  <g>
    <rect x="1065" y="495" width="860" height="160" fill="#1e202e" stroke="#7aa2f7" stroke-width="1.5"/>
    <text x="1089" y="535" font-size="26" fill="#7aa2f7">compact_metric_count(v: f64)</text>
    <text x="1089" y="575" font-size="23" fill="#a9b1d6">sole owner of the "{:.1}k" suffix now</text>
    <text x="1089" y="611" font-size="22" fill="#565f89">unchanged body - the delegation target</text>
  </g>

  <line x1="1305" y1="655" x2="1305" y2="745" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="1321" y="705" font-size="22" fill="#565f89">existing tests still pin it</text>

  <g>
    <rect x="1065" y="750" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="790" font-size="26" fill="#7aa2f7">turn_metrics_footer tests</text>
    <text x="1089" y="830" font-size="23" fill="#a9b1d6">1, 999, 1000 -&gt; "1.0k", 1500, 1M all green</text>
    <text x="1089" y="866" font-size="22" fill="#565f89">behavior identical - pure delegation, no new branch</text>
  </g>

  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">one suffix, 1 definition</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">one rounding fix now covers every chip</text>
  </g>

  <!-- Footer -->
  <text x="55" y="1172" font-size="22" fill="#565f89">No rendered output changes: 999 -&gt; "999", 1000 -&gt; "1.0k", 1M -&gt; "1000.0k", exactly as before.</text>
</svg>
