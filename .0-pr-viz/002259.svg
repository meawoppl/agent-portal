<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2259 · Read the web-push tag so session notifications replace</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The backend sends the collapse key as "tag" but sw.js read "collapse_key",</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">so notifications stacked; sw.js now reads "tag" and they replace per session.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">WebPushBody (backend/src/push/webpush.rs)</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">session_id, event_kind, title, body, tag</text>
  <text x="79" y="360" font-size="23" fill="#a9b1d6">tag = payload.collapse_key (the session id)</text>
  <line x1="505" y1="395" x2="505" y2="440" stroke="#565f89" stroke-width="2" marker-end="url(#arr-dim)"/>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">frontend/sw.js push handler</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">tag: payload.collapse_key || undefined</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">no sender emits collapse_key, so tag is always unset</text>
  <line x1="505" y1="595" x2="505" y2="640" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="55" y="645" width="900" height="210" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Two pushes for session s-1</text>
  <text x="79" y="730" font-size="23" fill="#f7768e">showNotification tags: [null, null]</text>
  <text x="79" y="770" font-size="23" fill="#f7768e">two separate notifications: the stack grows per event</text>
  <text x="79" y="820" font-size="23" fill="#a9b1d6">measured: real sw.js in Node with a stubbed worker</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">WebPushBody (unchanged)</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">new test pins session_id, title, body, tag</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">a rename now fails the build, not the browser</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#565f89" stroke-width="2" marker-end="url(#arr-dim)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">frontend/sw.js push handler</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">tag: payload.tag || undefined</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">header comment now names the real wire fields</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="210" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">Two pushes for session s-1</text>
  <text x="1069" y="730" font-size="23" fill="#9ece6a">showNotification tags: ["s-1", "s-1"]</text>
  <text x="1069" y="770" font-size="23" fill="#9ece6a">same tag: the newer notification replaces the older</text>
  <text x="1069" y="820" font-size="23" fill="#a9b1d6">one card per session, newest wins</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Not changed: renotify stays unset, so a replaced notification updates quietly rather than alerting again.</text>
</svg>
