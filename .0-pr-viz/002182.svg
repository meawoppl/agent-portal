<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="pr2182-title pr2182-desc">
  <title id="pr2182-title">PR 2182 - Route poisoned mutex locks via shared helper</title>
  <desc id="pr2182-desc">Nine locks recovered from mutex poisoning in three different spellings; all now call shared::sync::lock_recovering_poison.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="68" fill="#565f89" font-family="sans-serif" font-size="24" letter-spacing="1">PR #2182 - Route poisoned mutex locks via shared helper</text>
  <text x="55" y="122" fill="#e6e9f5" font-family="sans-serif" font-size="34" font-weight="700">Nine locks recovered from poison in three spellings.</text>
  <text x="55" y="164" fill="#e6e9f5" font-family="sans-serif" font-size="34" font-weight="700">One shared helper now owns the recovery.</text>
  <line x1="55" y1="192" x2="1945" y2="192" stroke="#3d4666" stroke-width="2"/>

  <text x="55" y="244" fill="#f7768e" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1055" y="244" fill="#9ece6a" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <line x1="1000" y1="210" x2="1000" y2="1140" stroke="#3d4666" stroke-width="3" stroke-dasharray="14 16"/>

  <rect x="70" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="1085" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>

  <rect x="115" y="325" width="760" height="150" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="371" fill="#c0caf5" font-family="sans-serif" font-size="28" font-weight="700">manifest writers - full path</text>
  <text x="145" y="415" fill="#c0caf5" font-family="monospace" font-size="23">.unwrap_or_else(PoisonError::into_inner)</text>
  <text x="145" y="453" fill="#a9b1d6" font-family="sans-serif" font-size="24">history.rs + background.rs</text>

  <rect x="115" y="500" width="760" height="150" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="546" fill="#c0caf5" font-family="sans-serif" font-size="28" font-weight="700">heartbeat - private wrapper fn</text>
  <text x="145" y="590" fill="#c0caf5" font-family="monospace" font-size="23">lock_timestamp(mutex)</text>
  <text x="145" y="628" fill="#a9b1d6" font-family="sans-serif" font-size="24">heartbeat.rs, own rationale comment</text>

  <rect x="115" y="675" width="760" height="150" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="721" fill="#c0caf5" font-family="sans-serif" font-size="28" font-weight="700">tunnel + stt - closure form</text>
  <text x="145" y="765" fill="#c0caf5" font-family="monospace" font-size="23">.unwrap_or_else(|e| e.into_inner())</text>
  <text x="145" y="803" fill="#a9b1d6" font-family="sans-serif" font-size="24">tunnel.rs prober (x2) + stt tests (x4)</text>

  <rect x="115" y="850" width="760" height="150" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="145" y="896" fill="#f7768e" font-family="sans-serif" font-size="28" font-weight="700">same recovery, three spellings</text>
  <text x="145" y="940" fill="#c0caf5" font-family="sans-serif" font-size="24">each site re-argues why poison is safe</text>
  <text x="145" y="978" fill="#a9b1d6" font-family="sans-serif" font-size="24">one arm could panic while others recover</text>

  <rect x="1125" y="325" width="765" height="150" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1155" y="371" fill="#9ece6a" font-family="sans-serif" font-size="28" font-weight="700">manifest writers routed</text>
  <text x="1155" y="415" fill="#c0caf5" font-family="monospace" font-size="22">lock_recovering_poison(&amp;manifest_write_lock)</text>
  <text x="1155" y="453" fill="#a9b1d6" font-family="sans-serif" font-size="24">history.rs + background.rs</text>

  <rect x="1125" y="500" width="765" height="150" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1155" y="546" fill="#9ece6a" font-family="sans-serif" font-size="28" font-weight="700">heartbeat methods routed</text>
  <text x="1155" y="590" fill="#c0caf5" font-family="monospace" font-size="22">lock_recovering_poison(&amp;last_received)</text>
  <text x="1155" y="628" fill="#a9b1d6" font-family="sans-serif" font-size="24">private lock_timestamp deleted</text>

  <rect x="1125" y="675" width="765" height="150" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1155" y="721" fill="#9ece6a" font-family="sans-serif" font-size="28" font-weight="700">tunnel + stt routed</text>
  <text x="1155" y="765" fill="#c0caf5" font-family="monospace" font-size="22">lock_recovering_poison(&amp;prober)</text>
  <text x="1155" y="803" fill="#a9b1d6" font-family="sans-serif" font-size="24">tunnel.rs prober + stt ENV_LOCK</text>

  <rect x="1125" y="850" width="765" height="150" rx="16" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1155" y="896" fill="#7aa2f7" font-family="monospace" font-size="26" font-weight="700">shared::sync::lock_recovering_poison</text>
  <text x="1155" y="940" fill="#c0caf5" font-family="sans-serif" font-size="24">rationale documented once, in shared/src/sync.rs</text>
  <text x="1155" y="978" fill="#a9b1d6" font-family="sans-serif" font-size="24">new unit test pins recover-and-keep-going</text>

  <rect x="110" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="138" y="1103" fill="#a9b1d6" font-family="sans-serif" font-size="22">Three spellings of one recovery invite silent drift.</text>
  <rect x="1125" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1153" y="1103" fill="#a9b1d6" font-family="sans-serif" font-size="22">One helper owns the recovery; call sites just ask.</text>

  <text x="55" y="1172" fill="#565f89" font-family="sans-serif" font-size="22">Scope: 9 sites in backend, session-lib, portal-stt; archive cache keeps poison-as-cold-cache; no behavior change.</text>
</svg>
