<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="monospace" font-size="24" fill="#a9b1d6">PR #2397 · Native Codex billing and explicit resume failures</text>
<text x="55" y="108" font-family="monospace" font-size="34" fill="#e6e9f5">Native cost deltas add once; a failed resume keeps the original conversation intact.</text>
<path d="M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="225" font-family="monospace" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1055" y="225" font-family="monospace" font-size="24" fill="#9ece6a">AFTER</text>
<g><rect x="55" y="285" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="80" y="340" font-family="monospace" font-size="28" fill="#7aa2f7">TurnOutcome.total_cost_usd: None</text>
<text x="80" y="393" font-family="monospace" font-size="25" fill="#c0caf5">Native billing is unavailable in metrics</text>
</g>
<g><rect x="55" y="530" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="80" y="585" font-family="monospace" font-size="28" fill="#7aa2f7">TurnMetrics report IDs</text>
<text x="80" y="638" font-family="monospace" font-size="25" fill="#c0caf5">Every insert receives a new database ID</text>
</g>
<g><rect x="55" y="775" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="80" y="830" font-family="monospace" font-size="28" fill="#7aa2f7">thread_resume failure</text>
<text x="80" y="883" font-family="monospace" font-size="25" fill="#c0caf5">Ordinary path silently starts fresh</text>
</g>
<g><rect x="1055" y="285" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="1080" y="340" font-family="monospace" font-size="28" fill="#7aa2f7">account_usage_read_with</text>
<text x="1080" y="393" font-family="monospace" font-size="25" fill="#c0caf5">Thread baseline + native USD micro deltas</text>
</g>
<g><rect x="1055" y="530" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="1080" y="585" font-family="monospace" font-size="28" fill="#7aa2f7">Metric ID + transaction</text>
<text x="1080" y="638" font-family="monospace" font-size="25" fill="#c0caf5">Replay cannot add session cost twice</text>
</g>
<g><rect x="1055" y="775" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="1080" y="830" font-family="monospace" font-size="28" fill="#7aa2f7">model_provider_error</text>
<text x="1080" y="883" font-family="monospace" font-size="25" fill="#c0caf5">Actionable reason; no replacement thread</text>
</g>
<text x="55" y="1172" font-family="monospace" font-size="22" fill="#e0af68">Missing billing stays unknown; queries time out after 2s. Reports are best effort; historical costs are not backfilled.</text>
</svg>