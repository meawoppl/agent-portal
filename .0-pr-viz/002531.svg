<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="monospace" font-size="24" fill="#a9b1d6">PR #2531 · Browser redaction checks</text>
<text x="55" y="103" font-family="monospace" font-size="34" fill="#e6e9f5">Concurrent sockets share a fresh database generation read.</text>
<text x="55" y="146" font-family="monospace" font-size="34" fill="#e6e9f5">The worker seals each batch before reading PostgreSQL.</text>
<path d="M55 175H1945 M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="monospace" font-size="22" fill="#f7768e">BEFORE</text>
<rect x="55" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">Browser WebSocket frames</text>
<text x="79" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Each input, live frame, or replay batch checks rules.</text>
<path d="M500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">Database pool</text>
<text x="79" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Each frame checks out a connection.</text>
<text x="79" y="711" font-family="monospace" font-size="23" fill="#c0caf5">Session frames also look up the owner.</text>
<path d="M500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">Delivery</text>
<text x="79" y="939" font-family="monospace" font-size="23" fill="#c0caf5">Send only after the current generation passes.</text>
<text x="1055" y="230" font-family="monospace" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="1055" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">BrowserRedaction::check</text>
<text x="1079" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Queue concurrent checks by session ID.</text>
<path d="M1500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">Batch query</text>
<text x="1079" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Share a checkout, owner lookup, and generation read.</text>
<path d="M1500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">Later requests</text>
<text x="1079" y="939" font-family="monospace" font-size="23" fill="#c0caf5">Get a fresh database check in a later batch.</text>
<text x="55" y="1172" font-family="monospace" font-size="22" fill="#a9b1d6">Each socket waits for its own checked rules; missing or stale rules prevent delivery.</text>
</svg>
