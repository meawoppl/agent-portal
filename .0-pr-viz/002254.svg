<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2254 · Condense thinking bursts into one peek line</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Peek printed one line per thinking marker, so -n 10 could be all markers;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now each consecutive run is one line, and -n counts the condensed lines.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">peek_agent_messages</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">loads the newest `limit` raw rows</text>
  <text x="79" y="360" font-size="23" fill="#a9b1d6">summarize_message per row, nothing merged</text>
  <line x1="505" y1="395" x2="505" y2="440" stroke="#565f89" stroke-width="2" marker-end="url(#arr-dim)"/>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">summarize_claude: ClaudeOutput::System</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">thinking_tokens marker -> "system: ThinkingTokens"</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">kind "system", estimated_tokens dropped</text>
  <line x1="505" y1="595" x2="505" y2="640" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="55" y="645" width="900" height="300" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">agent-portal message peek -n 10</text>
  <text x="79" y="725" font-size="23" fill="#a9b1d6">system   system: ThinkingTokens</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">system   system: ThinkingTokens</text>
  <text x="79" y="795" font-size="23" fill="#a9b1d6">system   system: ThinkingTokens</text>
  <text x="79" y="830" font-size="23" fill="#a9b1d6">... seven more markers ...</text>
  <text x="79" y="880" font-size="23" fill="#f7768e">the tool call that explains the work is off-window;</text>
  <text x="79" y="915" font-size="23" fill="#f7768e">the peeking agent pages with -n 20, -n 50 to find it</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">peek_agent_messages</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">loads limit x PEEK_OVERFETCH (8), cap 400 rows</text>
  <text x="1069" y="360" font-size="23" fill="#9ece6a">condense_thinking, then keep the newest `limit` lines</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">as_thinking_tokens() / thinking_estimate</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">marker -> kind "thinking", running estimate kept</text>
  <text x="1069" y="560" font-size="23" fill="#9ece6a">runs of thinking rows merge: peak estimate, newest id</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="300" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">agent-portal message peek -n 10</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">thinking   thinking x 7 (~1.3k tokens)</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">tool_use   Bash: cargo test -p backend</text>
  <text x="1069" y="795" font-size="23" fill="#9ece6a">thinking   thinking x 3 (~400 tokens)</text>
  <text x="1069" y="830" font-size="23" fill="#a9b1d6">text       Tests pass; opening the PR</text>
  <text x="1069" y="880" font-size="23" fill="#9ece6a">ten lines, each a real step;</text>
  <text x="1069" y="915" font-size="23" fill="#9ece6a">Codex reasoning runs read "thinking x N" (no estimate)</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Not in scope: thinking separated by other rows stays as separate lines; only consecutive runs condense. The sample peek lines are illustrative.</text>
</svg>
