<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2108 - Default performance p95 overlay off</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Performance charts now open with p50/value traces only; p95 remains one toggle away.</text>
<path d="M55 178 H1945 M1000 195 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>

<g>
<rect x="55" y="285" width="870" height="555" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="90" y="335" font-family="sans-serif" font-size="28" fill="#f7768e">p95 was enabled on first load</text>
<text x="90" y="382" font-family="sans-serif" font-size="24" fill="#c0caf5">Each model line also drew a dashed p95 line by default.</text>
<path d="M130 725 H860 M130 610 H860 M130 495 H860" stroke="#3d4666" fill="none"/>
<path d="M130 725 V455" stroke="#565f89" fill="none"/>
<path d="M130 725 H860" stroke="#565f89" fill="none"/>
