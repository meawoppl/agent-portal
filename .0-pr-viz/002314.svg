<text x="95" y="665" font-size="26" fill="#f7768e">crypto-bigint 0.5.5</text>
<text x="95" y="720" font-size="23">RUSTSEC-2026-0387: secret-dependent timing.</text>
<text x="95" y="765" font-size="23">RustSec Audit blocks SDK update PRs.</text>
<text x="1095" y="665" font-size="26" fill="#9ece6a">crypto-bigint 0.7.8</text>
<text x="1095" y="720" font-size="23">VAPID ES256 token verified independently with ring.</text>
<text x="1095" y="765" font-size="23">Audience and expiry validated; no new exceptions.</text>
<text x="55" y="1172" font-size="22" fill="#a9b1d6">Scope: local patch until web-push publishes updated signing dependencies; existing RSA exception remains.</text>
