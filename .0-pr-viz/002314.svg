<rect x="1065" y="290" width="860" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="95" y="340" font-size="26" fill="#7aa2f7">web-push 0.11 (registry)</text>
<text x="95" y="395" font-size="23">jwt-simple 0.12 -> p256 0.13</text>
<text x="1095" y="340" font-size="26" fill="#7aa2f7">web-push 0.11 (local patch)</text>
<text x="1095" y="395" font-size="23" fill="#9ece6a">jwt-simple 0.15 -> p256 0.14</text>
