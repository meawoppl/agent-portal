<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<g font-family="sans-serif" fill="#c0caf5">
<text x="55" y="52" font-size="24" fill="#a9b1d6">PR #2314 · Use patched arithmetic for Web Push signing</text>
<text x="55" y="105" font-size="34" fill="#e6e9f5">Web Push signing pulled vulnerable crypto-bigint 0.5.5;</text>
<text x="55" y="148" font-size="34" fill="#e6e9f5">update the signing dependency chain to patched arithmetic.</text>
