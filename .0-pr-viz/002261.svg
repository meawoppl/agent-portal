<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2261 · Add a Plugins section to the README</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The README never mentioned plugins outside one docs-table row;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">a Features section now explains the split and links the plugin repo.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">README.md Features</text>
  <text x="79" y="325" font-size="23" fill="#f7768e">no Plugins section</text>
  <text x="79" y="360" font-size="23" fill="#a9b1d6">no link to meawoppl/agent-portal-plugins</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">README.md Documentation table</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">Plugin Authoring row only</text>
  <text x="79" y="560" font-size="23" fill="#f7768e">docs/PLUGIN_ARCHITECTURE.md unlinked</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="330" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">### Plugins (README.md Features)</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">agent-portal plugin install github:...//kicadmium</text>
  <text x="1069" y="365" font-size="23" fill="#a9b1d6">Portal: sessions, UI, lifecycle, plugin runtime</text>
  <text x="1069" y="400" font-size="23" fill="#a9b1d6">plugin: tools, skills, commands, docked surface</text>
  <text x="1069" y="440" font-size="23" fill="#a9b1d6">skills load where [[detect]] rules match</text>
  <text x="1069" y="480" font-size="23" fill="#9ece6a">kicadmium, visilog, unlinked, yapcad,</text>
  <text x="1069" y="515" font-size="23" fill="#9ece6a">engineering-presentations</text>
  <text x="1069" y="550" font-size="23" fill="#a9b1d6">links both plugin docs</text>
  <line x1="1495" y1="575" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">README.md Documentation table</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">+ Plugin Architecture row</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">next to Plugin Authoring</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Docs only: no code changes.</text>
</svg>
