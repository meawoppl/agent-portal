<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200"><rect width="2000" height="1200" fill="#1a1b26"/>
<g font-family="Arial, sans-serif"><text x="55" y="52" font-size="24" fill="#a9b1d6">PR #2444 · Secrets inventory cleanup</text><text x="55" y="105" font-size="34" fill="#e6e9f5">Repeated details crowded the vault; sortable columns now carry the metadata.</text><text x="55" y="149" font-size="34" fill="#e6e9f5">Actions stay together and version dates remain available on expansion.</text><path d="M55 177 H1945 M1000 205 V1120" stroke="#3d4666"/>
<text x="75" y="235" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
<rect x="75" y="290" width="870" height="265" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="100" y="340" font-size="28" fill="#7aa2f7">Inventory</text>
<text x="100" y="405" font-size="25" fill="#c0caf5">Name | Scope | Version | Owner | Updated</text>
<text x="100" y="475" font-size="23" fill="#a9b1d6">Fixed order; Reference lives in expanded details.</text>
<rect x="75" y="650" width="870" height="265" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="100" y="700" font-size="28" fill="#7aa2f7">Expanded details</text>
<text x="100" y="765" font-size="25" fill="#c0caf5">Audience and deletion explanations repeat policy.</text>
<text x="100" y="835" font-size="23" fill="#a9b1d6">Delete sits below sharing; numbered history is indented.</text>
<text x="1055" y="235" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
<rect x="1055" y="290" width="870" height="265" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="340" font-size="28" fill="#7aa2f7">Sortable inventory</text>
<text x="1080" y="405" font-size="25" fill="#c0caf5">Name | Scope | Version | Owner</text>
<text x="1080" y="475" font-size="23" fill="#a9b1d6">Reference | Shared with; dates live in version history.</text>
<rect x="1055" y="650" width="870" height="265" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="700" font-size="28" fill="#7aa2f7">Compact expanded details</text>
<text x="1080" y="765" font-size="25" fill="#c0caf5">Copy secret | Replace value | Delete secret</text>
<text x="1080" y="835" font-size="23" fill="#a9b1d6">Version, date and author align without a list gutter.</text>
<text x="55" y="1172" font-size="22" fill="#a9b1d6">Metadata layout only; browser verification, permissions and two-click deletion remain enforced.</text></g></svg>