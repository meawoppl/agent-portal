<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1795 · History: click a user to filter their sessions; count real user messages</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The Msgs column counted tool results and task-complete reinjections as user activity;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">a User msgs column now counts what humans typed, and clicking a user filters to them.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE ==================== -->
  <g>
    <rect x="80" y="250" width="840" height="180" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#7aa2f7">message_counts["user"] — a role histogram</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">every wire record with role "user" counts once</text>
    <text x="104" y="366" font-size="21" fill="#f7768e">tool_result frames ride the user role — counted</text>
    <text x="104" y="400" font-size="21" fill="#f7768e">task-complete reinjections (XML-only) — counted as if typed</text>
  </g>

  <g>
    <rect x="80" y="490" width="840" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="532" font-size="26" fill="#c0caf5">finding one user's sessions</text>
    <text x="104" y="570" font-size="23" fill="#a9b1d6">the owner cell is inert text</text>
    <text x="104" y="604" font-size="21" fill="#565f89">scroll up, open the dropdown, find the same name you are looking at</text>
  </g>

  <line x1="500" y1="640" x2="500" y2="922" stroke="#f7768e" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="930" width="840" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="976" font-size="26" fill="#c0caf5">Msgs overstates human activity</text>
    <text x="104" y="1014" font-size="23" fill="#f7768e">a busy tool loop looks like a chatty user</text>
    <text x="104" y="1048" font-size="21" fill="#565f89">and per-row navigation to a user's other work takes three detours</text>
  </g>

  <!-- ==================== AFTER ==================== -->
  <g>
    <rect x="1065" y="250" width="860" height="180" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="292" font-size="26" fill="#9ece6a">shared::user_messages — the counting rule</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">a user-role record counts iff its human-visible text survives</text>
    <text x="1089" y="364" font-size="23" fill="#a9b1d6">strip_collapsible_notices — text blocks only, so tool results drop out</text>
    <text x="1089" y="398" font-size="21" fill="#565f89">the same splitter the frontend collapses notices with — one rule, in lockstep</text>
  </g>

  <line x1="1495" y1="430" x2="1495" y2="486" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="490" width="860" height="180" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="532" font-size="26" fill="#7aa2f7">manifest.user_message_count — Option, additive</text>
    <text x="1089" y="570" font-size="23" fill="#a9b1d6">written at archive time for new and re-archived sessions</text>
    <text x="1089" y="604" font-size="23" fill="#9ece6a">old manifests backfill when their transcript is viewed</text>
    <text x="1089" y="638" font-size="21" fill="#565f89">write serialized with the sweep + re-read under lock — a CAS, no clobber</text>
  </g>

  <line x1="1495" y1="670" x2="1495" y2="726" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="730" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="772" font-size="26" fill="#c0caf5">the table</text>
    <text x="1089" y="810" font-size="23" fill="#a9b1d6">"User msgs" column — an em dash until the backfill has run</text>
    <text x="1089" y="844" font-size="21" fill="#565f89">owner cell → click → ?user= filter; the dropdown mirrors it via selected</text>
  </g>

  <line x1="1495" y1="880" x2="1495" y2="922" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="930" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="976" font-size="26" fill="#c0caf5">verified end-to-end on a synthetic pre-field archive</text>
    <text x="1089" y="1014" font-size="23" fill="#9ece6a">4 user-role records → count 2: reinjection and tool_result excluded</text>
    <text x="1089" y="1048" font-size="21" fill="#565f89">list showed — before the view, 2 immediately after; ?user= narrowed correctly</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Archive-side only — live sessions get their count at first archive; a user message that is legitimately XML-only is deliberately not counted.</text>
</svg>
