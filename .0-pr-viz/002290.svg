<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2290 · Inject plugin prompts and apply selection changes live</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Plugin prompts never reached a session and every plugin change needed</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">a restart; prompts now join the reminder, and changes arrive next turn.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">[[prompts]] in the manifest</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">parsed by plugin info / preview only</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">never injected into any session</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">Session Plugins menu: save</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">selection file written on the launcher</text>
  <text x="79" y="560" font-size="23" fill="#f7768e">"Saved. Restart this session to apply."</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Running agent</text>
  <text x="79" y="725" font-size="23" fill="#f7768e">keeps its launch-time skills until restart</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">plugin_prompts(config)</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">"## Plugin Prompts" in every agent's reminder</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">recorded as Prompt entries in the context record</text>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">SessionPlugins with a selection</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">plugin_context_update into the ContextInbox</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">applies_live: "uses this from its next turn"</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">input_delivery: next real input</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">fold_context_update: only the change</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">"use only these skills; stop using others"</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Unchanged: host-wide enable/disable and project policy still apply at the next launch.</text>
</svg>
