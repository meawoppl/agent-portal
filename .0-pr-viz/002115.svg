<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Cumulative token totals in Performance</title>
  <desc id="desc">The Performance panel gains a cumulative token chart that begins at zero for the selected window and shows per-model and overall totals without double-counting usage subsets.</desc>
  <rect width="2000" height="1200" fill="#1a1b26"/>

  <text x="80" y="105" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="700">Performance Now Tracks Total Tokens Consumed</text>
  <text x="80" y="158" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">A range-scoped cumulative view shows each model and the all-model total from an explicit zero baseline.</text>

  <line x1="1000" y1="210" x2="1000" y2="1045" stroke="#3d4666" stroke-width="3" stroke-dasharray="10 12"/>

  <text x="90" y="255" fill="#f7768e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="90" y="305" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">Settings / Performance</text>
  <text x="90" y="348" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Latency, throughput, cache rate, and cost were plotted.</text>

  <rect x="90" y="395" width="830" height="460" rx="16" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
  <text x="135" y="460" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="600">Throughput</text>
  <line x1="150" y1="770" x2="860" y2="770" stroke="#565f89" stroke-width="2"/>
  <line x1="150" y1="525" x2="150" y2="770" stroke="#565f89" stroke-width="2"/>
  <path d="M150 735 C270 685 350 705 470 615 S690 545 860 475" fill="none" stroke="#7aa2f7" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 705 C270 645 365 665 500 565 S700 505 860 445" fill="none" stroke="#bb9af7" stroke-width="8" stroke-linecap="round"/>
  <text x="135" y="825" fill="#f7768e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">No selected-window token total or per-model accumulation.</text>

  <rect x="140" y="915" width="730" height="78" rx="12" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="175" y="965" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Token counters existed in MetricBucket but had no total view.</text>

  <text x="1080" y="255" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="4">AFTER</text>
  <text x="1080" y="305" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">Total tokens consumed</text>
  <text x="1080" y="348" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Every trace starts at 0 at the selected-window boundary.</text>

  <rect x="1080" y="395" width="830" height="460" rx="16" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
  <text x="1125" y="450" fill="#7aa2f7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Opus 5.5 / standard  4.2M</text>
  <text x="1125" y="486" fill="#bb9af7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Sonnet 5.5 / standard  2.8M</text>
  <text x="1125" y="522" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Total  7.0M</text>
  <line x1="1140" y1="785" x2="1850" y2="785" stroke="#565f89" stroke-width="2"/>
  <line x1="1140" y1="565" x2="1140" y2="785" stroke="#565f89" stroke-width="2"/>
  <path d="M1140 785 L1290 755 L1450 700 L1610 650 L1760 585 L1850 550" fill="none" stroke="#7aa2f7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1140 785 L1290 775 L1450 745 L1610 710 L1760 665 L1850 630" fill="none" stroke="#bb9af7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1140 785 L1290 745 L1450 660 L1610 575 L1760 475 L1850 415" fill="none" stroke="#c0caf5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1140" cy="785" r="10" fill="#9ece6a"/>
  <text x="1125" y="825" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">0 at 30d ago</text>
  <text x="1710" y="825" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">today</text>

  <rect x="1080" y="895" width="830" height="116" rx="14" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="1120" y="938" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="600">MetricBucket::consumed_tokens</text>
  <text x="1120" y="975" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Claude adds disjoint cache buckets; Codex and Muse do not.</text>

  <rect x="220" y="1080" width="1560" height="70" rx="14" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="260" y="1125" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Token semantics: shared/src/api/metrics.rs</text>
  <text x="1070" y="1125" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Chart: performance_panel/charts.rs</text>
</svg>
