<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2421 · Secrets belongs in Settings</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">The dashboard still had a Secrets shortcut; Settings now owns the inventory.</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">Legacy links redirect into its Secrets panel and retain cleanup-job context.</text>
<path d="M55 178H1945 M1000 205V1130" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="230" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="317" font-family="sans-serif" font-size="28" fill="#f7768e">Dashboard header</text>
<text x="79" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">Secrets shortcut beside Settings</text>
<text x="79" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">Two normal entry points remain</text>
<rect x="1055" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="317" font-family="sans-serif" font-size="28" fill="#9ece6a">Dashboard header</text>
<text x="1079" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">Settings button only</text>
<text x="1079" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">Secrets is a panel inside Settings</text>
<rect x="55" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="547" font-family="sans-serif" font-size="28" fill="#f7768e">/secrets</text>
<text x="79" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">Renders a separate SecretsPage</text>
<text x="79" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Bypasses the Settings layout</text>
<rect x="1055" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="547" font-family="sans-serif" font-size="28" fill="#9ece6a">LegacySecretsRoute</text>
<text x="1079" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">Replaces URL with /settings?tab=secrets</text>
<text x="1079" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Back navigation avoids the legacy redirect loop</text>
<rect x="55" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#a9b1d6"/>
<text x="79" y="777" font-family="sans-serif" font-size="28" fill="#a9b1d6">/secrets/jobs/:id</text>
<text x="79" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">Cleanup status uses the standalone page</text>
<text x="79" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Job reference lives only in that route</text>
<rect x="1055" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="777" font-family="sans-serif" font-size="28" fill="#9ece6a">SettingsRoute -&gt; SettingsPage</text>
<text x="1079" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">secret_job query preserves job_id</text>
<text x="1079" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Embedded SecretsPage opens the requested job</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: inventory navigation only; /secrets/authorize remains a separate CLI approval flow.</text>
</svg>