<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2415 · Restrict member discovery</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Open-signup users could enumerate members; discovery now requires a domain lock</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">and a verified provider identity for the caller in that domain.</text>
<path d="M55 178H1945 M1000 205V1130" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="230" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="317" font-family="sans-serif" font-size="28" fill="#f7768e">SecretPrincipal metadata access</text>
<text x="79" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">Browser cookie or dedicated CLI credential</text>
<text x="79" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">No domain-membership check</text>
<rect x="1055" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="317" font-family="sans-serif" font-size="28" fill="#9ece6a">require_directory</text>
<text x="1079" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">ALLOWED_EMAIL_DOMAIN must be configured</text>
<text x="1079" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">user_identities: email_verified and exact domain</text>
<rect x="55" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#7aa2f7"/>
<text x="79" y="547" font-family="sans-serif" font-size="28" fill="#7aa2f7">Member listing and identity resolution</text>
<text x="79" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">GET /api/secrets/members</text>
<text x="79" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">POST /api/secrets/members/resolve</text>
<rect x="1055" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="547" font-family="sans-serif" font-size="28" fill="#9ece6a">Same gate on both routes</text>
<text x="1079" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">Open signup / external / unverified: 403</text>
<text x="1079" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Verified domain member: directory access</text>
<rect x="55" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="777" font-family="sans-serif" font-size="28" fill="#f7768e">All active registered users returned</text>
<text x="79" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">Profile emails and provider identities exposed</text>
<text x="79" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Login exceptions can discover the directory</text>
<rect x="1055" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="777" font-family="sans-serif" font-size="28" fill="#9ece6a">Restricted UI handles denial</text>
<text x="1079" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">Explain member discovery policy in sharing</text>
<text x="1079" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Known UUID grants need no directory lookup</text>
<text x="1055" y="1010" font-family="sans-serif" font-size="26" fill="#9ece6a">Browser and CLI regression coverage for the gate</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: member discovery only; separate admin user management and existing secret rights remain unchanged.</text>
</svg>