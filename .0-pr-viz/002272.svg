<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<path d="M55 180H1945 M1000 200V1120" stroke="#565f89" stroke-dasharray="8 8"/>
<rect x="65" y="280" width="870" height="175" rx="12" fill="#1e202e" stroke="#f7768e"/>
<rect x="65" y="525" width="870" height="175" rx="12" fill="#1e202e" stroke="#f7768e"/>
<rect x="65" y="770" width="870" height="175" rx="12" fill="#1e202e" stroke="#f7768e"/>
<rect x="1045" y="280" width="870" height="175" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<rect x="1045" y="525" width="870" height="175" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<rect x="1045" y="770" width="870" height="175" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2272 · Launcher delivery supervision</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">A failed scheduler send used to discard the rest of its batch.</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">Now reconnect preserves untouched work without retrying an ambiguous operation.</text>
<text x="65" y="235" font-family="sans-serif" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1045" y="235" font-family="sans-serif" font-size="24" fill="#9ece6a">AFTER</text>
<text x="89" y="322" font-family="sans-serif" font-size="26" fill="#f7768e">Drain scheduler batch</text>
<text x="89" y="362" font-family="sans-serif" font-size="23" fill="#c0caf5">ready_prompts / ready_continuations consume due work.</text>
<text x="89" y="395" font-family="sans-serif" font-size="23" fill="#c0caf5">The loop now owns every operation, attempted or not.</text>
<text x="89" y="567" font-family="sans-serif" font-size="26" fill="#f7768e">Inner break after failed send</text>
<text x="89" y="607" font-family="sans-serif" font-size="23" fill="#c0caf5">Socket loop continues; trailing operations are lost.</text>
<text x="89" y="640" font-family="sans-serif" font-size="23" fill="#c0caf5">The failed frame may already have reached the hub.</text>
<text x="89" y="812" font-family="sans-serif" font-size="26" fill="#f7768e">Reconnect continuation snapshot</text>
<text x="89" y="852" font-family="sans-serif" font-size="23" fill="#c0caf5">A stale pending ID can become ready again.</text>
<text x="89" y="885" font-family="sans-serif" font-size="23" fill="#c0caf5">An uncertain input may be injected a second time.</text>
<text x="1069" y="322" font-family="sans-serif" font-size="26" fill="#9ece6a">LauncherConnectionSupervisor</text>
<text x="1069" y="362" font-family="sans-serif" font-size="23" fill="#c0caf5">Owns logical operations across connection attempts.</text>
<text x="1069" y="395" font-family="sans-serif" font-size="23" fill="#c0caf5">Commands, scheduler and exit handlers are separate.</text>
<text x="1069" y="567" font-family="sans-serif" font-size="26" fill="#9ece6a">Reconnect; retain untouched tail</text>
<text x="1069" y="607" font-family="sans-serif" font-size="23" fill="#c0caf5">Remove only the attempted operation from the queue.</text>
<text x="1069" y="640" font-family="sans-serif" font-size="23" fill="#c0caf5">Log ambiguity; never replay its remaining frames.</text>
<text x="1069" y="812" font-family="sans-serif" font-size="26" fill="#9ece6a">Fresh sync gates queued work</text>
<text x="1069" y="852" font-family="sans-serif" font-size="23" fill="#c0caf5">Discard cancelled, disabled or edited identities.</text>
<text x="1069" y="885" font-family="sans-serif" font-size="23" fill="#c0caf5">Claim continuation IDs until the hub removes them.</text>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#e0af68">Scope: daemon-local queue and claims. No durable delivery identity or application acknowledgment; #1165 remains open.</text>
</svg>
