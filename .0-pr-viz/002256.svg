<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2256 · Load only detected plugins into sessions by default</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">A session with no plugin selection loaded every host-enabled plugin;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now it loads only those whose detect rules match its working directory.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">launcher.json plugins (cfl-test-bench)</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">5 installed, all enabled: true (install default)</text>
  <text x="79" y="360" font-size="23" fill="#a9b1d6">session-plugins/: selections for only 2 sessions</text>
  <line x1="505" y1="395" x2="505" y2="440" stroke="#565f89" stroke-width="2" marker-end="url(#arr-dim)"/>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">session_plugins::apply(config, selection)</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">explicit choice: use it</text>
  <text x="79" y="560" font-size="23" fill="#f7768e">no choice: keep host enabled, so every plugin is on</text>
  <line x1="505" y1="595" x2="505" y2="640" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="55" y="645" width="900" height="210" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">New session in a firmware repo</text>
  <text x="79" y="725" font-size="23" fill="#f7768e">kicadmium (13 skills), yapcad, unlinked, slowbooks,</text>
  <text x="79" y="760" font-size="23" fill="#f7768e">engineering-presentations: all loaded</text>
  <text x="79" y="810" font-size="23" fill="#a9b1d6">skills and context for tools the repo never uses</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">launcher.json plugins (unchanged)</text>
  <text x="1069" y="325" font-size="23" fill="#a9b1d6">host enabled now means available to sessions</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">per-session selections are honored as before</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#565f89" stroke-width="2" marker-end="url(#arr-dim)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">apply(config, selection, working_directory)</text>
  <text x="1069" y="525" font-size="23" fill="#a9b1d6">explicit choice: use it (either direction)</text>
  <text x="1069" y="560" font-size="23" fill="#9ece6a">no choice: host enabled AND detected_in(working dir)</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="210" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">New session in a repo with board.kicad_pcb</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">kicadmium: on (detect rule *.kicad_pcb matched)</text>
  <text x="1069" y="760" font-size="23" fill="#9ece6a">yapcad, unlinked, slowbooks: off (no match)</text>
  <text x="1069" y="810" font-size="23" fill="#a9b1d6">plugins panel shows this same effective state</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Caveat: plugins with no detect rules (engineering-presentations) never auto-enable; detect patterns like *.zip can over-match.</text>
</svg>
