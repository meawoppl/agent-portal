<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <rect width="2000" height="1200" fill="#1a1b26"/>
  <g font-family="Arial, sans-serif">
    <text x="55" y="52" fill="#a9b1d6" font-size="24" letter-spacing="1">PR #2407 · Android push notification badge</text>
    <text x="55" y="105" fill="#e6e9f5" font-size="34">An opaque app icon becomes a white square in Android's status bar.</text>
    <text x="55" y="149" fill="#e6e9f5" font-size="34">A dedicated transparent badge preserves Portal's globe silhouette.</text>
    <path d="M55 177 H1945" stroke="#3d4666"/>
    <path d="M1000 205 V1120" stroke="#3d4666" stroke-dasharray="9 9"/>
    <text x="75" y="235" fill="#f7768e" font-size="22" font-weight="bold" letter-spacing="4">BEFORE</text>
    <text x="1055" y="235" fill="#9ece6a" font-size="22" font-weight="bold" letter-spacing="4">AFTER</text>

    <g>
      <rect x="75" y="275" width="870" height="155" rx="16" fill="#1e202e" stroke="#3d4666"/>
      <text x="105" y="320" fill="#7aa2f7" font-size="26">frontend/sw.js</text>
      <text x="105" y="365" fill="#c0caf5" font-size="25">badge: "/icon-192.png"</text>
      <text x="105" y="405" fill="#a9b1d6" font-size="23">The launcher image has an opaque background.</text>
    </g>
    <g>
      <rect x="1055" y="275" width="870" height="155" rx="16" fill="#1e202e" stroke="#9ece6a"/>
      <text x="1085" y="320" fill="#7aa2f7" font-size="26">frontend/sw.js</text>
      <text x="1085" y="365" fill="#c0caf5" font-size="25">badge: "/notification-badge-96.png"</text>
      <text x="1085" y="405" fill="#a9b1d6" font-size="23">96 × 96 white strokes on a transparent background.</text>
    </g>
    <path d="M510 450 V495 l-10 -14 m10 14 l10 -14" fill="none" stroke="#a9b1d6" stroke-width="3"/>
    <path d="M1490 450 V495 l-10 -14 m10 14 l10 -14" fill="none" stroke="#a9b1d6" stroke-width="3"/>
    <text x="300" y="540" fill="#c0caf5" font-size="25">Android monochrome silhouette</text>
    <text x="1280" y="540" fill="#c0caf5" font-size="25">Android monochrome silhouette</text>
    <g><rect x="430" y="590" width="160" height="160" rx="18" fill="#e6e9f5"/></g>
    <g transform="translate(1394 574) scale(2)" fill="none" stroke="#e6e9f5">
      <circle cx="48" cy="48" r="36" stroke-width="8"/>
      <ellipse cx="48" cy="48" rx="16" ry="36" stroke-width="6"/>
      <path d="M12 48 H84" stroke-width="6"/>
    </g>
    <text x="240" y="815" fill="#f7768e" font-size="27">Solid square hides the Portal identity</text>
    <text x="1210" y="815" fill="#9ece6a" font-size="27">Open globe remains recognizable</text>

    <g>
      <rect x="75" y="880" width="870" height="210" rx="16" fill="#1e202e" stroke="#3d4666"/>
      <text x="105" y="925" fill="#7aa2f7" font-size="26">frontend/index.html</text>
      <text x="105" y="970" fill="#c0caf5" font-size="23">Trunk copies assets/icon-192.png.</text>
      <text x="105" y="1015" fill="#a9b1d6" font-size="23">icon and badge use the same image.</text>
      <text x="105" y="1060" fill="#a9b1d6" font-size="23">The large icon's colors disappear in the badge mask.</text>
    </g>
    <g>
      <rect x="1055" y="880" width="870" height="210" rx="16" fill="#1e202e" stroke="#3d4666"/>
      <text x="1085" y="925" fill="#7aa2f7" font-size="26">frontend/index.html</text>
      <text x="1085" y="970" fill="#9ece6a" font-size="23">Trunk also copies assets/notification-badge-96.png.</text>
      <text x="1085" y="1015" fill="#a9b1d6" font-size="23">icon still uses the full-color /icon-192.png.</text>
      <text x="1085" y="1060" fill="#a9b1d6" font-size="23">New notifications use the dedicated badge.</text>
    </g>
    <text x="55" y="1172" fill="#a9b1d6" font-size="22">Illustrative silhouettes; applies after the updated worker loads. Physical Android verification remains after deployment.</text>
  </g>
</svg>
