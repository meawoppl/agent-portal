<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<defs>
  <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
  </marker>
  <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
  </marker>
</defs>
<g font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif" fill="#c0caf5">

<text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2472 · Keep the reading position while scrolled back by deferring transcript eviction</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">Each new message evicted the oldest one, shifting the text a scrolled-back reader saw;</text>
<text x="55" y="140" font-size="34" fill="#e6e9f5">eviction now waits until the view is pinned to the bottom again, where it is invisible.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

<text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
<text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
<line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

<!-- BEFORE -->
<rect x="65" y="250" width="870" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="292" font-size="26" fill="#7aa2f7">handle_received_output</text>
<text x="89" y="334" font-size="23" fill="#a9b1d6">push_message_with_cost_limit(..., MAX_MESSAGES_PER_SESSION)</text>
<text x="89" y="374" font-size="23" fill="#a9b1d6">100-message window, trimmed on every push</text>
<text x="89" y="412" font-size="22" fill="#565f89">regardless of should_autoscroll</text>

<line x1="500" y1="440" x2="500" y2="520" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="516" y="486" font-size="22" fill="#f7768e">reader scrolled back</text>

<rect x="65" y="525" width="870" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="567" font-size="26" fill="#f7768e">Oldest message removed above the viewport</text>
<text x="89" y="609" font-size="23" fill="#a9b1d6">scrollTop unchanged, content shifts up</text>
<text x="89" y="649" font-size="23" fill="#a9b1d6">no scroll anchoring on mobile Safari</text>
<text x="89" y="687" font-size="22" fill="#565f89">repeats with every new message</text>

<line x1="500" y1="715" x2="500" y2="795" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>

<rect x="65" y="800" width="870" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="842" font-size="26" fill="#f7768e">The message being read jumps off screen</text>
<text x="89" y="884" font-size="23" fill="#a9b1d6">reader lands somewhere else in the history</text>
<text x="89" y="922" font-size="22" fill="#565f89">reported on mobile</text>

<!-- AFTER -->
<rect x="1040" y="250" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="292" font-size="26" fill="#7aa2f7">enforce_render_budget</text>
<text x="1064" y="334" font-size="23" fill="#9ece6a">live_render_budget(should_autoscroll)</text>
<text x="1064" y="374" font-size="23" fill="#9ece6a">tailing: 100, scrolled back: 400</text>
<text x="1064" y="412" font-size="22" fill="#565f89">MAX_MESSAGES_WHILE_SCROLLED_BACK = 4 x 100</text>

<line x1="1487" y1="440" x2="1487" y2="520" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="1503" y="486" font-size="22" fill="#9ece6a">reader scrolled back</text>

<rect x="1040" y="525" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="567" font-size="26" fill="#9ece6a">Nothing above the viewport is removed</text>
<text x="1064" y="609" font-size="23" fill="#a9b1d6">new messages append below the reader</text>
<text x="1064" y="649" font-size="23" fill="#a9b1d6">reconnect HistoryBatch follows the same rule</text>
<text x="1064" y="687" font-size="22" fill="#565f89">reading position holds without CSS anchoring</text>

<line x1="1487" y1="715" x2="1487" y2="795" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

<rect x="1040" y="800" width="895" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="842" font-size="26" fill="#9ece6a">Trim back when tailing resumes</text>
<text x="1064" y="884" font-size="23" fill="#a9b1d6">AutoscrollChanged / JumpToLive re-run the budget</text>
<text x="1064" y="922" font-size="22" fill="#565f89">view is pinned to the bottom, eviction unseen</text>

<text x="55" y="1172" font-size="22" fill="#565f89">Scope: other height changes above the viewport (late-loading images) are untouched; past 400 messages, eviction resumes while scrolled back.</text>
</g>
</svg>
