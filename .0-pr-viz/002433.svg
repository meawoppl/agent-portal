<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2433 · Show images viewed by Codex</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Codex imageView items showed only a local path; completed views now upload</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">through Portal media, so the conversation receives the image preview.</text>
<path d="M55 178H1945 M1000 205V1130" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="230" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="317" font-family="sans-serif" font-size="28" fill="#f7768e">Typed ImageView event</text>
<text x="79" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">id and agent-local path reach the transcript</text>
<text x="79" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">No image bytes transferred to Portal</text>
<rect x="1055" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="317" font-family="sans-serif" font-size="28" fill="#9ece6a">Completed ImageView normalization</text>
<text x="1079" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">Resolve path from session working_directory</text>
<text x="1079" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">Starts remain metadata-only; reuse item references</text>
<rect x="55" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="547" font-family="sans-serif" font-size="28" fill="#f7768e">View image tool card</text>
<text x="79" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">Renders path as text</text>
<text x="79" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Browser cannot use the agent-local file</text>
<rect x="1055" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="547" font-family="sans-serif" font-size="28" fill="#9ece6a">Bounded authenticated transfer</text>
<text x="1079" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">Regular file, &lt;= 10 MiB, supported image signature</text>
<text x="1079" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">POST /api/agent/sessions/{id}/media</text>
<rect x="55" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="777" font-family="sans-serif" font-size="28" fill="#f7768e">No uploaded copy</text>
<text x="79" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">No automatic preview in the conversation</text>
<text x="79" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Local path alone cannot preserve the image</text>
<rect x="1055" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="777" font-family="sans-serif" font-size="28" fill="#9ece6a">Existing Portal media path</text>
<text x="1079" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">Normal image message, lightbox and archive copy</text>
<text x="1079" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Tool card shows upload outcome; failures are visible</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Requires updated launcher/session code. Imported history without uploaded media remains path-only.</text>
</svg>