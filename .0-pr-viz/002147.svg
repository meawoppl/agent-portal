<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 2147 - Route service_tier empty filter via shared helper</title>
  <desc id="desc">The last string-typed !s.is_empty() filter, in claude-session-lib io_task.rs, now routes through shared::strings::is_non_empty.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="68" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="1">PR #2147 - Route service_tier empty filter via shared helper</text>
  <text x="55" y="122" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">One straggler spelled out !s.is_empty() in claude-session-lib.</text>
  <text x="55" y="164" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Now it routes through shared::strings::is_non_empty.</text>
  <line x1="55" y1="192" x2="1945" y2="192" stroke="#3d4666" stroke-width="2"/>

  <text x="55" y="244" fill="#f7768e" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1055" y="244" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <line x1="1000" y1="210" x2="1000" y2="1140" stroke="#3d4666" stroke-width="3" stroke-dasharray="14 16"/>

  <rect x="70" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="115" y="325" width="760" height="200" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="371" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">io_task.rs - TurnOutcome</text>
  <text x="145" y="415" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">.map(|u| u.service_tier.clone())</text>
  <text x="145" y="453" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">.filter(|s| !s.is_empty())</text>
  <text x="145" y="491" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">hand-spelled predicate, one-off shape</text>

  <rect x="115" y="555" width="760" height="200" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="601" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Missed by #2142 and #2145</text>
  <text x="145" y="645" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">frontend and launcher sweeps covered</text>
  <text x="145" y="683" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">their crates; session-lib was out of scope</text>

  <rect x="115" y="785" width="760" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="145" y="831" fill="#f7768e" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Left-out neighbors stay</text>
  <text x="145" y="875" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="24">OsString (config.rs) and byte slices</text>
  <text x="145" y="913" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">are not str: helper does not apply</text>

  <rect x="1085" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="1125" y="335" width="765" height="125" rx="16" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1155" y="382" fill="#7aa2f7" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">shared::strings::is_non_empty</text>
  <text x="1155" y="424" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="23">Single home for !s.is_empty() filters</text>
  <text x="1645" y="424" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="23">shared/src/strings.rs</text>

  <rect x="1125" y="520" width="365" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1152" y="568" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">1 line</text>
  <text x="1152" y="610" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">one closure routed,</text>
  <text x="1152" y="648" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">crate already depends on shared</text>

  <rect x="1515" y="520" width="375" height="185" rx="16" fill="#1e202e" stroke="#e0af68" stroke-width="3"/>
  <text x="1542" y="568" fill="#e0af68" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">No behavior change</text>
  <text x="1542" y="610" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">identical predicate,</text>
  <text x="1542" y="648" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">102 crate tests green</text>

  <rect x="1125" y="765" width="765" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1152" y="813" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Zero string-shape sites remain</text>
  <text x="1152" y="855" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">repo-wide; only OsString / byte-slice</text>
  <text x="1152" y="893" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">sites keep their native is_empty</text>

  <path d="M1505 460 L1300 510" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1284,514 1312,494 1318,523" fill="#7aa2f7"/>
  <path d="M1515 460 L1715 510" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1731,514 1697,523 1704,494" fill="#7aa2f7"/>
  <path d="M1300 705 L1300 752" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1300,765 1284,736 1316,736" fill="#7aa2f7"/>
  <path d="M1715 705 L1715 752" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1715,765 1699,736 1731,736" fill="#7aa2f7"/>

  <rect x="110" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="138" y="1103" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">One copy of a shared predicate invites silent drift.</text>
  <rect x="1125" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1153" y="1103" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">One helper owns the predicate; call sites just ask.</text>

  <text x="55" y="1172" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="22">Scope: claude-session-lib service_tier filter; OsString and byte-slice sites stay; no behavior change.</text>
</svg>
