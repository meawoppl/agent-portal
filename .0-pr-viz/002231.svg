<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" font-family="sans-serif">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-size="24" fill="#565f89">PR #2231 · Add administrator controls for federation policy</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">Federation policy was stored off, without a supported administrative update path.</text>
<text x="55" y="140" font-size="34" fill="#e6e9f5">Admins can now set origin and scope ceilings; invalid updates leave policy unchanged.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666"/>
<line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-dasharray="12 14"/>
<text x="105" y="235" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1090" y="235" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="105" y="280" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="325" font-size="26" fill="#f7768e">federation_policy</text>
<text x="129" y="368" font-size="23" fill="#a9b1d6">The singleton starts with mode off.</text>
<text x="129" y="406" font-size="23" fill="#a9b1d6">Operators have no supported policy controls.</text>
<line x1="525" y1="460" x2="525" y2="510" stroke="#565f89" stroke-width="3"/>
<rect x="105" y="510" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="555" font-size="26" fill="#f7768e">Origin allowlist</text>
<text x="129" y="598" font-size="23" fill="#a9b1d6">No handler validates policy input for storage.</text>
<text x="129" y="636" font-size="23" fill="#a9b1d6">Malformed or ambiguous origins must not be accepted.</text>
<line x1="525" y1="690" x2="525" y2="740" stroke="#565f89" stroke-width="3"/>
<rect x="105" y="740" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="785" font-size="26" fill="#f7768e">Live grant gate</text>
<text x="129" y="828" font-size="23" fill="#a9b1d6">Existing grants read policy on each use.</text>
<text x="129" y="866" font-size="23" fill="#a9b1d6">Changing policy requires direct database edits.</text>
<rect x="1055" y="280" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="325" font-size="26" fill="#9ece6a">GET / PUT /api/admin/federation-policy</text>
<text x="1079" y="368" font-size="23" fill="#a9b1d6">require_admin checks native account authority.</text>
<text x="1079" y="406" font-size="23" fill="#a9b1d6">Linked credentials remain default-denied.</text>
<line x1="1475" y1="460" x2="1475" y2="510" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="510" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="555" font-size="26" fill="#9ece6a">normalize</text>
<text x="1079" y="598" font-size="23" fill="#a9b1d6">Allow 1..64 canonical origins, sort and deduplicate.</text>
<text x="1079" y="636" font-size="23" fill="#a9b1d6">Reject wildcard, path and unsupported origins.</text>
<line x1="1475" y1="690" x2="1475" y2="740" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="740" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="785" font-size="26" fill="#9ece6a">set_policy</text>
<text x="1079" y="828" font-size="23" fill="#a9b1d6">Validate before writing; retain policy on error.</text>
<text x="1079" y="866" font-size="23" fill="#a9b1d6">Existing grant checks apply the new ceiling.</text>
<text x="55" y="1172" font-size="22" fill="#e0af68">Depends on S1 (#2229). Enrollment is not enabled; admin UI is part of the linked-portal frontend work.</text>
</svg>