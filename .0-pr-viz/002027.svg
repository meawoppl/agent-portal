<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="58" fill="#565f89" font-family="Arial, sans-serif" font-size="24">PR #2027 · short_uuid helper for typed session ids</text>
  <text x="55" y="112" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">Typed Uuid callers skip the throwaway String</text>
  <line x1="55" y1="160" x2="1945" y2="160" stroke="#565f89" stroke-width="2"/>
  <line x1="1000" y1="195" x2="1000" y2="1115" stroke="#565f89" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="75" y="225" fill="#f7768e" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">BEFORE · FORMAT THEN SLICE</text>
  <rect x="75" y="265" width="830" height="330" rx="18" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="110" y="315" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">8 call sites do this</text>
  <rect x="110" y="350" width="760" height="78" rx="10" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
  <text x="135" y="399" fill="#e6e9f5" font-family="Arial, sans-serif" font-size="24">short_session_id(&amp;id.to_string())</text>
  <text x="110" y="470" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Full 36-char String built per call,</text>
  <text x="110" y="510" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">only to keep the first 8 chars.</text>
  <text x="110" y="560" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">Allocates, dashes, then strips dashes.</text>

  <rect x="75" y="650" width="830" height="330" rx="18" fill="#1e202e" stroke="#e0af68" stroke-width="3"/>
  <text x="110" y="700" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Two spellings of one shape</text>
  <text x="110" y="750" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Launcher, frontend x3, archive scan,</text>
  <text x="110" y="790" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">claude-session-lib, plus a test.</text>
  <text x="110" y="840" fill="#e0af68" font-family="Arial, sans-serif" font-size="23">String-typed callers sit right beside them:</text>
  <text x="110" y="880" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">proxy UI, peek summary, reply reminder.</text>
  <text x="110" y="930" fill="#565f89" font-family="Arial, sans-serif" font-size="20">One helper can not serve both cleanly.</text>

  <text x="1075" y="225" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">AFTER · TYPED HELPER</text>
  <rect x="1095" y="265" width="830" height="330" rx="18" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1130" y="315" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">shared::short_uuid(&amp;Uuid)</text>
  <rect x="1130" y="350" width="760" height="78" rx="10" fill="#16161e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1155" y="399" fill="#e6e9f5" font-family="Arial, sans-serif" font-size="24">hex of first 4 bytes, no temp String</text>
  <text x="1130" y="470" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Same 8 chars, rendered from bytes.</text>
  <text x="1130" y="510" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Unit test pins it to short_session_id.</text>
  <text x="1130" y="550" fill="#565f89" font-family="Arial, sans-serif" font-size="20">short_session_id keeps the &amp;str callers.</text>

  <rect x="1095" y="650" width="830" height="330" rx="18" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1130" y="700" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">8 typed sites switched</text>
  <text x="1130" y="750" fill="#7dcfff" font-family="Arial, sans-serif" font-size="23">launcher peek + collision check</text>
  <text x="1130" y="790" fill="#7dcfff" font-family="Arial, sans-serif" font-size="23">frontend rail menu, panel, fork link</text>
  <text x="1130" y="830" fill="#7dcfff" font-family="Arial, sans-serif" font-size="23">archive scan short_id + its test</text>
  <text x="1130" y="870" fill="#7dcfff" font-family="Arial, sans-serif" font-size="23">claude-session-lib cycle chip</text>
  <text x="1130" y="920" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Display output unchanged everywhere.</text>

  <rect x="1095" y="1035" width="830" height="90" rx="16" fill="#1e202e" stroke="#bb9af7" stroke-width="3"/>
  <text x="1130" y="1073" fill="#bb9af7" font-family="Arial, sans-serif" font-size="23" font-weight="bold">Refactor only: no behavior change</text>
  <text x="1130" y="1106" fill="#c0caf5" font-family="Arial, sans-serif" font-size="18">7 files, +37 -11; focused tests green.</text>
  <text x="55" y="1170" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Follow-up to #2020, which deduped the &amp;str helper.</text>
</svg>
