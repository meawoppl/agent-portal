<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="monospace" font-size="24" fill="#a9b1d6">PR #2509 · Scope retention work and enforce cleanup timeouts</text>
<text x="55" y="103" font-family="monospace" font-size="34" fill="#e6e9f5">Retention checks queued sessions for count overflow and caps every delete pass.</text>
<text x="55" y="146" font-family="monospace" font-size="34" fill="#e6e9f5">The cleanup timeout now lasts for the queries inside each transaction.</text>
<path d="M55 175H1945 M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="monospace" font-size="22" fill="#f7768e">BEFORE</text>
<rect x="55" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">archive_retention_candidates</text>
<text x="79" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Groups all messages by session on each sweep.</text>
<path d="M500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">truncate_session_messages</text>
<text x="79" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Reads a full count, then loads old IDs before deleting.</text>
<path d="M500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">statement_timeout</text>
<text x="79" y="939" font-family="monospace" font-size="23" fill="#c0caf5">SET LOCAL runs in autocommit and expires immediately.</text>
<text x="1055" y="230" font-family="monospace" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="1055" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">archive_retention_candidates</text>
<text x="1079" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Probes only drain_pending_truncations for count overflow.</text>
<path d="M1500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">truncate_session_messages</text>
<text x="1079" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Seeks past the retained tail and deletes within the budget.</text>
<text x="1079" y="711" font-family="monospace" font-size="23" fill="#c0caf5">Budget-limited or failed sessions return to the queue.</text>
<path d="M1500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">with_cleanup_timeout</text>
<text x="1079" y="939" font-family="monospace" font-size="23" fill="#c0caf5">SET LOCAL and its cleanup queries share a transaction.</text>
<text x="55" y="1172" font-family="monospace" font-size="22" fill="#a9b1d6">Age retention still looks up messages by created_at. Count work resumes from the queue after a failed or capped pass.</text>
</svg>
