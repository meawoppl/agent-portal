<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2295 · Stop the launcher on an unparseable config instead of defaulting</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">A typo in launcher.json read as a fresh install, and the next save erased it;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now boot and login stop with the path and parse error, and nothing is saved.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1040" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">main: config::load_config()</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">trailing comma: warn, LauncherConfig::default()</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">same as a missing file</text>
  <line x1="505" y1="395" x2="505" y2="440" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">No auth_token: device flow</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">against the default server, not backend_url</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">(nobody sees it under systemd)</text>
  <line x1="505" y1="595" x2="505" y2="640" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">save_credentials / save_auth_token / clear_sessions</text>
  <text x="79" y="725" font-size="23" fill="#f7768e">load_config() + save: defaults over the file</text>
  <text x="79" y="760" font-size="23" fill="#f7768e">plugins, session_memory, sessions erased</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">main, cmd_login: load_config_checked()?</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">missing: first-run defaults</text>
  <text x="1069" y="360" font-size="23" fill="#9ece6a">unparseable: boot fails</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">launcher.json is not valid; fix or move it aside</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">Caused by: trailing comma at line 1 column 55</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">path logged, token never</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">The writers use update_config_at</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">a file it can't parse is never saved over</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">save_config removed; read-only lookups stay lenient</text>
</svg>
