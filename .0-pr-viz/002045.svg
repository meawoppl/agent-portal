<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2045 · Keep surface resize drags alive over the app iframe</text>

  <!-- Thesis -->
  <text x="55" y="100" font-size="34" fill="#e6e9f5">Dragging the split handle toward the app died as soon as the cursor entered</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">the iframe; now the handle captures the pointer, so the drag follows it anywhere.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <!-- Panel labels + center divider -->
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE panel ==================== -->
  <g>
    <rect x="80" y="250" width="860" height="150" fill="#1e202e" stroke="#7aa2f7" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#7aa2f7">.session-surface-resize-handle</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">onmousedown -> SurfaceResizeStart(MouseEvent)</text>
    <text x="104" y="366" font-size="22" fill="#565f89">listeners on window: mousemove, mouseup, blur</text>
  </g>

  <line x1="320" y1="400" x2="320" y2="490" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="336" y="452" font-size="22" fill="#565f89">cursor moves right, into the surface</text>

  <g>
    <rect x="80" y="500" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="540" font-size="26" fill="#c0caf5">iframe.session-forward-frame</text>
    <text x="104" y="580" font-size="23" fill="#a9b1d6">a separate document: it receives the mouse events</text>
    <text x="104" y="616" font-size="22" fill="#565f89">parent window gets no mousemove / mouseup</text>
  </g>

  <line x1="320" y1="650" x2="320" y2="740" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="750" width="860" height="160" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="790" font-size="26" fill="#f7768e">SurfaceResizeTo never fires</text>
    <text x="104" y="830" font-size="23" fill="#a9b1d6">split stays where it was</text>
    <text x="104" y="866" font-size="22" fill="#565f89">headless repro: drag toward app, 50% -> 50%</text>
  </g>

  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">handle "doesn't drag"</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">toward the app at all</text>
  </g>

  <!-- ==================== AFTER panel ==================== -->
  <g>
    <rect x="1060" y="250" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1084" y="290" font-size="26" fill="#9ece6a">onpointerdown -> set_pointer_capture</text>
    <text x="1084" y="330" font-size="23" fill="#a9b1d6">SurfaceResizeStart(PointerEvent), on the handle</text>
    <text x="1084" y="366" font-size="22" fill="#565f89">touch-action: none, so touch and pen drags too</text>
  </g>

  <line x1="1300" y1="400" x2="1300" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1316" y="452" font-size="22" fill="#565f89">cursor moves right, into the surface</text>

  <g>
    <rect x="1060" y="500" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1084" y="540" font-size="26" fill="#9ece6a">pointermove still targets the handle</text>
    <text x="1084" y="580" font-size="23" fill="#a9b1d6">.surface-resizing: iframe pointer-events: none</text>
    <text x="1084" y="616" font-size="22" fill="#565f89">fallback, in case capture is ignored</text>
  </g>

  <line x1="1300" y1="650" x2="1300" y2="740" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1060" y="750" width="860" height="160" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1084" y="790" font-size="26" fill="#9ece6a">lostpointercapture -> SurfaceResizeEnd</text>
    <text x="1084" y="830" font-size="23" fill="#a9b1d6">one end signal; replaces blur / mouseleave / buttons</text>
    <text x="1084" y="866" font-size="22" fill="#565f89">headless repro: drag toward app, 50% -> 20% (clamp)</text>
  </g>

  <g>
    <rect x="1060" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1084" y="1006" font-size="26" fill="#c0caf5">handle drags both ways</text>
    <text x="1084" y="1046" font-size="23" fill="#9ece6a">split saved on release as before</text>
  </g>

  <!-- Footer -->
  <text x="55" y="1172" font-size="22" fill="#565f89">Verified on a minimal handle + iframe page in headless Chromium, not in the full dashboard; Safari not exercised.</text>
</svg>
