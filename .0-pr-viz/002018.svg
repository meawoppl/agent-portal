<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-label="Visual summary: agent-portal plugin CLI installs local plugins, records them in launcher config, and opens plugin web surfaces through the existing forwarder.">
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="64" y="112" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="700">Launcher plugin CLI ships the first slice</text>
  <text x="64" y="164" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26">agent-portal can install, inspect, doctor, and open repo-adjacent plugins.</text>

  <g transform="translate(90 250)">
    <rect x="0" y="0" width="500" height="680" rx="14" fill="#1e202e" stroke="#3d4666" stroke-width="3"/>
    <text x="34" y="58" fill="#7aa2f7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">New CLI surface</text>
    <text x="34" y="112" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">agent-portal plugin list</text>
    <text x="34" y="164" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">agent-portal plugin install</text>
    <text x="34" y="216" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">agent-portal plugin info</text>
    <text x="34" y="268" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">agent-portal plugin doctor</text>
    <text x="34" y="320" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">agent-portal plugin open</text>
    <text x="34" y="372" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">enable / disable / remove</text>
    <rect x="34" y="452" width="432" height="116" rx="10" fill="#16161e" stroke="#565f89" stroke-width="2"/>
    <text x="60" y="498" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Source forms</text>
    <text x="60" y="538" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">github:owner/repo//plugin</text>
  </g>

  <g transform="translate(750 250)">
    <rect x="0" y="0" width="500" height="680" rx="14" fill="#1e202e" stroke="#3d4666" stroke-width="3"/>
    <text x="34" y="58" fill="#bb9af7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">Launcher registry</text>
    <rect x="42" y="104" width="416" height="170" rx="10" fill="#16161e" stroke="#565f89" stroke-width="2"/>
    <text x="68" y="150" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">launcher.json</text>
    <text x="68" y="194" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">plugins.backplane.path</text>
    <text x="68" y="234" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">source_subdir: backplane</text>
    <rect x="42" y="340" width="416" height="170" rx="10" fill="#16161e" stroke="#565f89" stroke-width="2"/>
    <text x="68" y="386" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">~/agent-portal-plugins</text>
    <text x="68" y="430" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">backplane/</text>
    <text x="68" y="470" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">agent-portal-plugin.toml</text>
  </g>

  <g transform="translate(1410 250)">
    <rect x="0" y="0" width="500" height="680" rx="14" fill="#1e202e" stroke="#3d4666" stroke-width="3"/>
    <text x="34" y="58" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700">Open as surface</text>
    <rect x="44" y="112" width="412" height="230" rx="10" fill="#16161e" stroke="#565f89" stroke-width="2"/>
    <text x="74" y="164" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">plugin web service</text>
    <text x="74" y="210" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">127.0.0.1:{port}</text>
    <text x="74" y="256" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">health check before forward</text>
    <rect x="44" y="420" width="412" height="160" rx="10" fill="#16161e" stroke="#565f89" stroke-width="2"/>
    <text x="74" y="470" fill="#7dcfff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">existing forwarder</text>
    <text x="74" y="516" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">prints the user URL</text>
  </g>

  <path d="M 590 590 C 660 590 680 590 740 590" fill="none" stroke="#7aa2f7" stroke-width="7" stroke-linecap="round"/>
  <path d="M 1250 590 C 1320 590 1340 590 1400 590" fill="none" stroke="#9ece6a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="665" cy="590" r="10" fill="#7aa2f7"/>
  <circle cx="1325" cy="590" r="10" fill="#9ece6a"/>

  <g transform="translate(230 1030)">
    <rect x="0" y="0" width="420" height="70" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
    <text x="28" y="44" fill="#7aa2f7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Backplane install tested</text>
    <rect x="500" y="0" width="420" height="70" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
    <text x="528" y="44" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Doctor uses repo cwd</text>
    <rect x="1000" y="0" width="420" height="70" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
    <text x="1028" y="44" fill="#bb9af7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Open forwards surface</text>
  </g>
</svg>
