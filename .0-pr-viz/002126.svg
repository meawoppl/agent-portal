<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fullscreen zoomable image lightbox</title>
  <desc id="desc">Visual summary of image and SVG previews opening into a fullscreen, scroll-zoomable, pannable lightbox in Agent Portal.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L14,5 z" fill="#7aa2f7"/>
    </marker>
  </defs>

  <rect width="2000" height="1200" fill="#1a1b26"/>
  <rect x="70" y="68" width="1860" height="1064" rx="34" fill="#16161e" stroke="#3d4666" stroke-width="3"/>

  <text x="112" y="145" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="700">Image and SVG previews now open fullscreen</text>
  <text x="112" y="198" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="500">Wheel or trackpad zooms around the cursor. Drag pans the zoomed image. Reset or double-click fits it again.</text>

  <line x1="1000" y1="250" x2="1000" y2="1085" stroke="#3d4666" stroke-width="3" stroke-dasharray="16 18"/>

  <g transform="translate(112,276)">
    <text x="0" y="0" fill="#e0af68" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Before</text>
    <text x="0" y="46" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700">Centered preview modal</text>
    <text x="0" y="90" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="500">The preview stayed inside a framed card, so large SVGs</text>
    <text x="0" y="124" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="500">or screenshots were hard to inspect.</text>

    <rect x="34" y="188" width="742" height="556" rx="28" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
    <rect x="82" y="246" width="646" height="390" rx="20" fill="#1a1b26" stroke="#565f89" stroke-width="3"/>
    <rect x="154" y="324" width="502" height="238" rx="16" fill="#1e202e" stroke="#7aa2f7" stroke-width="4"/>
    <path d="M212 516 L318 404 L408 486 L474 436 L604 522 L212 522 z" fill="#9ece6a"/>
    <circle cx="586" cy="376" r="34" fill="#e0af68"/>
    <text x="190" y="606" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Clicking opens the same constrained viewing surface</text>

    <rect x="118" y="798" width="584" height="92" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
    <circle cx="164" cy="844" r="18" fill="#f7768e"/>
    <text x="202" y="854" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">No scroll zoom, no direct pan, limited SVG scale</text>
  </g>

  <path d="M875 612 C930 612 940 612 974 612" fill="none" stroke="#7aa2f7" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(1070,276)">
    <text x="0" y="0" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">After</text>
    <text x="0" y="46" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700">Fullscreen inspection surface</text>
    <text x="0" y="90" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="500">Image previews become a viewport tool instead of a card.</text>
    <text x="0" y="124" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="500">The same path covers PNG, JPEG, WebP, GIF, and SVG.</text>

    <rect x="0" y="188" width="798" height="556" rx="28" fill="#1a1b26" stroke="#7aa2f7" stroke-width="4"/>
    <rect x="52" y="246" width="694" height="390" rx="18" fill="#1e202e" stroke="#9ece6a" stroke-width="4"/>
    <path d="M110 590 L278 410 L390 528 L478 462 L692 594 L110 594 z" fill="#7aa2f7"/>
    <path d="M214 330 h322 v24 H214z M214 380 h230 v24 H214z M214 430 h374 v24 H214z" fill="#9ece6a"/>
    <circle cx="648" cy="336" r="38" fill="#e0af68"/>

    <g transform="translate(388,210)">
      <rect x="0" y="0" width="112" height="52" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
      <text x="28" y="35" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Reset</text>
      <rect x="128" y="0" width="158" height="52" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
      <text x="158" y="35" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Download</text>
      <rect x="302" y="0" width="58" height="52" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
      <text x="322" y="35" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">x</text>
    </g>

    <g transform="translate(28,796)">
      <rect x="0" y="0" width="224" height="82" rx="18" fill="#1e202e" stroke="#3d4666" stroke-width="3"/>
      <circle cx="38" cy="41" r="16" fill="#7aa2f7"/>
      <text x="66" y="49" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">wheel zoom</text>

      <rect x="248" y="0" width="194" height="82" rx="18" fill="#1e202e" stroke="#3d4666" stroke-width="3"/>
      <circle cx="286" cy="41" r="16" fill="#9ece6a"/>
      <text x="314" y="49" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">drag pan</text>

      <rect x="466" y="0" width="250" height="82" rx="18" fill="#1e202e" stroke="#3d4666" stroke-width="3"/>
      <circle cx="504" cy="41" r="16" fill="#e0af68"/>
      <text x="532" y="49" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Reset fits image</text>
    </g>
  </g>

  <text x="112" y="1080" fill="#565f89" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Implementation: ImageLightboxView owns pan and scale state; wheel, pointer drag, double-click, Escape, Reset, Download, and SVG sizing share one fullscreen path.</text>
</svg>
