<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<defs>
  <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
  </marker>
  <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
  </marker>
</defs>
<g font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif" fill="#c0caf5">

<text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2468 · Keep relaunched sessions on their own conversation and flag context loss</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">Saved launch args could rewind a relaunched session to an old conversation, silently;</text>
<text x="55" y="140" font-size="34" fill="#e6e9f5">relaunches now drop session-selection args, and a mismatch warns in the transcript.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

<text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
<text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
<line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

<!-- BEFORE -->
<rect x="65" y="250" width="870" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="292" font-size="26" fill="#7aa2f7">claude_cli_args (resume = true)</text>
<text x="89" y="334" font-size="23" fill="#a9b1d6">--resume CURRENT  then saved extra_args:</text>
<text x="89" y="374" font-size="23" fill="#f7768e">--resume OLD --fork-session</text>
<text x="89" y="412" font-size="22" fill="#565f89">extra_args re-applied on every relaunch</text>

<line x1="500" y1="440" x2="500" y2="520" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="516" y="486" font-size="22" fill="#f7768e">claude takes the last --resume</text>

<rect x="65" y="525" width="870" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="567" font-size="26" fill="#f7768e">Each relaunch forks OLD again</text>
<text x="89" y="609" font-size="23" fill="#a9b1d6">nightly auto-update restart: last night's work</text>
<text x="89" y="649" font-size="23" fill="#a9b1d6">gone from the agent's context</text>
<text x="89" y="687" font-size="22" fill="#565f89">no notice; the agent denies earlier work</text>

<rect x="65" y="770" width="870" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="812" font-size="26" fill="#f7768e">Never-messaged relaunch crash-loops</text>
<text x="89" y="854" font-size="23" fill="#a9b1d6">fresh start reuses an existing conversation id:</text>
<text x="89" y="894" font-size="23" fill="#a9b1d6">claude rejects --session-id, exits 1</text>
<text x="89" y="932" font-size="22" fill="#565f89">reconcile retries toward auto-pause</text>

<!-- AFTER -->
<rect x="1040" y="250" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="292" font-size="26" fill="#7aa2f7">strip_session_selection_args</text>
<text x="1064" y="334" font-size="23" fill="#9ece6a">on resume or fork, drop --resume/-r, --continue/-c,</text>
<text x="1064" y="374" font-size="23" fill="#9ece6a">--fork-session, --session-id (+ =value forms)</text>
<text x="1064" y="412" font-size="22" fill="#565f89">warn! lists dropped args; first launch unchanged</text>

<line x1="1487" y1="440" x2="1487" y2="520" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="1503" y="486" font-size="22" fill="#9ece6a">only --resume CURRENT</text>

<rect x="1040" y="525" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="567" font-size="26" fill="#9ece6a">Backstop: ResumeExpectation</text>
<text x="1064" y="609" font-size="23" fill="#a9b1d6">launcher records the conversation each spawn resumes</text>
<text x="1064" y="649" font-size="23" fill="#a9b1d6">first reported id differs: transcript warning</text>
<text x="1064" y="687" font-size="22" fill="#565f89">context_loss_warning; at most once per process</text>

<rect x="1040" y="770" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="812" font-size="26" fill="#9ece6a">Existing conversation is resumed</text>
<text x="1064" y="854" font-size="23" fill="#a9b1d6">fresh start + transcript Present: resume = true</text>
<text x="1064" y="894" font-size="23" fill="#a9b1d6">mirror of the missing-transcript pre-flight</text>
<text x="1064" y="932" font-size="22" fill="#565f89">6 new unit tests across spawn and forwarder</text>

<text x="55" y="1172" font-size="22" fill="#565f89">Scope: warning appears with the first reply after a relaunch (claude names its conversation then); it flags loss but does not restore.</text>
</g>
</svg>
