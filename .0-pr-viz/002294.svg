<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2294 · Send typed API errors to clients that accept JSON</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">AppError bodies were bare text with no machine-readable kind; a client that</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">sends Accept: application/json now gets ApiError, everyone else the same text.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1040" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">AppError::into_response</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">(status, msg.to_string())</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">no code, no retry hint</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">Router</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">every client reads text/plain</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">launcher CLI prints it verbatim</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">utils::error_body</text>
  <text x="79" y="725" font-size="23" fill="#a9b1d6">resp.text() or "HTTP {status}"</text>
  <text x="79" y="760" font-size="23" fill="#f7768e">plugin_selector read text() itself</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">AppError: same text + extension</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">ApiError { code, message, retryable }</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">ApiErrorCode, with serde(other) Unknown</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">negotiate_error_body (outermost)</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">application/json with q&gt;0: JSON body</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">*/*, text/*, q=0: text; status, headers kept; Vary</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">PortalClient sends Accept: application/json</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">error_body decodes ApiError</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">text fallback for older portals</text>

  <rect x="1045" y="845" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="1069" y="885" font-size="26" fill="#c0caf5">retryable: DbPool, GatewayTimeout only</text>
  <text x="1069" y="925" font-size="23" fill="#a9b1d6">a hint for the UI, never a mutation replay</text>
  <text x="1069" y="960" font-size="23" fill="#a9b1d6">DB details stay in the log</text>
</svg>
