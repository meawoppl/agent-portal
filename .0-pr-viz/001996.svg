<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI','Noto Sans',sans-serif">
  <rect width="1600" height="900" fill="#1a1b26"/>
  <text x="60" y="65" font-size="24" fill="#565f89">PR #1996 - one bearer-token parser</text>
  <text x="60" y="125" font-size="38" fill="#c0caf5">Authentication headers follow one rule.</text>
  <text x="60" y="170" font-size="24" fill="#a9b1d6">backend::auth::bearer_token is shared by both authentication entry points.</text>
  <rect x="70" y="255" width="500" height="360" rx="18" fill="#202334" stroke="#7aa2f7" stroke-width="3"/>
  <text x="110" y="320" font-size="26" fill="#7aa2f7">backend/src/auth.rs</text>
  <text x="110" y="390" font-size="24" fill="#c0caf5">Authorization header</text>
  <text x="110" y="440" font-size="24" fill="#c0caf5">Bearer prefix</text>
  <text x="110" y="490" font-size="24" fill="#c0caf5">non-empty token</text>
  <text x="110" y="555" font-size="22" fill="#9ece6a">bearer_token(...)</text>
  <path d="M600 435H850" stroke="#bb9af7" stroke-width="5"/>
  <text x="665" y="410" font-size="22" fill="#bb9af7">shared helper</text>
  <rect x="880" y="255" width="650" height="360" rx="18" fill="#202334" stroke="#9ece6a" stroke-width="3"/>
  <text x="920" y="320" font-size="26" fill="#9ece6a">backend/src/handlers/auth.rs</text>
  <text x="920" y="395" font-size="24" fill="#c0caf5">Device-flow authorization</text>
  <text x="920" y="450" font-size="24" fill="#c0caf5">Session authentication</text>
  <text x="920" y="525" font-size="22" fill="#e0af68">No duplicate parsing policy</text>
  <rect x="70" y="690" width="1460" height="125" rx="16" fill="#202334" stroke="#565f89"/>
  <text x="110" y="745" font-size="25" fill="#7dcfff">Result</text>
  <text x="220" y="745" font-size="24" fill="#c0caf5">Malformed and missing headers are interpreted identically everywhere.</text>
  <text x="110" y="785" font-size="21" fill="#565f89">One implementation, unchanged wire behavior, fewer opportunities for authentication drift.</text>
</svg>
