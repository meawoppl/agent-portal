<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 2185 - Route new launcher empty filters via shared helper</title>
  <desc id="desc">Three launcher filters added since PR 2145 spelled !x.is_empty() again; all three now route through shared::strings::is_non_empty.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="68" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="1">PR #2185 - Route new launcher empty filters via shared helper</text>
  <text x="55" y="122" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">PR 2145 zeroed the launcher. Three new filters drifted in since.</text>
  <text x="55" y="164" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">All three route back through shared::strings::is_non_empty.</text>
  <line x1="55" y1="192" x2="1945" y2="192" stroke="#3d4666" stroke-width="2"/>

  <text x="55" y="244" fill="#f7768e" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1055" y="244" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <line x1="1000" y1="210" x2="1000" y2="1140" stroke="#3d4666" stroke-width="3" stroke-dasharray="14 16"/>

  <rect x="70" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="115" y="325" width="760" height="200" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="375" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">service.rs - HOME lookup</text>
  <text x="145" y="421" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">.filter(|h| !h.is_empty())</text>
  <text x="145" y="463" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">guards the $HOME/.cargo/bin probe</text>

  <rect x="115" y="550" width="760" height="200" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="600" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">plugin.rs - git revision</text>
  <text x="145" y="646" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">.filter(|rev| !rev.is_empty())</text>
  <text x="145" y="688" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">drops a blank git rev-parse</text>

  <rect x="115" y="775" width="760" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="145" y="825" fill="#f7768e" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">plugin_preview.rs - skill fallback</text>
  <text x="145" y="871" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="24">.filter(|line| !line.is_empty())</text>
  <text x="145" y="913" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">Same predicate, spelled three ways</text>

  <rect x="1085" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="1125" y="335" width="765" height="125" rx="16" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1155" y="382" fill="#7aa2f7" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">shared::strings::is_non_empty</text>
  <text x="1155" y="424" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="23">Single home for !s.is_empty() filters</text>
  <text x="1645" y="424" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="23">shared/src/strings.rs</text>

  <rect x="1125" y="520" width="365" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1152" y="568" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">3 files</text>
  <text x="1152" y="610" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">3 closures routed,</text>
  <text x="1152" y="648" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">one line each</text>

  <rect x="1515" y="520" width="375" height="185" rx="16" fill="#1e202e" stroke="#e0af68" stroke-width="3"/>
  <text x="1542" y="568" fill="#e0af68" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Non-str stays</text>
  <text x="1542" y="610" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">OsString, bytes, HashSet:</text>
  <text x="1542" y="648" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">not str shapes, out of scope</text>

  <rect x="1125" y="765" width="765" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1152" y="813" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Launcher back to zero str-shape drift</text>
  <text x="1152" y="855" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">neighbors already used the helper</text>
  <text x="1152" y="893" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">identical predicate, no behavior change</text>

  <path d="M1505 460 L1300 510" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1284,514 1312,494 1318,523" fill="#7aa2f7"/>
  <path d="M1515 460 L1715 510" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1731,514 1697,523 1704,494" fill="#7aa2f7"/>
  <path d="M1300 705 L1300 752" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1300,765 1284,736 1316,736" fill="#7aa2f7"/>
  <path d="M1715 705 L1715 752" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1715,765 1699,736 1731,736" fill="#7aa2f7"/>

  <rect x="110" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="138" y="1103" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">Three copies of one predicate invite silent drift.</text>
  <rect x="1125" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1153" y="1103" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">One helper owns the predicate; call sites just ask.</text>

  <text x="55" y="1172" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="22">Scope: launcher string emptiness filters; non-str and build-script sites stay; no behavior change.</text>
</svg>
