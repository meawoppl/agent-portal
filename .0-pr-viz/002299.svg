<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2299 · Judge retention tests by their own session's rows</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">run_retention_cleanup is global, so its counts include other parallel tests'</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">rows; the two retention tests now assert only on their own seeded session.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="840" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">retention_pre_archive_failure_holds_trim</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">assert_eq!(age_deleted, 0)</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">flakes: other tests' old rows count</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">retention_archive_disabled_holds_nothing...</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">assert!(age_deleted &gt;= 1)</text>
  <text x="79" y="560" font-size="23" fill="#f7768e">passes on others' rows even if its own survived</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">insert_old_message(...)</text>
  <text x="79" y="725" font-size="23" fill="#a9b1d6">returns nothing</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">no handle on the seeded row</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">Hold test</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">remaining == [(seeded, "hello")]</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">plus held.contains(&amp;sid)</text>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">No-hold test</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">this session's message count == 0</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">global count ignored</text>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">insert_old_message(...) -&gt; Uuid</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">test_transaction rolls cleanup back</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">no production code changed</text>
</svg>
