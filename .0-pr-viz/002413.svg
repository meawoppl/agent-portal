<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="monospace" font-size="24" fill="#a9b1d6">PR #2413 · Highlight completed question answers containing commas</text>
<text x="55" y="110" font-family="monospace" font-size="34" fill="#e6e9f5">Single-choice labels keep their punctuation, so the selected option stays highlighted.</text>
<path d="M55 160H1945 M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="225" font-family="monospace" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1055" y="225" font-family="monospace" font-size="24" fill="#9ece6a">AFTER</text>
<g><rect x="55" y="285" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="80" y="340" font-family="monospace" font-size="28" fill="#7aa2f7">Answer: Yes, ship it</text>
<text x="80" y="393" font-family="monospace" font-size="25" fill="#c0caf5">Stored answer text is correct.</text>
</g>
<g><rect x="55" y="530" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="80" y="585" font-family="monospace" font-size="28" fill="#7aa2f7">Every answer is split on commas</text>
<text x="80" y="638" font-family="monospace" font-size="25" fill="#c0caf5">Fragments: Yes | ship it</text>
</g>
<g><rect x="55" y="775" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="80" y="830" font-family="monospace" font-size="28" fill="#7aa2f7">Option: Yes, ship it</text>
<text x="80" y="883" font-family="monospace" font-size="25" fill="#f7768e">Neither fragment matches: no highlight.</text>
</g>
<g><rect x="1055" y="285" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="1080" y="340" font-family="monospace" font-size="28" fill="#7aa2f7">Answer: Yes, ship it</text>
<text x="1080" y="393" font-family="monospace" font-size="25" fill="#c0caf5">Stored answer text is correct.</text>
</g>
<g><rect x="1055" y="530" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="1080" y="585" font-family="monospace" font-size="28" fill="#7aa2f7">answer_selects_option</text>
<text x="1080" y="638" font-family="monospace" font-size="25" fill="#c0caf5">Single choice compares the complete label.</text>
</g>
<g><rect x="1055" y="775" width="885" height="170" rx="12" fill="#1e202e" stroke="#565f89"/>
<text x="1080" y="830" font-family="monospace" font-size="28" fill="#7aa2f7">Option: Yes, ship it</text>
<text x="1080" y="883" font-family="monospace" font-size="25" fill="#9ece6a">Exact match: selected class and filled icon.</text>
</g>
<text x="55" y="1172" font-family="monospace" font-size="22" fill="#a9b1d6">Scope: completed-answer highlighting. Multi-select retains the existing comma-separated answer format.</text>
</svg>