<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2118 - Remove waiting count from dashboard header</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">The rail pills already outline sessions that need a reply, so the</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">header count is redundant and goes away.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">Header actions</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">A pulsing waiting-badge span showed</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">N waiting whenever waiting_count &gt; 0.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">Header actions</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Only the turn metrics pill remains; the</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">waiting-badge span is gone from page.rs.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Collapsed header toggle</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">header-collapse-toggle read N waiting and the</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">has-waiting class tinted the strip red.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">Collapsed header toggle</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">The toggle is a plain arrow again; has-waiting</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">and its session-layout.css rule are removed.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">Styles</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">session-layout.css and session-mobile.css kept</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">rules for waiting-badge.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">Styles and tab title</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Both waiting-badge rules are deleted; the browser</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">tab title still shows the waiting count.</text>
</g>
</svg>
