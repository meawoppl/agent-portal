<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2456 · Build identity at artifact boundaries</text>
<text x="55" y="105" font-family="sans-serif" font-size="34" fill="#e6e9f5">Git metadata used to invalidate shared and its dependents on every commit.</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">Boundary build scripts now refresh artifact identity while reusable libraries remain fresh.</text>
<path d="M55 175 H1945 M1000 190 V1140" stroke="#565f89" stroke-dasharray="6 6"/>
<text x="55" y="225" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="225" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="270" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="312" font-family="sans-serif" font-size="28" fill="#f7768e">shared/build.rs</text>
<text x="80" y="355" font-family="sans-serif" font-size="24" fill="#c0caf5">HEAD changes version, hash and time</text>
<text x="80" y="390" font-family="sans-serif" font-size="24" fill="#c0caf5">shared::VERSION changes compiled shared crate</text>
<rect x="55" y="535" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="577" font-family="sans-serif" font-size="28" fill="#f7768e">Dependency invalidation spreads</text>
<text x="80" y="620" font-family="sans-serif" font-size="24" fill="#c0caf5">session_lib and four agent adapters recheck</text>
<text x="80" y="655" font-family="sans-serif" font-size="24" fill="#c0caf5">portal_auth and portal_sysmon recheck</text>
<text x="80" y="690" font-family="sans-serif" font-size="24" fill="#c0caf5">Launcher must recheck too</text>
<rect x="55" y="800" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="842" font-family="sans-serif" font-size="28" fill="#f7768e">Source-identical commit: 11.37 s</text>
<text x="80" y="885" font-family="sans-serif" font-size="24" fill="#c0caf5">9 non-fresh workspace crates</text>
<text x="80" y="920" font-family="sans-serif" font-size="24" fill="#c0caf5">Warm cargo check -p agent-portal</text>
<rect x="1055" y="270" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="312" font-family="sans-serif" font-size="28" fill="#9ece6a">build-support/identity.rs</text>
<text x="1080" y="355" font-family="sans-serif" font-size="24" fill="#c0caf5">Backend, frontend, launcher and proxy own identity</text>
<text x="1080" y="390" font-family="sans-serif" font-size="24" fill="#c0caf5">Shared BuildInfo and registry are stable</text>
<rect x="1055" y="535" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="577" font-family="sans-serif" font-size="28" fill="#9ece6a">Fresh identity, reusable libraries</text>
<text x="1080" y="620" font-family="sans-serif" font-size="24" fill="#c0caf5">Native entrypoints register their own BUILD_INFO</text>
<text x="1080" y="655" font-family="sans-serif" font-size="24" fill="#c0caf5">Session libraries read the running artifact identity</text>
<text x="1080" y="690" font-family="sans-serif" font-size="24" fill="#c0caf5">Real source changes still invalidate dependents</text>
<rect x="1055" y="800" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="842" font-family="sans-serif" font-size="28" fill="#9ece6a">Source-identical commit: 3.19 s</text>
<text x="1080" y="885" font-family="sans-serif" font-size="24" fill="#c0caf5">Only launcher is non-fresh</text>
<text x="1080" y="920" font-family="sans-serif" font-size="24" fill="#c0caf5">Shallow, tarball and worktree semantics preserved</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: local warm type-check timings, not a release/CI speedup claim. Artifact boundaries still compile and relink.</text>
</svg>