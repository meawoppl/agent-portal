<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="monospace" font-size="24" fill="#a9b1d6">PR #2519 · Live session status</text>
<text x="55" y="103" font-family="monospace" font-size="34" fill="#e6e9f5">Live status updates render only the strip.</text>
<text x="55" y="146" font-family="monospace" font-size="34" fill="#e6e9f5">Thinking offsets and metric positions follow the cached groups.</text>
<path d="M55 175H1945 M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="monospace" font-size="22" fill="#f7768e">BEFORE</text>
<rect x="55" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">ToolProgress / Ephemeral</text>
<text x="79" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Update state and render SessionView.</text>
<path d="M500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">SessionView::view</text>
<text x="79" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Revisit every transcript group.</text>
<text x="79" y="711" font-family="monospace" font-size="23" fill="#c0caf5">Recompute thinking offsets and metric positions.</text>
<path d="M500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">Transcript tail</text>
<text x="79" y="939" font-family="monospace" font-size="23" fill="#c0caf5">Render the status markup and follow the tail.</text>
<text x="1055" y="230" font-family="monospace" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="1055" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">ToolProgress / Ephemeral</text>
<text x="1079" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Publish LiveStatusSnapshot through a callback.</text>
<path d="M1500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">LiveStatus</text>
<text x="1079" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Render the changed strip and signal tail scrolling.</text>
<path d="M1500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">GroupPresentation</text>
<text x="1079" y="939" font-family="monospace" font-size="23" fill="#c0caf5">Reuse thinking offsets and metric positions.</text>
<text x="1079" y="981" font-family="monospace" font-size="23" fill="#c0caf5">Join against the current turn metrics.</text>
<text x="55" y="1172" font-family="monospace" font-size="22" fill="#a9b1d6">Durable output clears finished status. Readers at the tail continue to follow it.</text>
</svg>
