<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" font-family="sans-serif">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-size="24" fill="#565f89">FEDERATION / ADMINISTRATOR CONTROLS / PR 2234</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">Configure who may request linked access, and cap what</text>
<text x="55" y="140" font-size="34" fill="#e6e9f5">users can approve, from the native admin dashboard.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666"/>
<line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-dasharray="12 14"/>
<text x="105" y="235" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1090" y="235" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="105" y="280" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="325" font-size="26" fill="#f7768e">Policy is available only through the API</text>
<text x="129" y="368" font-size="23" fill="#a9b1d6">Operators need a manual request to configure it.</text>
<text x="129" y="406" font-size="23" fill="#a9b1d6">The default remains Off.</text>
<line x1="525" y1="460" x2="525" y2="510" stroke="#565f89" stroke-width="3"/>
<rect x="105" y="510" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="555" font-size="26" fill="#f7768e">Remote clients request their own scope</text>
<text x="129" y="598" font-size="23" fill="#a9b1d6">The server enforces the administrator ceiling.</text>
<text x="129" y="636" font-size="23" fill="#a9b1d6">The native UI does not expose that ceiling.</text>
<line x1="525" y1="690" x2="525" y2="740" stroke="#565f89" stroke-width="3"/>
<rect x="105" y="740" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="785" font-size="26" fill="#f7768e">A failed load must not invent a policy</text>
<text x="129" y="828" font-size="23" fill="#a9b1d6">An editable default could overwrite server state.</text>
<text x="129" y="866" font-size="23" fill="#a9b1d6">Typing must not recreate the draft input.</text>
<rect x="1055" y="280" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="325" font-size="26" fill="#9ece6a">Admin &gt; Federation</text>
<text x="1079" y="368" font-size="23" fill="#a9b1d6">Off / Only listed portals / Any with approval.</text>
<text x="1079" y="406" font-size="23" fill="#a9b1d6">Choose Read only or Read and send commands.</text>
<line x1="1475" y1="460" x2="1475" y2="510" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="510" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="555" font-size="26" fill="#9ece6a">Validate and save explicit origins</text>
<text x="1079" y="598" font-size="23" fill="#a9b1d6">One origin per line; server canonicalizes values.</text>
<text x="1079" y="636" font-size="23" fill="#a9b1d6">Existing session roles still limit every action.</text>
<line x1="1475" y1="690" x2="1475" y2="740" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="740" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="785" font-size="26" fill="#9ece6a">Load before editing; own drafts locally</text>
<text x="1079" y="828" font-size="23" fill="#a9b1d6">Retry a failed load without an editable fallback.</text>
<text x="1079" y="866" font-size="23" fill="#a9b1d6">Save errors remain visible; success is confirmed.</text>
<text x="55" y="1172" font-size="22" fill="#e0af68">Turning Off blocks new and existing linked access; it does not delete grants. Depends on the policy API.</text>
</svg>