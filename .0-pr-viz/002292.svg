<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2292 · Run plugin commands through Portal with approval</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Plugin commands were display-only pills; the dock now resolves one,</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">asks the owner to approve the exact line, runs it, and records the result.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">[[commands]] in the dock</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">name + description pills</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">no way to run one from Portal</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">PluginAction::RunCommand</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">"This launcher cannot run that plugin action yet"</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">accepts_args parsed by validate only</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Provenance</text>
  <text x="79" y="725" font-size="23" fill="#f7768e">an agent runs the plugin CLI as plain shell</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">{cwd} could expand to the daemon's own directory</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">CommandRunner (owner, home)</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">Run, then args (quoted), then Review the exact line</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">plugin, computer and directory, then Run, then result</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">no approval: preview + proposal fingerprint</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">command_invocation: session {cwd}, quoted args</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">claim, then fingerprint must match; tree killed at 5 min</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">Transcript card (portal, not a tool call)</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">Plugin command `tinytest:echo one 'two words'`</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">exit status, computer, directory, output tail</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Out of scope for now: an agent-facing CLI verb for named plugin commands; agents keep their shell.</text>
</svg>
