<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200"><rect width="2000" height="1200" fill="#1a1b26"/><g font-family="Arial, sans-serif">
<text x="55" y="52" font-size="24" fill="#a9b1d6">PR #2375 · Reclaim expired messages for offline proxies</text>
<text x="55" y="110" font-size="34" fill="#e6e9f5">Offline queues used to keep expired messages until reconnect.</text>
<text x="55" y="152" font-size="34" fill="#e6e9f5">The liveness sweep now removes expired messages and empty queues.</text>
<path d="M55 170 H1945 M1000 190 V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="225" font-size="24" fill="#f7768e">BEFORE</text>
<rect x="55" y="285" width="880" height="100" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="342" font-size="27" fill="#f7768e">queue_pending_message: up to 100 frames</text>
<path d="M495 385 v50" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="435" width="880" height="100" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="492" font-size="27" fill="#f7768e">Proxy never reconnects</text>
<path d="M495 535 v50" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="585" width="880" height="100" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="642" font-size="27" fill="#f7768e">Expiry is checked only during replay</text>
<path d="M495 685 v50" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="735" width="880" height="100" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="792" font-size="27" fill="#f7768e">Old message bodies remain resident</text>
<text x="1055" y="225" font-size="24" fill="#9ece6a">AFTER</text>
<rect x="1055" y="285" width="880" height="100" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="342" font-size="27" fill="#9ece6a">queue_pending_message: prune expired frames</text>
<path d="M1495 385 v50" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="435" width="880" height="100" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="492" font-size="27" fill="#9ece6a">Liveness sweep runs every 30 seconds</text>
<path d="M1495 535 v50" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="585" width="880" height="100" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="642" font-size="27" fill="#9ece6a">sweep_expired_pending_messages checks TTL</text>
<path d="M1495 685 v50" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="735" width="880" height="100" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="792" font-size="27" fill="#9ece6a">Atomic retain removes empty queues</text>
<text x="55" y="1172" font-size="22" fill="#a9b1d6">The five-minute TTL and durable pending_inputs replay policy are unchanged.</text>
</g></svg>