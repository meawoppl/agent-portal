<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<g font-family="sans-serif" fill="#c0caf5">
<text x="55" y="55" font-size="24" fill="#a9b1d6">PR #2318 · A readable Computers table</text>
<text x="55" y="110" font-size="34" fill="#e6e9f5">Wide actions and clipped account labels hid agent status.</text>
<text x="55" y="155" font-size="34" fill="#e6e9f5">Compact controls and status pills give each agent room.</text>
<path d="M55 180 H1945 M1000 210 V1120" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="80" y="240" font-size="26" fill="#f7768e">BEFORE</text>
<text x="1055" y="240" font-size="26" fill="#9ece6a">AFTER</text>
<rect x="65" y="290" width="860" height="190" rx="16" fill="#1e202e" stroke="#565f89"/>
<text x="95" y="335" font-size="28" fill="#7aa2f7">Wide launcher actions</text>
<text x="95" y="385" font-size="25">Update &amp; Restart + Restart + hidden Cancel space</text>
<text x="95" y="430" font-size="25">Separate version column squeezed computer names.</text>
<path d="M495 480 V570" stroke="#f7768e" stroke-width="3"/>
<rect x="65" y="570" width="860" height="190" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="95" y="620" font-size="28" fill="#f7768e">Agent details pushed off-screen</text>
<text x="95" y="670" font-size="25">One long line mixed status, account and plan.</text>
<text x="95" y="715" font-size="25">Important text was ellipsized.</text>
<rect x="1045" y="290" width="890" height="190" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1075" y="335" font-size="28" fill="#7aa2f7">Square update / restart controls</text>
<text x="1075" y="385" font-size="25">Hover hints and accessible names describe each action.</text>
<text x="1075" y="430" font-size="25">Confirmation remains a separate click.</text>
<path d="M1490 480 V570" stroke="#9ece6a" stroke-width="3"/>
<rect x="1045" y="570" width="890" height="190" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1075" y="620" font-size="28" fill="#9ece6a">Status pills above account details</text>
<text x="1075" y="670" font-size="25">Installed + Signed in/out appear on the first line.</text>
<text x="1075" y="715" font-size="25">Account and plan wrap below, without ellipsis.</text>
<rect x="1045" y="850" width="890" height="190" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1075" y="900" font-size="28" fill="#9ece6a">Balanced computer and agent columns</text>
<text x="1075" y="950" font-size="25">Version sits beneath the hostname.</text>
<text x="1075" y="995" font-size="25">Phones scroll the table; touch targets stay 44px.</text>
<text x="55" y="1170" font-size="22" fill="#a9b1d6">Layout only: agent probing, authentication, and launcher lifecycle behavior are unchanged.</text>
</g></svg>
