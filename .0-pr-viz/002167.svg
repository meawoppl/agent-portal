<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2167 - Show image previews on uploaded attachment chips</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">A pasted image showed as a filename chip only; it now gets a</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">thumbnail that opens the lightbox, pulled from the working directory.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">Upload receipt chip</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">An uploaded image appeared in the sent message as a</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">filename and size chip only.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">Thumbnail above the chip</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">render_upload_preview shows the image; click opens</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">the zoom and pan lightbox.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Where the bytes live</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">The transcript kept only a name and size, so the</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">image could not be shown or revisited.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">Pulled from the session</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">session_file_pull_url fetches it from the working</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">directory, so it survives reloads.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">When the file is unavailable</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">A failed load would have shown a media expired card</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">beside a chip that already names the file.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">quiet_when_unavailable</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">A failed pull renders nothing and the chip stays;</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">non-images like notes.txt show only the chip.</text>
</g>
</svg>
