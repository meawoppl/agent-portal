<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 2152 - Route overload matcher via shared helper</title>
  <desc id="desc">The overload matcher lowercased error text into a local copy for two checks; both now call shared::strings::contains_case_insensitive.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="68" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="1">PR #2152 - Route overload matcher via shared helper</text>
  <text x="55" y="122" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">The overload matcher lowercased error text into a local copy.</text>
  <text x="55" y="164" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Both checks now route through shared::strings::contains_case_insensitive.</text>
  <line x1="55" y1="192" x2="1945" y2="192" stroke="#3d4666" stroke-width="2"/>

  <text x="55" y="244" fill="#f7768e" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1055" y="244" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <line x1="1000" y1="210" x2="1000" y2="1140" stroke="#3d4666" stroke-width="3" stroke-dasharray="14 16"/>

  <rect x="70" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="115" y="325" width="760" height="150" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="145" y="371" fill="#f7768e" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">is_transient_overload - local copy</text>
  <text x="145" y="415" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="24">let lower = text.to_ascii_lowercase()</text>
  <text x="145" y="453" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">lowered once, read twice</text>

  <rect x="115" y="500" width="760" height="150" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="546" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">raw provider form</text>
  <text x="145" y="590" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">lower.contains("overloaded_error")</text>
  <text x="145" y="628" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">immediate retry on match</text>

  <rect x="115" y="675" width="760" height="150" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="721" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">529 overload gate</text>
  <text x="145" y="765" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">lower.contains("overloaded")</text>
  <text x="145" y="803" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">needs a 529 signal beside it</text>

  <rect x="115" y="850" width="760" height="150" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="145" y="896" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">numeric 529 signal</text>
  <text x="145" y="940" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">result_text.contains("529")</text>
  <text x="145" y="978" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="24">no case involved, untouched</text>

  <rect x="1085" y="285" width="850" height="750" rx="26" fill="#1a1b26" stroke="#3d4666" stroke-width="3"/>
  <rect x="1125" y="335" width="765" height="125" rx="16" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1155" y="382" fill="#7aa2f7" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">shared::strings::contains_case_insensitive</text>
  <text x="1155" y="424" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="23">Single home for lower-then-contains</text>
  <text x="1645" y="424" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="23">shared/src/strings.rs</text>

  <rect x="1125" y="520" width="365" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1152" y="568" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">raw form routed</text>
  <text x="1152" y="610" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">contains_case_insensitive(</text>
  <text x="1152" y="648" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">text, "overloaded_error")</text>

  <rect x="1515" y="520" width="375" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1542" y="568" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">529 gate routed</text>
  <text x="1542" y="610" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">contains_case_insensitive(</text>
  <text x="1542" y="648" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">text, "overloaded")</text>

  <rect x="1125" y="765" width="765" height="185" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1152" y="813" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Local lowering deleted</text>
  <text x="1152" y="855" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="22">needles are lowercase ASCII, helper matches identically</text>
  <text x="1152" y="893" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="21">new OVERLOADED_ERROR test pins the case-insensitivity</text>

  <path d="M1505 460 L1300 510" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1284,514 1312,494 1318,523" fill="#7aa2f7"/>
  <path d="M1515 460 L1715 510" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1731,514 1697,523 1704,494" fill="#7aa2f7"/>
  <path d="M1300 705 L1300 752" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1300,765 1284,736 1316,736" fill="#7aa2f7"/>
  <path d="M1715 705 L1715 752" fill="none" stroke="#7aa2f7" stroke-width="4"/>
  <polygon points="1715,765 1699,736 1731,736" fill="#7aa2f7"/>

  <rect x="110" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="138" y="1103" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">A private lowercase copy invites silent drift.</text>
  <rect x="1125" y="1068" width="770" height="54" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1153" y="1103" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="22">One helper owns the matching; call sites just ask.</text>

  <text x="55" y="1172" fill="#565f89" font-family="Inter, Arial, sans-serif" font-size="22">Scope: backend overload matcher only; 529 and status plumbing stay; no behavior change.</text>
</svg>
