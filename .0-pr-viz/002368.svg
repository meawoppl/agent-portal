<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<defs>
  <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
  </marker>
  <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
  </marker>
  <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
  </marker>
</defs>
<g font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif" fill="#c0caf5">

<text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2368 · Time out WebSocket handshakes so a stalled reconnect retries</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">A reconnect whose handshake was never answered awaited forever, stranding every session;</text>
<text x="55" y="140" font-size="34" fill="#e6e9f5">session_lib::connect bounds it at 20s, so the stall becomes an Err and backoff retries.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

<text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
<text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
<line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

<!-- BEFORE -->
<rect x="65" y="250" width="870" height="190" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="89" y="292" font-size="26" fill="#7aa2f7">Reconnect loops</text>
<text x="89" y="334" font-size="23" fill="#a9b1d6">launcher: connection/mod.rs</text>
<text x="89" y="374" font-size="23" fill="#a9b1d6">sessions: connect_to_backend; tunnel: run_data_plane</text>
<text x="89" y="412" font-size="22" fill="#565f89">each retries with backoff on Err</text>

<line x1="500" y1="440" x2="500" y2="520" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
<text x="516" y="486" font-size="22" fill="#565f89">.await, no deadline</text>

<rect x="65" y="525" width="870" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="567" font-size="26" fill="#7aa2f7">ws_bridge::native_client::connect</text>
<text x="89" y="609" font-size="23" fill="#a9b1d6">TCP opens, TLS / upgrade never answered</text>
<text x="89" y="649" font-size="23" fill="#f7768e">future never resolves - no Ok, no Err</text>
<text x="89" y="687" font-size="22" fill="#565f89">launcher RegisterAck recv().await: same, unbounded</text>

<line x1="500" y1="715" x2="500" y2="795" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="516" y="761" font-size="22" fill="#f7768e">backoff never reached</text>

<rect x="65" y="800" width="870" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
<text x="89" y="842" font-size="26" fill="#f7768e">Stuck until service restart</text>
<text x="89" y="884" font-size="23" fill="#a9b1d6">last log: "Connecting to backend" (22:58)</text>
<text x="89" y="924" font-size="23" fill="#a9b1d6">no "Connected" / "Session registered" for 11h</text>
<text x="89" y="962" font-size="22" fill="#565f89">browser shows every session disconnected</text>

<!-- AFTER -->
<rect x="1040" y="250" width="895" height="190" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="1064" y="292" font-size="26" fill="#7aa2f7">Reconnect loops</text>
<text x="1064" y="334" font-size="23" fill="#a9b1d6">launcher: connection/mod.rs</text>
<text x="1064" y="374" font-size="23" fill="#a9b1d6">sessions: connect_to_backend; tunnel: run_data_plane</text>
<text x="1064" y="412" font-size="22" fill="#565f89">each retries with backoff on Err (unchanged)</text>

<line x1="1487" y1="440" x2="1487" y2="520" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="1503" y="486" font-size="22" fill="#9ece6a">session_lib::connect</text>

<rect x="1040" y="525" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1064" y="567" font-size="26" fill="#9ece6a">tokio::time::timeout(CONNECT_TIMEOUT, ...)</text>
<text x="1064" y="609" font-size="23" fill="#a9b1d6">CONNECT_TIMEOUT = 20s over TCP + TLS + upgrade</text>
<text x="1064" y="649" font-size="23" fill="#a9b1d6">elapsed -> ConnectError::TimedOut</text>
<text x="1064" y="687" font-size="22" fill="#565f89">launcher RegisterAck wait: REGISTER_ACK_TIMEOUT = 10s</text>

<line x1="1487" y1="715" x2="1487" y2="795" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="1503" y="761" font-size="22" fill="#9ece6a">Err -> existing backoff</text>

<rect x="1040" y="800" width="895" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
<text x="1064" y="842" font-size="26" fill="#9ece6a">Stalled dial retries itself</text>
<text x="1064" y="884" font-size="23" fill="#a9b1d6">a fresh socket replaces the half-open one</text>
<text x="1064" y="924" font-size="23" fill="#a9b1d6">sessions re-register without a restart</text>
<text x="1064" y="962" font-size="22" fill="#565f89">test: silent TCP listener -> TimedOut</text>

<text x="55" y="1172" font-size="22" fill="#565f89">Scope: the deadline lives in session-lib, not upstream ws_bridge; other callers of ws_bridge connect (tests) remain unbounded.</text>
</g>
</svg>
