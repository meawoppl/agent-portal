<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1825 · Keep the show-more/show-less toggle outside scrollable output</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The expand toggle was the last child of a pre that several consumers cap and scroll,</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">so "show less" clipped at the box edge; it now renders as a sibling, always visible.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE ==================== -->
  <text x="80" y="258" font-size="22" fill="#a9b1d6">DOM shape (ExpandableText, pre form)</text>
  <g>
    <rect x="80" y="275" width="500" height="230" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="315" font-size="23" fill="#7aa2f7">pre.tool-result-content</text>
    <text x="104" y="349" font-size="21" fill="#565f89">max-height: 200px · overflow-y: auto</text>
    <text x="124" y="391" font-size="23" fill="#a9b1d6">...expanded output (tall)...</text>
    <rect x="104" y="420" width="300" height="44" fill="none" stroke="#f7768e" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="124" y="448" font-size="23" fill="#f7768e">div.expandable-toggle</text>
  </g>
  <text x="620" y="360" font-size="22" fill="#a9b1d6">the toggle is INSIDE the</text>
  <text x="620" y="392" font-size="22" fill="#a9b1d6">scroll container — the last</text>
  <text x="620" y="424" font-size="22" fill="#a9b1d6">thing in the scroll run</text>
  <text x="620" y="470" font-size="21" fill="#f7768e">at the 200px window edge it</text>
  <text x="620" y="500" font-size="21" fill="#f7768e">renders half-clipped, mid-glyph</text>

  <g>
    <rect x="80" y="570" width="840" height="160" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="612" font-size="26" fill="#c0caf5">who scrolls that pre</text>
    <text x="104" y="650" font-size="23" fill="#a9b1d6">.tool-result-content (tool results, 200px) · .write-content (400px)</text>
    <text x="104" y="684" font-size="21" fill="#565f89">ExpandableLines had the identical shape for file previews</text>
  </g>

  <g>
    <rect x="80" y="930" width="840" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="976" font-size="26" fill="#c0caf5">"show less" truncated at the box edge</text>
    <text x="104" y="1014" font-size="23" fill="#f7768e">reachable only by scrolling — behind a thin, easy-to-miss scrollbar</text>
    <text x="104" y="1048" font-size="21" fill="#565f89">live-reported with a screenshot of an expanded cargo fmt result</text>
  </g>

  <!-- ==================== AFTER ==================== -->
  <text x="1065" y="258" font-size="22" fill="#a9b1d6">DOM shape now</text>
  <g>
    <rect x="1065" y="275" width="520" height="290" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="315" font-size="23" fill="#9ece6a">div.expandable-block</text>
    <rect x="1089" y="335" width="420" height="130" fill="none" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1109" y="373" font-size="23" fill="#7aa2f7">pre.tool-result-content</text>
    <text x="1109" y="407" font-size="21" fill="#565f89">still capped + scrollable</text>
    <text x="1109" y="441" font-size="21" fill="#a9b1d6">...expanded output...</text>
    <rect x="1089" y="485" width="300" height="44" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1109" y="513" font-size="23" fill="#9ece6a">div.expandable-toggle</text>
  </g>
  <text x="1625" y="380" font-size="22" fill="#a9b1d6">the toggle is a SIBLING</text>
  <text x="1625" y="412" font-size="22" fill="#a9b1d6">after the pre — outside</text>
  <text x="1625" y="444" font-size="22" fill="#a9b1d6">the scroll run entirely</text>
  <text x="1625" y="490" font-size="21" fill="#9ece6a">always fully visible and</text>
  <text x="1625" y="520" font-size="21" fill="#9ece6a">clickable, any scroll state</text>

  <g>
    <rect x="1065" y="570" width="860" height="160" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="612" font-size="26" fill="#c0caf5">precedent already in the codebase</text>
    <text x="1089" y="650" font-size="23" fill="#a9b1d6">the diff card: .diff-view scrolls (400px), its toggle is a sibling</text>
    <text x="1089" y="684" font-size="21" fill="#565f89">which is exactly why diffs never showed this bug — shape now uniform</text>
  </g>

  <line x1="1495" y1="730" x2="1495" y2="922" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1520" y="830" font-size="21" fill="#565f89">no CSS changes — div.expandable-toggle</text>
  <text x="1520" y="860" font-size="21" fill="#565f89">already block + margin-top</text>

  <g>
    <rect x="1065" y="930" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="976" font-size="26" fill="#c0caf5">expand and collapse from anywhere</text>
    <text x="1089" y="1014" font-size="23" fill="#9ece6a">ExpandableText and ExpandableLines both hoisted; tests green</text>
    <text x="1089" y="1048" font-size="21" fill="#565f89">the inline span form (header chips) keeps its inline toggle — correct there</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Collapsing a long output while scrolled deep does not scroll you back to the card top — a follow-up nicety, not part of this fix.</text>
</svg>
