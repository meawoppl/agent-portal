<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2520 · Share the live Muse overlay instead of copying it per render</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Every SessionView render deep-copied up to 256 live Muse records into props;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">the overlay is now an Rc, so renders without a new delta share it by pointer.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="240" width="840" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="282" font-size="26" fill="#7aa2f7">MuseLiveTurn</text>
    <text x="104" y="322" font-size="23" fill="#a9b1d6">events: Vec&lt;serde_json::Value&gt; (MAX_EVENTS 256)</text>
    <text x="104" y="358" font-size="22" fill="#565f89">push overwrites status, coalesces output, drops oldest</text>
  </g>
  <line x1="500" y1="390" x2="500" y2="436" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="520" y="420" font-size="22" fill="#565f89">every view(), any reason</text>
  <g>
    <rect x="80" y="440" width="840" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="482" font-size="26" fill="#f7768e">muse_live_turn.events.clone() into props</text>
    <text x="104" y="522" font-size="23" fill="#f7768e">deep copy of every live JSON record</text>
    <text x="104" y="558" font-size="23" fill="#f7768e">then Vec&lt;Value&gt; props compared element by element</text>
    <text x="104" y="596" font-size="22" fill="#565f89">tool heartbeats and status lines paid this too</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1040" y="240" width="880" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="282" font-size="26" fill="#7aa2f7">MuseLiveTurn</text>
    <text x="1064" y="322" font-size="23" fill="#9ece6a">events: Rc&lt;Vec&lt;serde_json::Value&gt;&gt;</text>
    <text x="1064" y="358" font-size="23" fill="#9ece6a">push writes through Rc::make_mut; new turn resets</text>
  </g>
  <line x1="1480" y1="390" x2="1480" y2="436" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1500" y="420" font-size="22" fill="#565f89">every view(), any reason</text>
  <g>
    <rect x="1040" y="440" width="880" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="482" font-size="26" fill="#9ece6a">muse_live_events: Rc clone, pointer compare</text>
    <text x="1064" y="522" font-size="23" fill="#9ece6a">no delta since last render: nothing copied</text>
    <text x="1064" y="558" font-size="23" fill="#a9b1d6">a delta copies once (make_mut while props hold it)</text>
    <text x="1064" y="596" font-size="22" fill="#565f89">Value is Eq, so Rc equality checks the pointer first</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Not covered: each delta still replays the whole (bounded, coalesced) overlay onto the persisted tree.</text>
</svg>
