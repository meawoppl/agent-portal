<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="58" fill="#565f89" font-family="Arial, sans-serif" font-size="24">PR #2029 · Route upload id prefixes through truncate helper</text>
  <text x="55" y="112" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">Five log prefixes use the shared helper, not raw byte-slicing</text>
  <line x1="55" y1="160" x2="1945" y2="160" stroke="#565f89" stroke-width="2"/>
  <line x1="1000" y1="195" x2="1000" y2="1115" stroke="#565f89" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="75" y="225" fill="#f7768e" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">BEFORE · AD-HOC SLICING</text>
  <rect x="75" y="265" width="830" height="330" rx="18" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="110" y="315" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">5 call sites spell this out</text>
  <rect x="110" y="350" width="760" height="78" rx="10" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
  <text x="135" y="399" fill="#e6e9f5" font-family="Arial, monospace" font-size="24">&amp;upload_id[..8.min(upload_id.len())]</text>
  <text x="110" y="470" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Raw byte slice: panics if byte 8 lands</text>
  <text x="110" y="510" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">inside a multi-byte character.</text>
  <text x="110" y="560" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">Same expression copied 5 times.</text>

  <rect x="75" y="650" width="830" height="330" rx="18" fill="#1e202e" stroke="#e0af68" stroke-width="3"/>
  <text x="110" y="700" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">The helper was already there</text>
  <text x="110" y="750" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Both files import truncate_str as truncate</text>
  <text x="110" y="790" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">and use it for 80-char text previews.</text>
  <text x="110" y="840" fill="#e0af68" font-family="Arial, sans-serif" font-size="23">ws_reader x2, claude proxy_session x3:</text>
  <text x="110" y="880" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Start, private drop, Failed, duplicate,</text>
  <text x="110" y="920" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">chunk-for-unknown-upload.</text>
  <text x="110" y="960" fill="#565f89" font-family="Arial, sans-serif" font-size="20">UTF-8-safe helper, unused at these lines.</text>

  <text x="1075" y="225" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">AFTER · SHARED HELPER</text>
  <rect x="1095" y="265" width="830" height="330" rx="18" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1130" y="315" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">shared::fmt::truncate(&amp;id, 8)</text>
  <rect x="1130" y="350" width="760" height="78" rx="10" fill="#16161e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1155" y="399" fill="#e6e9f5" font-family="Arial, monospace" font-size="24">truncate(&amp;upload_id, 8)</text>
  <text x="1130" y="470" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Same 8 chars for ASCII ids.</text>
  <text x="1130" y="510" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Backs off to a char boundary otherwise,</text>
  <text x="1130" y="550" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">so the log line can never panic.</text>

  <rect x="1095" y="650" width="830" height="330" rx="18" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1130" y="700" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">5 sites switched, 0 new imports</text>
  <text x="1130" y="750" fill="#7dcfff" font-family="Arial, sans-serif" font-size="23">session-lib ws_reader: Start + drop logs</text>
  <text x="1130" y="790" fill="#7dcfff" font-family="Arial, sans-serif" font-size="23">claude proxy_session: fail, duplicate,</text>
  <text x="1130" y="830" fill="#7dcfff" font-family="Arial, sans-serif" font-size="23">chunk-straggler short id</text>
  <text x="1130" y="880" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Log output unchanged everywhere.</text>
  <text x="1130" y="920" fill="#565f89" font-family="Arial, sans-serif" font-size="20">truncate_str unit tests already pin UTF-8 safety.</text>

  <rect x="1095" y="1035" width="830" height="90" rx="16" fill="#1e202e" stroke="#bb9af7" stroke-width="3"/>
  <text x="1130" y="1073" fill="#bb9af7" font-family="Arial, sans-serif" font-size="23" font-weight="bold">Refactor only: no behavior change</text>
  <text x="1130" y="1106" fill="#c0caf5" font-family="Arial, sans-serif" font-size="18">2 files, +5 -9; touched-crate tests green.</text>
  <text x="55" y="1170" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Follows #2020 / #2027, which deduped short session ids.</text>
</svg>
