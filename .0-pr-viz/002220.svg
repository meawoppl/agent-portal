<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2220 · Deliver the portal reminder only in front of a user input</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">After a compaction the reminder went to the agent as its own hidden turn;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now compaction re-arms it, and it only ever rides in front of a real user input.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="250" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#7aa2f7">compaction boundary / thread/compacted</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">wiggum.rs (Claude), session_event.rs (Codex)</text>
    <text x="104" y="366" font-size="22" fill="#565f89">agent context reset to a summary</text>
  </g>

  <line x1="510" y1="400" x2="510" y2="490" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="495" width="860" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="535" font-size="26" fill="#f7768e">inject_portal_reminder(claude_session)</text>
    <text x="104" y="575" font-size="23" fill="#a9b1d6">send_input(agent_facing(body)) - a turn of its own</text>
    <text x="104" y="611" font-size="23" fill="#a9b1d6">idle: agent answers a prompt the user never sent</text>
    <text x="104" y="647" font-size="23" fill="#a9b1d6">mid-turn: queued after the user's message</text>
  </g>

  <g>
    <rect x="80" y="720" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="760" font-size="26" fill="#7aa2f7">visible_text_with_base_session_notice</text>
    <text x="104" y="800" font-size="23" fill="#f7768e">transcript: "{text}" then the reminder block</text>
    <text x="104" y="836" font-size="22" fill="#565f89">reverse of the order the agent received</text>
  </g>

  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">instructions sent on their own, ahead of input</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">and forks received a second copy</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1065" y="250" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="290" font-size="26" fill="#7aa2f7">compaction boundary / thread/compacted</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">wiggum.rs (Claude), session_event.rs (Codex)</text>
    <text x="1089" y="366" font-size="22" fill="#565f89">agent context reset to a summary</text>
  </g>

  <line x1="1495" y1="400" x2="1495" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="495" width="860" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="535" font-size="26" fill="#9ece6a">reminder_pending.store(true)</text>
    <text x="1089" y="575" font-size="23" fill="#a9b1d6">next input claims it: input_delivery or wiggum resend</text>
    <text x="1089" y="611" font-size="23" fill="#a9b1d6">fold_session_start_reminder: reminder, then text</text>
    <text x="1089" y="647" font-size="22" fill="#565f89">inject_portal_reminder deleted; nothing sends it alone</text>
  </g>

  <g>
    <rect x="1065" y="720" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="760" font-size="26" fill="#7aa2f7">visible_text_with_base_session_notice</text>
    <text x="1089" y="800" font-size="23" fill="#9ece6a">transcript: reminder block, then "{text}"</text>
    <text x="1089" y="836" font-size="22" fill="#565f89">fork_from_session_id set: not primed</text>
  </g>

  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">one copy, first, on the user's own turn</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">no hidden turns; transcript order matches the agent's</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">A turn that auto-compacts finishes without the reminder until the user's next input; Muse still drops the display copy.</text>
</svg>
