<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2535 · Collapse a finished task's started and completed cards into one</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">A background task rendered two cards, "Task Started" and "Task Completed";</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">once it finishes, only the completion card remains, like Codex item lifecycles.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="240" width="840" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="282" font-size="26" fill="#7aa2f7">TASK STARTED  ·  BACKGROUND BASH</text>
    <text x="104" y="322" font-size="23" fill="#a9b1d6">system/task_started { task_id: t-1 }</text>
    <text x="104" y="358" font-size="22" fill="#565f89">"Check whether orin-157 is reachable ..."</text>
  </g>
  <g>
    <rect x="80" y="420" width="840" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="462" font-size="26" fill="#7aa2f7">TASK COMPLETED</text>
    <text x="104" y="502" font-size="23" fill="#a9b1d6">system/task_notification { task_id: t-1 }</text>
    <text x="104" y="538" font-size="22" fill="#565f89">"Check whether orin-157 is reachable ..."</text>
  </g>
  <text x="104" y="620" font-size="23" fill="#f7768e">two cards for one finished task, same text twice</text>

  <!-- AFTER -->
  <g>
    <rect x="1040" y="240" width="880" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="282" font-size="26" fill="#9ece6a">FrameFacts.task: TaskLifecycle::Started / Ended</text>
    <text x="1064" y="322" font-size="23" fill="#a9b1d6">from the cached parse, keyed by TaskRun (task_id, run_id)</text>
    <text x="1064" y="362" font-size="23" fill="#9ece6a">Ended only for completed/failed/killed/stopped</text>
    <text x="1064" y="398" font-size="23" fill="#9ece6a">hide the start only if TaskReport text == description</text>
  </g>
  <line x1="1480" y1="430" x2="1480" y2="476" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1040" y="480" width="880" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="522" font-size="26" fill="#7aa2f7">TASK COMPLETED</text>
    <text x="1064" y="562" font-size="23" fill="#9ece6a">group_messages skips the finished start</text>
    <text x="1064" y="598" font-size="22" fill="#565f89">a still-running task keeps its started card</text>
  </g>
  <text x="1064" y="680" font-size="23" fill="#a9b1d6">a late completion of run r-1 never hides resumed run r-2</text>
  <text x="1064" y="716" font-size="23" fill="#a9b1d6">a differing or withheld report keeps both cards</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Trade-off: the completion card has no task_type, so the "Background Bash" / "Sub-agent" badge goes with the start.</text>
</svg>
