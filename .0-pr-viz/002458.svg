<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2458 · Deterministic migration dump toolchain</text>
<text x="55" y="105" font-family="sans-serif" font-size="34" fill="#e6e9f5">Server and dump clients could drift independently; both now come from one pinned image.</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">Schema comparison and disposable-database cleanup remain strict; versions are logged in CI.</text>
<path d="M55 175 H1945 M1000 190 V1140" stroke="#565f89" stroke-dasharray="6 6"/>
<text x="55" y="225" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="225" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="270" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="312" font-family="sans-serif" font-size="28" fill="#f7768e">Floating PostgreSQL service</text>
<text x="80" y="355" font-family="sans-serif" font-size="24" fill="#c0caf5">postgres:16-alpine resolves at run time</text>
<text x="80" y="390" font-family="sans-serif" font-size="24" fill="#c0caf5">Server image can change between CI runs</text>
<rect x="55" y="535" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="577" font-family="sans-serif" font-size="28" fill="#f7768e">Runner-provided PostgreSQL clients</text>
<text x="80" y="620" font-family="sans-serif" font-size="24" fill="#c0caf5">apt postgresql-client chooses distro tools</text>
<text x="80" y="655" font-family="sans-serif" font-size="24" fill="#c0caf5">pg_dump version can differ from the server</text>
<text x="80" y="690" font-family="sans-serif" font-size="24" fill="#c0caf5">Runner updates can change dump output</text>
<rect x="55" y="800" width="880" height="205" rx="14" fill="#1e202e" stroke="#7aa2f7"/>
<text x="80" y="842" font-family="sans-serif" font-size="28" fill="#7aa2f7">Narrow normalization already exists</text>
<text x="80" y="885" font-family="sans-serif" font-size="24" fill="#c0caf5">pg_attver-only changes are normalized</text>
<text x="80" y="920" font-family="sans-serif" font-size="24" fill="#c0caf5">Real column/option/schema changes still fail</text>
<rect x="1055" y="270" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="312" font-family="sans-serif" font-size="28" fill="#9ece6a">PostgreSQL 16.16 pinned by digest</text>
<text x="1080" y="355" font-family="sans-serif" font-size="24" fill="#c0caf5">One immutable service image</text>
<text x="1080" y="390" font-family="sans-serif" font-size="24" fill="#c0caf5">Image reference and server version logged</text>
<rect x="1055" y="535" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="577" font-family="sans-serif" font-size="28" fill="#9ece6a">Clients from the same service image</text>
<text x="1080" y="620" font-family="sans-serif" font-size="24" fill="#c0caf5">docker exec: pg_dump, createdb, dropdb</text>
<text x="1080" y="655" font-family="sans-serif" font-size="24" fill="#c0caf5">Dump client version logged explicitly</text>
<text x="1080" y="690" font-family="sans-serif" font-size="24" fill="#c0caf5">Host Diesel still uses the same database URL</text>
<rect x="1055" y="800" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="842" font-family="sans-serif" font-size="28" fill="#9ece6a">Strict schema and ownership contracts</text>
<text x="1080" y="885" font-family="sans-serif" font-size="24" fill="#c0caf5">Apply, revert, reapply and compare unchanged</text>
<text x="1080" y="920" font-family="sans-serif" font-size="24" fill="#c0caf5">Only the owned disposable database is dropped</text>
<text x="1080" y="955" font-family="sans-serif" font-size="24" fill="#c0caf5">11 tests plus a real pinned-image roundtrip pass</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: normalizer stays narrow; #2440 remains open until weeks of main/PR runs confirm the flake stays absent.</text>
</svg>