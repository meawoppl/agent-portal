<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2303 · Offer Claude sign-in for any provider auth failure</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">A typed 401 showed no way to sign in, and signing in from a session did</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">nothing visible; now both reuse the existing sign-in and say what's next.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1040" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">is_expired_oauth_error(text)</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">exact "OAuth session expired" text only</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">API Error: 401 authentication_error: no button</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">render_claude_login_action</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">button only with the owner's callback</text>
  <text x="79" y="560" font-size="23" fill="#f7768e">everyone else: nothing</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">AgentLoginModal in the session</text>
  <text x="79" y="725" font-size="23" fill="#f7768e">on_success: Callback::noop()</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">agent keeps failing; no hint, no re-probe</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">is_provider_auth_error(text)</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">OAuth text, or parsed error.type authentication_error</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">rate_limit / overloaded / other errors: no</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">Button, or where to sign in</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">Settings &gt; Computers on its home Portal</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">(owner access required)</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">ClaudeSignedIn</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">note: agent may need restarting (pause, resume)</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">agent_auth_revision: Computers matrix re-probes</text>

  <rect x="1045" y="845" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="1069" y="885" font-size="26" fill="#c0caf5">Never automatic</text>
  <text x="1069" y="925" font-size="23" fill="#a9b1d6">no pause / resume, no prompt resent</text>
  <text x="1069" y="960" font-size="23" fill="#a9b1d6">note clears when the session goes active again</text>
</svg>
