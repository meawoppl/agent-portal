<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="58" fill="#565f89" font-family="Arial, sans-serif" font-size="24" letter-spacing="1">PR #1990 · Reusable schedule launch specs and scratch worktrees</text>
  <text x="55" y="112" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">Schedules used to inherit a live session; now they own launch settings,</text>
  <text x="55" y="154" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">so Settings can create isolated recurring work without a session first.</text>
  <line x1="55" y1="184" x2="1945" y2="184" stroke="#565f89" stroke-width="2"/>
  <line x1="1000" y1="215" x2="1000" y2="1110" stroke="#565f89" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="75" y="235" fill="#f7768e" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">BEFORE</text>
  <rect x="75" y="275" width="830" height="190" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="105" y="320" fill="#7aa2f7" font-family="Arial, sans-serif" font-size="26">ScheduleDialog(session: SessionInfo)</text>
  <text x="105" y="365" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">working_directory, hostname, and agent_type</text>
  <text x="105" y="401" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">were silently copied from an existing session.</text>
  <text x="105" y="437" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">Settings calendar was read-only.</text>
  <line x1="490" y1="465" x2="490" y2="535" stroke="#f7768e" stroke-width="4"/>
  <polygon points="490,555 480,530 500,530" fill="#f7768e"/>
  <rect x="75" y="570" width="830" height="190" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
  <text x="105" y="615" fill="#7aa2f7" font-family="Arial, sans-serif" font-size="26">ScheduledTaskFields</text>
  <text x="105" y="660" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">No worktree mode or branch.</text>
  <text x="105" y="696" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Unattended runs touched the configured checkout.</text>
  <text x="105" y="732" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">Continue plus timestamped cwd would lose resume state.</text>

  <text x="1075" y="235" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">AFTER</text>
  <rect x="1095" y="275" width="830" height="190" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="320" fill="#7aa2f7" font-family="Arial, sans-serif" font-size="26">LaunchSpec + WorktreeMode</text>
  <text x="1125" y="365" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">directory, session_name, agent, args, worktree</text>
  <text x="1125" y="401" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">ScheduleDialog accepts an optional session prefill.</text>
  <text x="1125" y="437" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Settings opens the same create and edit manager.</text>
  <line x1="1510" y1="465" x2="1510" y2="535" stroke="#9ece6a" stroke-width="4"/>
  <polygon points="1510,555 1500,530 1520,530" fill="#9ece6a"/>
  <rect x="1095" y="570" width="830" height="250" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="615" fill="#7aa2f7" font-family="Arial, sans-serif" font-size="26">WorktreeMode::Scratch</text>
  <text x="1125" y="660" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">~/.agent-portal/worktrees/repository/sched-task-id</text>
  <text x="1125" y="700" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Stable cwd preserves Continue-mode transcript lookup.</text>
  <text x="1125" y="740" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Clean checkout + zero new commits permits cleanup.</text>
  <text x="1125" y="780" fill="#e0af68" font-family="Arial, sans-serif" font-size="23">Dirty, committed, or uncertain work is retained.</text>
  <rect x="1095" y="860" width="830" height="150" rx="16" fill="#1e202e" stroke="#7dcfff" stroke-width="3"/>
  <text x="1125" y="905" fill="#7aa2f7" font-family="Arial, sans-serif" font-size="26">LAUNCHER_CAPABILITY_SCRATCH_WORKTREE</text>
  <text x="1125" y="950" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Older launchers never receive scratch schedules.</text>
  <text x="1125" y="986" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Existing task and launch JSON keeps its defaults.</text>

  <text x="55" y="1172" fill="#565f89" font-family="Arial, sans-serif" font-size="22">Scope: hostname pinning remains for rollout compatibility; session continuations keep their session-owned semantics.</text>
</svg>
