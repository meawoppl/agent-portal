    <rect x="420" y="34" width="188" height="32" rx="9" fill="#16161e"/>
    <text x="438" y="57" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Reload v2.15.16</text>

    <rect x="26" y="76" width="608" height="178" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
