<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Compact dashboard headers on mobile</title>
  <desc id="desc">Before and after mobile dashboard layouts show wrapped header chrome replaced by compact single-row controls and session metadata, leaving more room for the transcript.</desc>
  <rect width="2000" height="1200" fill="#1a1b26"/>
  <rect x="50" y="48" width="1900" height="1104" rx="34" fill="#16161e" stroke="#3d4666" stroke-width="3"/>

  <text x="92" y="120" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="700">More transcript, less mobile dashboard chrome</text>
  <text x="92" y="168" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">The same controls stay available while three wrapping header bands collapse into compact one-row surfaces.</text>
  <line x1="1000" y1="205" x2="1000" y2="1100" stroke="#3d4666" stroke-width="3" stroke-dasharray="14 16"/>

  <text x="100" y="254" fill="#f7768e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1080" y="254" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" letter-spacing="4">AFTER</text>

