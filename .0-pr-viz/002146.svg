<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2146 - Show the model in the Codex name tag</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Claude groups read Claude - Sonnet 4.5 but Codex groups read a bare</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">Codex; the tag now carries the session model like Claude does.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">MessageGroupRenderer header</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Codex groups rendered the constant identity label</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">Codex whatever model the session used.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">header_label via codex_label</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">The group header shows Codex - Sol 5.6 when the</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">session model is known, plain Codex otherwise.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Model source</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">Claude frames carry their own model; Codex frames</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">carry none, so nothing reached the renderer.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">model prop from session last_model</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">SessionView and the demo pass SessionInfo.last_model,</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">the value the rail pill version watermark uses.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">Model id formatting</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">shorten_model_name handled only claude ids; a</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">gpt id had no display name.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">shorten_codex_model_name</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">gpt-5.6-sol is Sol 5.6, gpt-6-astra is Astra 6,</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">gpt-5.5-codex is 5.5; dates and codex dropped.</text>
</g>
</svg>
