<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2336 · Readable operational log context</text>
<text x="55" y="110" font-family="sans-serif" font-size="34" fill="#e6e9f5">UUID-only failures made the operator reconstruct who and where.</text>
<text x="55" y="155" font-family="sans-serif" font-size="34" fill="#e6e9f5">Names, route templates and peer details now travel with events.</text>
<path d="M1000 190 V1140" stroke="#565f89" stroke-dasharray="8 10"/>
<text x="60" y="230" font-family="sans-serif" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1060" y="230" font-family="sans-serif" font-size="24" fill="#9ece6a">AFTER</text>
<rect x="60" y="280" width="820" height="180" rx="14" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
<text x="84" y="322" font-family="sans-serif" font-size="28" fill="#f7768e">JWT verification failed: Token expired</text>
<text x="84" y="370" font-family="sans-serif" font-size="24" fill="#c0caf5">No owner, token name or session.</text>
<text x="84" y="406" font-family="sans-serif" font-size="24" fill="#c0caf5">A repeated rejection cannot identify its source.</text>
<rect x="1060" y="280" width="820" height="180" rx="14" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1084" y="322" font-family="sans-serif" font-size="28" fill="#9ece6a">Bearer token rejected</text>
<text x="1084" y="370" font-family="sans-serif" font-size="24" fill="#c0caf5">Exact stored hash resolves token_owner and names.</text>
<text x="1084" y="406" font-family="sans-serif" font-size="24" fill="#c0caf5">Route, peer_ip and user_agent provide request context.</text>
<rect x="60" y="540" width="820" height="180" rx="14" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
<text x="84" y="582" font-family="sans-serif" font-size="28" fill="#f7768e">Liveness sweep: session UUID evicted</text>
<text x="84" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Background task loses connection identity.</text>
<text x="84" y="666" font-family="sans-serif" font-size="24" fill="#c0caf5">Operator must query the database to find names.</text>
<rect x="1060" y="540" width="820" height="180" rx="14" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1084" y="582" font-family="sans-serif" font-size="28" fill="#9ece6a">Registry retains the registration log_span</text>
<text x="1084" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">user, session_name and computer accompany eviction.</text>
<text x="1084" y="666" font-family="sans-serif" font-size="24" fill="#c0caf5">Stable IDs remain for correlation; no per-beat lookup.</text>
<rect x="60" y="800" width="820" height="180" rx="14" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
<text x="84" y="842" font-family="sans-serif" font-size="28" fill="#565f89">Optional values use debug wrappers</text>
<text x="84" y="890" font-family="sans-serif" font-size="24" fill="#c0caf5">Some(...) adds clutter to versions and branches.</text>
<text x="84" y="926" font-family="sans-serif" font-size="24" fill="#c0caf5">Identity context varies across connection paths.</text>
<rect x="1060" y="800" width="820" height="180" rx="14" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1084" y="842" font-family="sans-serif" font-size="28" fill="#9ece6a">Bounded, readable context</text>
<text x="1084" y="890" font-family="sans-serif" font-size="24" fill="#c0caf5">Plain values; authenticated socket context survives.</text>
<text x="1084" y="926" font-family="sans-serif" font-size="24" fill="#c0caf5">No credentials, queries, bodies or raw app paths.</text>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: socket labels refresh on reconnect; unknown/deleted credentials remain unattributed and rejected.</text>
</svg>