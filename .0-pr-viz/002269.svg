<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2269 · Session memory containment and kernel OOM notices</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">One session gets one memory cgroup, before its agent starts.</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">Kernel kill counters become transcript evidence, not guesses from exit codes.</text>
<path d="M55 180H1945 M1000 200V1120" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="65" y="235" font-family="sans-serif" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1045" y="235" font-family="sans-serif" font-size="24" fill="#9ece6a">AFTER</text>
<rect x="65" y="280" width="870" height="175" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="89" y="322" font-family="sans-serif" font-size="26" fill="#f7768e">Shared service cgroup</text>
<text x="89" y="362" font-family="sans-serif" font-size="23" fill="#c0caf5">Launcher, agents and build tools share accounting.</text>
<text x="89" y="395" font-family="sans-serif" font-size="23" fill="#c0caf5">No per-session memory.high or memory.max.</text>
<rect x="65" y="525" width="870" height="175" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="89" y="567" font-family="sans-serif" font-size="26" fill="#f7768e">An OOM-killed tool can disappear</text>
<text x="89" y="607" font-family="sans-serif" font-size="23" fill="#c0caf5">Exit 137 cannot distinguish OOM from other kills.</text>
<text x="89" y="640" font-family="sans-serif" font-size="23" fill="#c0caf5">No kernel-backed transcript attribution.</text>
<rect x="65" y="770" width="870" height="175" rx="12" fill="#1e202e" stroke="#a9b1d6"/>
<text x="89" y="812" font-family="sans-serif" font-size="26" fill="#a9b1d6">Process-group cleanup</text>
<text x="89" y="852" font-family="sans-serif" font-size="23" fill="#c0caf5">Descendants can change process group.</text>
<text x="89" y="885" font-family="sans-serif" font-size="23" fill="#c0caf5">No session leaf to reap on teardown.</text>
<rect x="1045" y="280" width="870" height="175" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1069" y="322" font-family="sans-serif" font-size="26" fill="#9ece6a">Delegate=memory + SessionGroup</text>
<text x="1069" y="362" font-family="sans-serif" font-size="23" fill="#c0caf5">Check MainPID; daemon moves to a separate leaf.</text>
<text x="1069" y="395" font-family="sans-serif" font-size="23" fill="#c0caf5">Wrapper joins session cgroup, then execs agent.</text>
<rect x="1045" y="525" width="870" height="175" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1069" y="567" font-family="sans-serif" font-size="26" fill="#9ece6a">memory.events oom_kill deltas</text>
<text x="1069" y="607" font-family="sans-serif" font-size="23" fill="#c0caf5">Poll while idle; drain before terminal events.</text>
<text x="1069" y="640" font-family="sans-serif" font-size="23" fill="#c0caf5">Buffer a Portal message for the affected session.</text>
<rect x="1045" y="770" width="870" height="175" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1069" y="812" font-family="sans-serif" font-size="26" fill="#9ece6a">Limits and teardown per run</text>
<text x="1069" y="852" font-family="sans-serif" font-size="23" fill="#c0caf5">Optional high_bytes / max_bytes; no default cap.</text>
<text x="1069" y="885" font-family="sans-serif" font-size="23" fill="#c0caf5">cgroup.kill targets only that run; remove wrapper.</text>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#e0af68">Scope: delegated Linux Claude/Codex/Muse only. No default cap or security boundary; userspace oomd kills are not inferred.</text>
</svg>