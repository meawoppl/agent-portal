<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="monospace" font-size="24" fill="#a9b1d6">PR #2514 · Bound reconnect replay and reuse stored message JSON</text>
<text x="55" y="103" font-family="monospace" font-size="34" fill="#e6e9f5">Large reconnect gaps now replace the browser transcript with a bounded window.</text>
<text x="55" y="146" font-family="monospace" font-size="34" fill="#e6e9f5">The replay producer releases its checkout before sending each batch.</text>
<path d="M55 175H1945 M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="monospace" font-size="22" fill="#f7768e">BEFORE</text>
<rect x="55" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">stream_history</text>
<text x="79" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Reconnect cursor can select every row after the watermark.</text>
<path d="M500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">HistoryBatch</text>
<text x="79" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Stored JSON is parsed into a value tree before the send.</text>
<path d="M500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">Replay mailbox</text>
<text x="79" y="939" font-family="monospace" font-size="23" fill="#c0caf5">An open cursor can pin a checkout while the browser drains.</text>
<text x="1055" y="230" font-family="monospace" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="1055" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">stream_history_json</text>
<text x="1079" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Reads the newest configured window plus one overflow sentinel.</text>
<path d="M1500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">HistoryBatch.truncated</text>
<text x="1079" y="669" font-family="monospace" font-size="23" fill="#c0caf5">The first frame replaces the old window in SessionView.</text>
<path d="M1500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">RawHistoryEntry</text>
<text x="1079" y="939" font-family="monospace" font-size="23" fill="#c0caf5">Valid JSON passes through raw. The writer checks current rules.</text>
<text x="55" y="1172" font-family="monospace" font-size="22" fill="#a9b1d6">Legacy browser bundles ignore the optional truncated field. Current bundles reset their transcript on that frame.</text>
</svg>
