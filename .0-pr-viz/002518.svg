<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2518 · Share unchanged message groups between renders</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">A heartbeat or Muse delta still copied and deep-compared every cached group;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">groups are now shared Rcs compared by pointer, and the Muse tree is memoized.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE ==================== -->
  <g>
    <rect x="80" y="240" width="840" height="120" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="282" font-size="26" fill="#7aa2f7">WsEvent::ToolProgress / Ephemeral (true)</text>
    <text x="104" y="322" font-size="23" fill="#a9b1d6">SessionView re-renders; cached groups reused</text>
  </g>
  <line x1="500" y1="360" x2="500" y2="406" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <g>
    <rect x="80" y="410" width="840" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="452" font-size="26" fill="#f7768e">groups.iter().cloned(): every group copied</text>
    <text x="104" y="492" font-size="23" fill="#a9b1d6">group: MessageGroup prop, compared by value</text>
    <text x="104" y="528" font-size="23" fill="#f7768e">each content: String copied and compared</text>
    <text x="104" y="564" font-size="22" fill="#565f89">a regroup made every group a fresh value too</text>
  </g>

  <g>
    <rect x="80" y="660" width="840" height="230" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="702" font-size="26" fill="#7aa2f7">Muse group, on every live delta</text>
    <text x="104" y="742" font-size="23" fill="#f7768e">serde_json::from_str::&lt;Value&gt; on every persisted</text>
    <text x="104" y="778" font-size="23" fill="#f7768e">record, then TaskTree::apply for each</text>
    <text x="104" y="814" font-size="23" fill="#a9b1d6">then apply muse_live_events</text>
    <text x="104" y="856" font-size="22" fill="#565f89">~100 records per turn, many deltas per second</text>
  </g>

  <!-- ==================== AFTER ==================== -->
  <g>
    <rect x="1040" y="240" width="880" height="120" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1064" y="282" font-size="26" fill="#7aa2f7">WsEvent::ToolProgress / Ephemeral (true)</text>
    <text x="1064" y="322" font-size="23" fill="#a9b1d6">SessionView re-renders; cached groups reused</text>
  </g>
  <line x1="1480" y1="360" x2="1480" y2="406" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1040" y="410" width="880" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="452" font-size="26" fill="#9ece6a">group: Rc&lt;MessageGroup&gt;, MessageGroup: Eq</text>
    <text x="1064" y="492" font-size="23" fill="#9ece6a">unchanged group: pointer compare, render skipped</text>
    <text x="1064" y="528" font-size="23" fill="#9ece6a">reuse_unchanged_groups keeps old Rcs by key</text>
    <text x="1064" y="564" font-size="23" fill="#9ece6a">content: Rc&lt;str&gt;, so clones share the body</text>
  </g>

  <g>
    <rect x="1040" y="660" width="880" height="230" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1064" y="702" font-size="26" fill="#7aa2f7">Muse group, on every live delta</text>
    <text x="1064" y="742" font-size="23" fill="#9ece6a">use_memo(props.group): persisted TaskTree built</text>
    <text x="1064" y="778" font-size="23" fill="#9ece6a">once per group change, then cloned</text>
    <text x="1064" y="814" font-size="23" fill="#a9b1d6">then apply muse_live_events</text>
    <text x="1064" y="856" font-size="22" fill="#565f89">only the live overlay is replayed per delta</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Not covered: grouping still reruns over the whole buffer on each new message (incremental grouping stays open).</text>
</svg>
