<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 2124 Antigravity preview agent visual summary</title>
  <desc id="desc">Before and after diagram for the Antigravity preview agent integration.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="62" fill="#a9b1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" letter-spacing="1">PR #2124 - Add Antigravity preview agent</text>
  <text x="55" y="116" fill="#e6e9f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Antigravity was only an SDK sketch; now Portal launches it as</text>
  <text x="55" y="158" fill="#e6e9f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">a read-only, durable turn runner with typed UI and queue gates.</text>
  <line x1="55" y1="178" x2="1945" y2="178" stroke="#3d4666" stroke-width="2"/>

  <text x="55" y="225" fill="#f7768e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1055" y="225" fill="#9ece6a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-width="3" stroke-dasharray="14 16"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="280" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="324" fill="#f7768e" font-size="26" font-weight="700">No AgentType::Antigravity route</text>
    <text x="100" y="365" fill="#c0caf5" font-size="23">launch_dialog, process_manager, probe_all_agents</text>
    <text x="100" y="399" fill="#c0caf5" font-size="23">had no selectable localharness backend.</text>

    <rect x="70" y="480" width="830" height="160" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="524" fill="#f7768e" font-size="26" font-weight="700">Generic stop risked losing durable history</text>
    <text x="100" y="565" fill="#c0caf5" font-size="23">Session::stop could abort IO before an agent-specific</text>
    <text x="100" y="599" fill="#c0caf5" font-size="23">shutdown path confirmed the final turn was flushed.</text>

    <rect x="70" y="690" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="734" fill="#f7768e" font-size="26" font-weight="700">Antigravity events had no native renderer</text>
    <text x="100" y="775" fill="#c0caf5" font-size="23">step updates, trajectory state, and terminal frames</text>
    <text x="100" y="809" fill="#c0caf5" font-size="23">would appear as generic JSON instead of transcript UI.</text>

    <rect x="70" y="890" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="934" fill="#f7768e" font-size="26" font-weight="700">No probe or queue terminal signal</text>
    <text x="100" y="975" fill="#c0caf5" font-size="23">doctor could not see localharness credentials, and</text>
    <text x="100" y="1009" fill="#c0caf5" font-size="23">work-queue drains lacked antigravity_turn_completed.</text>

    <rect x="1100" y="270" width="780" height="165" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="314" fill="#9ece6a" font-size="26" font-weight="700">Selectable preview agent</text>
    <text x="1130" y="355" fill="#c0caf5" font-size="23">shared::AgentType::Antigravity flows into</text>
    <text x="1130" y="389" fill="#c0caf5" font-size="23">AnySession::Antigravity(Session&lt;AntigravityAgent&gt;).</text>

    <rect x="1100" y="485" width="780" height="185" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="529" fill="#9ece6a" font-size="26" font-weight="700">Per-turn durable lifecycle</text>
    <text x="1130" y="570" fill="#c0caf5" font-size="23">antigravity_io_task launches RawClient per accepted turn,</text>
    <text x="1130" y="604" fill="#c0caf5" font-size="23">waits for terminal events, then calls RawClient::shutdown().</text>
    <text x="1130" y="638" fill="#e0af68" font-size="23">Mid-turn inputs stay queued until the turn ends.</text>

    <rect x="1100" y="720" width="780" height="170" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="764" fill="#9ece6a" font-size="26" font-weight="700">Read-only permission boundary</text>
    <text x="1130" y="805" fill="#c0caf5" font-size="23">PolicyDecisionRequest -> DENY; ToolCall -> error;</text>
    <text x="1130" y="839" fill="#c0caf5" font-size="23">workspace_containment is Enabled in HarnessOptions.</text>

    <rect x="1100" y="940" width="780" height="150" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="984" fill="#9ece6a" font-size="26" font-weight="700">Typed rendering and operational probes</text>
    <text x="1130" y="1025" fill="#c0caf5" font-size="23">AgentFrame::Antigravity renders events; probe_antigravity()</text>
    <text x="1130" y="1059" fill="#c0caf5" font-size="23">checks localharness plus GEMINI_API_KEY or Vertex ADC.</text>
  </g>

  <g stroke="#7aa2f7" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1505 435 L1505 485"/>
    <path d="M1494 472 L1505 485 L1516 472"/>
    <path d="M1505 670 L1505 720"/>
    <path d="M1494 707 L1505 720 L1516 707"/>
    <path d="M1505 890 L1505 940"/>
    <path d="M1494 927 L1505 940 L1516 927"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#7dcfff">
    <text x="1412" y="463" font-size="22">launch -> turn</text>
    <text x="1385" y="700" font-size="22">terminal -> next input</text>
    <text x="1380" y="920" font-size="22">frames -> queue release</text>
  </g>

  <text x="55" y="1174" fill="#a9b1d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Scope caveat: Antigravity remains a read-only preview; fork and interactive login are intentionally not enabled.</text>
</svg>
