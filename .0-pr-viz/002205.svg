<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" fill="#a9b1d6" font-family="sans-serif" font-size="24">PR #2205 · Define shared contracts for linked portal clients</text>
<text x="55" y="106" fill="#e6e9f5" font-family="sans-serif" font-size="34">Linked clients lacked a shared wire contract; explicit scopes and grant types</text>
<text x="55" y="148" fill="#e6e9f5" font-family="sans-serif" font-size="34">now define the boundary before either side enables enrollment.</text>
<path d="M55 177 H1945 M1000 190 V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="65" y="230" fill="#f7768e" font-family="sans-serif" font-size="24">BEFORE</text>
<text x="1065" y="230" fill="#9ece6a" font-family="sans-serif" font-size="24">AFTER</text>
<rect x="65" y="270" width="850" height="205" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
<text x="91" y="314" fill="#7aa2f7" font-family="sans-serif" font-size="27">DeviceClientType</text>
<text x="91" y="358" fill="#c0caf5" font-family="sans-serif" font-size="25">Cli / Mobile describe existing device flows.</text>
<text x="91" y="393" fill="#c0caf5" font-family="sans-serif" font-size="25">No linked-client scope or policy contract.</text>
<rect x="1065" y="270" width="850" height="205" rx="12" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1091" y="314" fill="#7aa2f7" font-family="sans-serif" font-size="27">TokenScope + FederationPolicy</text>
<text x="1091" y="358" fill="#c0caf5" font-family="sans-serif" font-size="25">Required read / write; write includes read.</text>
<text x="1091" y="393" fill="#c0caf5" font-family="sans-serif" font-size="25">Default policy: off. Explicit max_scope.</text>
<rect x="65" y="525" width="850" height="205" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
<text x="91" y="569" fill="#7aa2f7" font-family="sans-serif" font-size="27">DevicePollResponse</text>
<text x="91" y="613" fill="#c0caf5" font-family="sans-serif" font-size="25">Legacy completion has token + user fields.</text>
<text x="91" y="648" fill="#c0caf5" font-family="sans-serif" font-size="25">No linked grant or issuing instance binding.</text>
<rect x="1065" y="525" width="850" height="205" rx="12" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1091" y="569" fill="#7aa2f7" font-family="sans-serif" font-size="27">LinkedClientPollResponse</text>
<text x="1091" y="613" fill="#c0caf5" font-family="sans-serif" font-size="25">Completion includes issuer, account and grant.</text>
<text x="1091" y="648" fill="#c0caf5" font-family="sans-serif" font-size="25">Unknown denial reasons remain denied.</text>
<text x="1091" y="683" fill="#c0caf5" font-family="sans-serif" font-size="25">Rotation stays inside the same grant.</text>
<rect x="65" y="780" width="850" height="205" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
<text x="91" y="824" fill="#7aa2f7" font-family="sans-serif" font-size="27">shared::api</text>
<text x="91" y="868" fill="#c0caf5" font-family="sans-serif" font-size="25">No shared ticket/discovery types.</text>
<text x="91" y="903" fill="#c0caf5" font-family="sans-serif" font-size="25">Client and server need an agreed contract.</text>
<rect x="1065" y="780" width="850" height="205" rx="12" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1091" y="824" fill="#7aa2f7" font-family="sans-serif" font-size="27">WsTicketResponse + discovery</text>
<text x="1091" y="868" fill="#c0caf5" font-family="sans-serif" font-size="25">Opaque ticket; expiry on the wire.</text>
<text x="1091" y="903" fill="#c0caf5" font-family="sans-serif" font-size="25">Unknown capability names remain parseable.</text>
<text x="1091" y="938" fill="#c0caf5" font-family="sans-serif" font-size="25">Native contract tests + WASM check.</text>
<text x="55" y="1172" fill="#a9b1d6" font-family="sans-serif" font-size="22">Scope: shared types only. No new routes, credential issuance, policy enforcement or enabled federation.</text>
</svg>