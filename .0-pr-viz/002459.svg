<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2459 · Remove marketing media from the embedded application</text>
<text x="55" y="105" font-family="sans-serif" font-size="34" fill="#e6e9f5">Portal no longer embeds exhibit media; legacy links reach the independently hosted exhibit.</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">Measured optimized frontend distribution: 35.3 MB becomes 7.2 MB, with zero exhibit media.</text>
<path d="M55 175 H1945 M1000 190 V1140" stroke="#565f89" stroke-dasharray="6 6"/>
<text x="55" y="225" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="225" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="270" width="880" height="205" rx="14" fill="#1e202e" stroke="#7aa2f7"/>
<text x="80" y="312" font-family="sans-serif" font-size="28" fill="#7aa2f7">Normal Trunk build</text>
<text x="80" y="355" font-family="sans-serif" font-size="24" fill="#c0caf5">Copies aperture-assets and aperture-demo</text>
<text x="80" y="390" font-family="sans-serif" font-size="24" fill="#c0caf5">169 files, 35,312,255 bytes total</text>
<rect x="55" y="535" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="577" font-family="sans-serif" font-size="28" fill="#f7768e">Backend embedding</text>
<text x="80" y="620" font-family="sans-serif" font-size="24" fill="#c0caf5">Includes narration, soundtrack and evidence</text>
<text x="80" y="655" font-family="sans-serif" font-size="24" fill="#c0caf5">27,961,496 bytes of exhibit media input</text>
<rect x="55" y="800" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="842" font-family="sans-serif" font-size="28" fill="#f7768e">Public links</text>
<text x="80" y="885" font-family="sans-serif" font-size="24" fill="#c0caf5">/aperture and media paths served in Portal</text>
<text x="80" y="920" font-family="sans-serif" font-size="24" fill="#c0caf5">Exhibit changes rebuild the main frontend</text>
<rect x="1055" y="270" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="312" font-family="sans-serif" font-size="28" fill="#9ece6a">Independent exhibit build</text>
<text x="1080" y="355" font-family="sans-serif" font-size="24" fill="#c0caf5">Pages serves the complete authored exhibit</text>
<text x="1080" y="390" font-family="sans-serif" font-size="24" fill="#c0caf5">Source, licenses and evidence stay in repository</text>
<rect x="1055" y="535" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="577" font-family="sans-serif" font-size="28" fill="#9ece6a">Normal Portal build</text>
<text x="1080" y="620" font-family="sans-serif" font-size="24" fill="#c0caf5">63 files, 7,217,492 bytes in measured build</text>
<text x="1080" y="655" font-family="sans-serif" font-size="24" fill="#c0caf5">Backend guard rejects reintroduced media</text>
<text x="1080" y="690" font-family="sans-serif" font-size="24" fill="#c0caf5">Authored exhibit code moves to its own crate</text>
<rect x="1055" y="800" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="842" font-family="sans-serif" font-size="28" fill="#9ece6a">Legacy links preserved</text>
<text x="1080" y="885" font-family="sans-serif" font-size="24" fill="#c0caf5">Server redirects old paths to Pages</text>
<text x="1080" y="920" font-family="sans-serif" font-size="24" fill="#c0caf5">SPA navigation preserves observer hashes</text>
<text x="1080" y="955" font-family="sans-serif" font-size="24" fill="#c0caf5">Sandboxed demo remains script-only</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: size reduction is measured; differing cache states prevent attributing local build-time changes to media alone.</text>
</svg>