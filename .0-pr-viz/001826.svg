<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1826 · Bundle web-client handler context</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Three handlers took 8–11 args each — the same six context values re-declared per signature;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now one Copy WebClientCtx crosses each call, and all three argument allows come off.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="250" width="860" height="170" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="292" font-size="26" fill="#7aa2f7">socket loop owns the context</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">app_state, manager, pool, tx, user, replay limit…</text>
    <text x="104" y="364" font-size="22" fill="#565f89">plus three &amp;mut states: key, verified, uploads</text>
  </g>
  <line x1="510" y1="420" x2="510" y2="490" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="526" y="462" font-size="22" fill="#565f89">10 / 11 / 8 args</text>
  <g>
    <rect x="80" y="495" width="860" height="170" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="537" font-size="26" fill="#7aa2f7">message → register → input, flat</text>
    <text x="104" y="575" font-size="23" fill="#a9b1d6">three #[allow(clippy::too_many_arguments)] in one file</text>
    <text x="104" y="609" font-size="22" fill="#565f89">web_client_socket.rs — every new param needs a fourth</text>
  </g>
  <line x1="510" y1="665" x2="510" y2="940" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">arity grows with every feature</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">call sites re-list context the loop already holds</text>
  </g>

  <g>
    <rect x="1065" y="250" width="860" height="170" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="292" font-size="26" fill="#7aa2f7">socket loop builds WebClientCtx once</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">six shared borrows/values; Copy, so arms pass it on</text>
    <text x="1089" y="364" font-size="22" fill="#565f89">&amp;mut states stay separate — borrows, not context</text>
  </g>
  <line x1="1495" y1="420" x2="1495" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1511" y="462" font-size="22" fill="#565f89">5 / 6 / 7 args</text>
  <g>
    <rect x="1065" y="495" width="860" height="170" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="537" font-size="26" fill="#9ece6a">destructure at top, bodies untouched</text>
    <text x="1089" y="575" font-size="23" fill="#a9b1d6">same local names — only the three call sites change</text>
    <text x="1089" y="609" font-size="22" fill="#565f89">same recipe as #1052 WsReaderChannels</text>
  </g>
  <line x1="1495" y1="665" x2="1495" y2="940" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">context has one home now</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">318 backend lib tests pass; clippy clean</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Dispatch, gating, replay, and upload semantics untouched — signatures only.</text>
</svg>
