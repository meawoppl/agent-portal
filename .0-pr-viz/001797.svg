<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" font-family="'Segoe UI','Noto Sans','DejaVu Sans',ui-sans-serif,system-ui,sans-serif">
<rect width="2000" height="1200" fill="#16161e"/>
<text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1797 · render Muse edit output as colored diffs</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">tool.edit_file output becomes a DiffCard instead of unstructured text.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666"/><text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text><text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text><line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>
<rect x="80" y="270" width="840" height="390" fill="#1e202e" stroke="#f7768e" stroke-width="2"/><text x="108" y="320" font-size="26" fill="#c0caf5">ExpandableText</text><text x="108" y="375" font-size="23" fill="#a9b1d6">completed</text><text x="108" y="420" font-size="23" fill="#a9b1d6">tool.edit_file</text><text x="108" y="485" font-size="23" fill="#f7768e">- old and + new have one color</text><text x="108" y="530" font-size="23" fill="#f7768e">file context is visually buried</text>
<rect x="1065" y="270" width="860" height="390" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/><text x="1093" y="320" font-size="26" fill="#7aa2f7">parse_edit_diff → DiffCard</text><text x="1093" y="375" font-size="23" fill="#565f89">frontend/src/components/muse_renderer.rs</text><text x="1093" y="455" font-size="23" fill="#f7768e">- old</text><text x="1093" y="505" font-size="23" fill="#9ece6a">+ new</text><text x="1093" y="570" font-size="23" fill="#9ece6a">tool.edit_file identity is recognized</text>
<rect x="80" y="760" width="1845" height="190" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/><text x="108" y="815" font-size="26" fill="#7aa2f7">is_hidden_scaffolding</text><text x="108" y="865" font-size="23" fill="#a9b1d6">routine reminder.child_run policy-only nodes remain hidden;</text><text x="108" y="910" font-size="23" fill="#9ece6a">tool results and meaningful output remain visible.</text>
<text x="55" y="1172" font-size="22" fill="#565f89">Scope: Muse rendering only; edits require explicit edit tool identity.</text>
</svg>
