<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" font-family="'Segoe UI','Noto Sans','DejaVu Sans',ui-sans-serif,system-ui,sans-serif">
<rect width="2000" height="1200" fill="#16161e"/>
<text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1777 · separate stop from close</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">Stopping persists desired state; closing archives and deletes through one path.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666"/><text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text><text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text><line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>
<rect x="80" y="270" width="840" height="270" fill="#1e202e" stroke="#f7768e" stroke-width="2"/><text x="108" y="320" font-size="26" fill="#c0caf5">Close paths diverge</text><text x="108" y="370" font-size="23" fill="#a9b1d6">owner endpoint archives and stops</text><text x="108" y="415" font-size="23" fill="#f7768e">admin endpoint deletes rows directly</text><text x="108" y="460" font-size="23" fill="#f7768e">launcher process can outlive its session</text>
<rect x="80" y="620" width="840" height="250" fill="#1e202e" stroke="#f7768e" stroke-width="2"/><text x="108" y="675" font-size="26" fill="#c0caf5">Stop and desired state can drift</text><text x="108" y="725" font-size="23" fill="#a9b1d6">offline processes obscure the durable result</text><text x="108" y="770" font-size="23" fill="#f7768e">an unpaused row is eligible for relaunch</text>
<rect x="1065" y="270" width="860" height="270" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/><text x="1093" y="320" font-size="26" fill="#7aa2f7">close_session</text><text x="1093" y="370" font-size="23" fill="#a9b1d6">archive, disconnect, stop launcher, delete rows</text><text x="1093" y="415" font-size="23" fill="#9ece6a">owner and admin endpoints share the sequence</text><text x="1093" y="460" font-size="23" fill="#565f89">archive failure aborts deletion</text>
<rect x="1065" y="620" width="860" height="250" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/><text x="1093" y="675" font-size="26" fill="#7aa2f7">load_desired_sessions</text><text x="1093" y="725" font-size="23" fill="#a9b1d6">paused sessions are excluded centrally</text><text x="1093" y="770" font-size="23" fill="#9ece6a">regression test proves stop prevents relaunch</text>
<text x="55" y="1172" font-size="22" fill="#565f89">Scope: lifecycle routing only; persist-paused-first stop behavior remains unchanged.</text>
</svg>
