<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
<rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>
<text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2170 · Route classify_fatal via shared helper</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">classify_fatal hand-lowered the rejection text, then sniffed it three times;</text>
<text x="55" y="140" font-size="34" fill="#e6e9f5">all three sniffs now route through the shared case-insensitive helper.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>
<text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
<text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
<line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>
<rect x="80" y="240" width="860" height="250" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="104" y="282" font-size="26" fill="#7aa2f7">classify_fatal: fatal-rejection sniff</text>
<text x="104" y="324" font-size="23" fill="#a9b1d6">let msg = error_msg.to_ascii_lowercase();</text>
<text x="104" y="362" font-size="23" fill="#f7768e">msg.contains("auth" | "token") -&gt; AuthFailed</text>
<text x="104" y="400" font-size="23" fill="#f7768e">msg.contains("already have") -&gt; TooManyLaunchers</text>
<text x="104" y="438" font-size="22" fill="#565f89">else -&gt; DuplicateLauncher; old backends only</text>
<rect x="1065" y="240" width="860" height="250" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="1089" y="282" font-size="26" fill="#7aa2f7">shared::strings::contains_case_insensitive</text>
<text x="1089" y="324" font-size="23" fill="#9ece6a">all three arms route through the helper</text>
<text x="1089" y="362" font-size="23" fill="#9ece6a">single home for the lowercase + contains shape</text>
<text x="1089" y="400" font-size="23" fill="#9ece6a">documented for error-classification sites</text>
<text x="1089" y="438" font-size="22" fill="#565f89">launcher/src/connection.rs; shared dep already there</text>
<rect x="80" y="520" width="860" height="250" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="104" y="562" font-size="26" fill="#7aa2f7">one-off lowering, three raw contains</text>
<text x="104" y="604" font-size="23" fill="#a9b1d6">hand-spelled predicate at one call site</text>
<text x="104" y="642" font-size="23" fill="#f7768e">drift risk: one arm could lower a single side</text>
<text x="104" y="680" font-size="22" fill="#565f89">helper docs name this exact shape - unused here</text>
<rect x="1065" y="520" width="860" height="250" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="1089" y="562" font-size="26" fill="#7aa2f7">identical predicate, no behavior change</text>
<text x="1089" y="604" font-size="23" fill="#9ece6a">needles already lowercase ASCII: "auth", ...</text>
<text x="1089" y="642" font-size="23" fill="#9ece6a">helper lowers both sides - same matches</text>
<text x="1089" y="680" font-size="22" fill="#565f89">100 launcher tests green</text>
<rect x="80" y="800" width="860" height="230" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="104" y="842" font-size="26" fill="#7aa2f7">tests: mixed-case auth only</text>
<text x="104" y="884" font-size="23" fill="#a9b1d6">"Authentication failed" pins the auth arm</text>
<text x="104" y="922" font-size="23" fill="#f7768e">"already have" arm has no case pin</text>
<rect x="1065" y="800" width="860" height="230" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
<text x="1089" y="842" font-size="26" fill="#7aa2f7">new pin + a neighbor that stays</text>
<text x="1089" y="884" font-size="23" fill="#9ece6a">"YOU ALREADY HAVE ..." -&gt; TooManyLaunchers</text>
<text x="1089" y="922" font-size="23" fill="#a9b1d6">list_directory keeps to_lowercase + starts_with</text>
<text x="1089" y="960" font-size="22" fill="#565f89">prefix match, not substring: helper does not apply</text>
<text x="55" y="1172" font-size="22" fill="#565f89">Follow-up to #2152 (overload matcher); last to_ascii_lowercase + contains site in launcher.</text>
</svg>
