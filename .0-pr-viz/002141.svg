<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2141 - Fix image lightbox zoom and add pinch</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">The lightbox style string was dropped by the browser, so nothing moved;</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">gesture math now lives in one tested module with two-finger pinch.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">ImageLightboxView::transform</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Returned translate(..) scale(..) with no property</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">name, an invalid style the browser dropped.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">LightboxView::style</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Returns transform: translate(..) scale(..); the</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">lightbox_gesture module tests the exact string.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Wheel zoom</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">on_lightbox_wheel applied a fixed 18% step per</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">event, so a trackpad pinch would zoom jumpily.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">LightboxGesture::wheel</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">Zoom scales with delta_y (ctrl+wheel gets more</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">gain) and keeps the point under the cursor fixed.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">Touch</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">touch-action none disabled browser pinch while</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">ImageLightboxDrag tracked a single pointer only.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">Two-finger pinch and pan</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">pointer_down and pointer_move track two pointers;</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">the midpoint stays fixed; one finger lifts to drag.</text>
</g>
</svg>
