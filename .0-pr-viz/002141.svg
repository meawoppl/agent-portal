<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2141 - Fix image lightbox wheel zoom and drag pan</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">The lightbox tracked zoom state but its style string was a bare value,</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">so the browser dropped it and the image never moved.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">ImageLightboxView::transform</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Returned translate(..) scale(..) with no property</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">name, an invalid style declaration.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">ImageLightboxView::style</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Returns transform: translate(..) scale(..), a</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">full declaration; test pins the exact string.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Wheel over the open lightbox</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">on_lightbox_wheel updated scale to 1.643, but the</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">img element showed no change on screen.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">Zoom toward the pointer</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">Three notches grew the image 480 to 789 px wide;</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">the point under the cursor stayed fixed.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">Drag to pan</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Pointer drag moved x and y in state, but the</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">same dropped style kept the image still.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">Drag to pan</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">on_lightbox_pointer_move now moves the image</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">through the same valid style attribute.</text>
</g>
</svg>
