<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>
  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2038 · Expose live forward tunnel diagnostics</text>
  <text x="55" y="100" font-size="34" fill="#e6e9f5">at-capacity exposed only a 503; now the live registry identifies stream ownership,</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">so genuine load and proxy cleanup divergence produce different diagnoses.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="270" width="840" height="170" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="110" y="315" font-size="26" fill="#7aa2f7">TunnelStreamMap</text>
    <text x="110" y="355" font-size="23" fill="#a9b1d6">BackendStreamEntry existed only for relay routing</text>
    <text x="110" y="395" font-size="22" fill="#565f89">No owner-visible snapshot or capacity total</text>
  </g>
  <line x1="500" y1="440" x2="500" y2="545" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <g>
    <rect x="80" y="570" width="840" height="190" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="110" y="620" font-size="26" fill="#c0caf5">ForwardError::AtCapacity</text>
    <text x="110" y="665" font-size="23" fill="#f7768e">"Too many connections" with no inventory</text>
    <text x="110" y="710" font-size="22" fill="#565f89">Legitimate load and leaked cleanup looked identical</text>
  </g>
  <g>
    <rect x="80" y="910" width="840" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="110" y="960" font-size="26" fill="#c0caf5">Operator response</text>
    <text x="110" y="1005" font-size="23" fill="#f7768e">Guess, reload, or restart without evidence</text>
  </g>

  <g>
    <rect x="1080" y="270" width="840" height="170" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1110" y="315" font-size="26" fill="#7aa2f7">SessionManager::forward_connections</text>
    <text x="1110" y="355" font-size="23" fill="#a9b1d6">stream_id · port · opened_at · transport</text>
    <text x="1110" y="395" font-size="22" fill="#9ece6a">Scoped by session_key and optional port</text>
  </g>
  <line x1="1500" y1="440" x2="1500" y2="535" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1080" y="560" width="840" height="225" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1110" y="610" font-size="26" fill="#7aa2f7">ForwardConnectionInfo</text>
    <text x="1110" y="655" font-size="23" fill="#c0caf5">Settings -> Forwarding: expandable per-session list</text>
    <text x="1110" y="700" font-size="23" fill="#c0caf5">agent-portal forward connections</text>
    <text x="1110" y="745" font-size="22" fill="#9ece6a">count / FORWARD_STREAM_LIMIT (512)</text>
  </g>
  <line x1="1500" y1="785" x2="1500" y2="875" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <g>
    <rect x="1080" y="900" width="840" height="160" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1110" y="950" font-size="26" fill="#c0caf5">Capacity diagnosis</text>
    <text x="1110" y="995" font-size="23" fill="#9ece6a">Low backend count + at-capacity = registry divergence</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Scope: pooled HTTP paths are not attributed per stream; the inventory identifies session, port, transport, age, and UUID.</text>
</svg>
