<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2289 · Keep managed plugin services through transient forward gaps</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">One 404 or empty forward list during a backend restart deleted the</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">service's restart recipe; now only a sustained absence counts as a close.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">backend member_session</text>
  <text x="79" y="325" font-size="23" fill="#f7768e">.map_err(|_| NotFound("session"))</text>
  <text x="79" y="360" font-size="23" fill="#a9b1d6">a DB hiccup reads as "session gone": 404</text>
  <line x1="505" y1="395" x2="505" y2="440" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">supervisor poll (every 5 s)</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">first 404/410 or missing port: remove_at + return</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">status left ready: true</text>
  <line x1="505" y1="595" x2="505" y2="640" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Result</text>
  <text x="79" y="725" font-size="23" fill="#f7768e">recipe gone, relay and child gone</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">forward still registered: "no-listener"</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">backend member_session</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">.optional()? then NotFound only for no row</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">DB errors are 500: "unknown" to the launcher</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">forward_missing + Absence</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">close = 3 consecutive misses spanning 90 s</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">seen again resets; unknown counts for neither</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">Confirmed close only</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">log reason, status, generation, ports</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">status ready: false, then remove the recipe</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Unchanged: a real close or replacement still stops the service and is never re-registered.</text>
</svg>
