<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="58" fill="#565f89" font-family="Arial, sans-serif" font-size="24">PR #2028 · pool forwarded upstream connections</text>
  <text x="55" y="112" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">Reuse tunnel streams instead of spending one per request</text>
  <line x1="55" y1="160" x2="1945" y2="160" stroke="#565f89" stroke-width="2"/>
  <line x1="1000" y1="195" x2="1000" y2="1115" stroke="#565f89" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="75" y="225" fill="#f7768e" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">BEFORE · ONE STREAM PER REQUEST</text>
  <rect x="75" y="265" width="830" height="360" rx="18" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="110" y="320" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">forward_proxy::proxy_request</text>
  <text x="110" y="375" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">Every asset, API call, and poll opened:</text>
  <rect x="125" y="415" width="720" height="78" rx="10" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
  <text x="155" y="463" fill="#e6e9f5" font-family="Arial, sans-serif" font-size="22">TunnelOpen + http1::handshake</text>
  <text x="110" y="545" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">Completed page bursts left connection churn.</text>
  <text x="110" y="585" fill="#c0caf5" font-family="Arial, sans-serif" font-size="21">Enough fan-out reached MAX_STREAMS = 512.</text>

  <rect x="75" y="685" width="830" height="330" rx="18" fill="#1e202e" stroke="#e0af68" stroke-width="3"/>
  <text x="110" y="740" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Failure at the browser</text>
  <text x="110" y="800" fill="#e0af68" font-family="Arial, sans-serif" font-size="24">Too many connections</text>
  <text x="110" y="845" fill="#c0caf5" font-family="Arial, sans-serif" font-size="22">TunnelRefuseReason::StreamLimit</text>
  <text x="110" y="890" fill="#c0caf5" font-family="Arial, sans-serif" font-size="22">became ForwardError::AtCapacity.</text>
  <text x="110" y="955" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Reloading merely raced streams as they closed.</text>

  <text x="1075" y="225" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">AFTER · GENERATION-SCOPED POOL</text>
  <rect x="1095" y="265" width="830" height="360" rx="18" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1130" y="320" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">ForwardHttpClient</text>
  <text x="1130" y="375" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">hyper_util::client::legacy::Client</text>
  <rect x="1130" y="415" width="760" height="78" rx="10" fill="#16161e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1160" y="463" fill="#e6e9f5" font-family="Arial, sans-serif" font-size="21">session + generation + port pool key</text>
  <text x="1130" y="545" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">Sequential requests reuse one TunnelOpen.</text>
  <text x="1130" y="585" fill="#c0caf5" font-family="Arial, sans-serif" font-size="21">Reconnects cannot check out stale streams.</text>

  <rect x="1095" y="685" width="830" height="330" rx="18" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="1130" y="740" fill="#c0caf5" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Bounded and compatible</text>
  <text x="1130" y="800" fill="#7dcfff" font-family="Arial, sans-serif" font-size="22">8 idle connections per forward</text>
  <text x="1130" y="845" fill="#7dcfff" font-family="Arial, sans-serif" font-size="22">30 second idle timeout</text>
  <text x="1130" y="890" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22">Typed refusals survive the error chain.</text>
  <text x="1130" y="935" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22">101 upgrades keep bidirectional bytes.</text>
  <text x="1130" y="980" fill="#565f89" font-family="Arial, sans-serif" font-size="19">Three focused regressions plus 340 backend tests.</text>

  <rect x="1095" y="1050" width="830" height="76" rx="14" fill="#1e202e" stroke="#bb9af7" stroke-width="3"/>
  <text x="1130" y="1097" fill="#bb9af7" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Closes #1468 · no wire-format change</text>
  <text x="55" y="1170" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Pool authorities are synthetic and never reach the forwarded application Host header.</text>
</svg>
