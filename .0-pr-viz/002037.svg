  <text x="53" y="70" font-family="sans-serif" font-size="24" letter-spacing="1" fill="#565f89">PR #2037 - Dedupe portal-auth ws_to_http via shared helper</text>
  <text x="53" y="120" font-family="sans-serif" font-size="28" fill="#c0caf5">Device-flow base URL now uses the shared leading-scheme helper.</text>
  <line x1="53" y1="160" x2="1947" y2="160" stroke="#565f89" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="8 8"/>
  <text x="53" y="225" font-family="sans-serif" font-size="20" letter-spacing="2.5" fill="#f7768e">BEFORE</text>
  <text x="1040" y="225" font-family="sans-serif" font-size="20" letter-spacing="2.5" fill="#9ece6a">AFTER</text>
  <rect x="70" y="280" width="850" height="160" fill="none" stroke="#f7768e" stroke-width="2"/>
  <text x="495" y="348" text-anchor="middle" font-family="monospace" font-size="22" fill="#c0caf5">portal-auth::ws_to_http()</text>
  <text x="495" y="388" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#565f89">local copy, whole-string replace</text>
