  <text x="495" y="558" text-anchor="middle" font-family="monospace" font-size="20" fill="#c0caf5">wss://a.example/?next=ws://b.example/</text>
  <text x="495" y="598" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#565f89">input base URL with embedded URL</text>
  <rect x="70" y="720" width="850" height="160" fill="none" stroke="#f7768e" stroke-width="2"/>
  <text x="495" y="778" text-anchor="middle" font-family="monospace" font-size="20" fill="#f7768e">https://a.example/?next=http://b.example/</text>
  <text x="495" y="818" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#565f89">embedded URL rewritten, wrong</text>
  <rect x="70" y="940" width="850" height="160" fill="none" stroke="#f7768e" stroke-width="2"/>
  <text x="495" y="1008" text-anchor="middle" font-family="monospace" font-size="22" fill="#c0caf5">device_flow_login()</text>
  <text x="495" y="1048" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#565f89">calls the local copy for auth_base</text>
  <rect x="1080" y="280" width="850" height="160" fill="none" stroke="#9ece6a" stroke-width="2"/>
  <text x="1505" y="348" text-anchor="middle" font-family="monospace" font-size="22" fill="#c0caf5">shared::urls::ws_to_http()</text>
  <text x="1505" y="388" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#565f89">one leading-scheme swap, all crates</text>
  <rect x="1080" y="500" width="850" height="160" fill="none" stroke="#9ece6a" stroke-width="2"/>
  <text x="1505" y="558" text-anchor="middle" font-family="monospace" font-size="20" fill="#c0caf5">wss://a.example/?next=ws://b.example/</text>
  <text x="1505" y="598" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#565f89">same input URL</text>
  <rect x="1080" y="720" width="850" height="160" fill="none" stroke="#9ece6a" stroke-width="2"/>
  <text x="1505" y="778" text-anchor="middle" font-family="monospace" font-size="20" fill="#9ece6a">https://a.example/?next=ws://b.example/</text>
  <text x="1505" y="818" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#565f89">embedded URL preserved, correct</text>
  <rect x="1080" y="940" width="850" height="160" fill="none" stroke="#7aa2f7" stroke-width="2"/>
  <text x="1505" y="1008" text-anchor="middle" font-family="monospace" font-size="22" fill="#c0caf5">device_flow_login()</text>
  <text x="1505" y="1048" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#565f89">calls shared helper, launcher already does</text>
  <text x="53" y="1175" font-family="sans-serif" font-size="20" fill="#565f89">portal-auth/src/lib.rs: -7/+1 lines</text>
  <text x="1040" y="1175" font-family="sans-serif" font-size="20" fill="#565f89">fmt + clippy clean, shared tests pass</text>
