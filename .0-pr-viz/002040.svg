<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2040 · Frontend get_ws_url joins the shared scheme helper</text>

  <!-- Thesis -->
  <text x="55" y="100" font-size="34" fill="#e6e9f5">The frontend hand-rolled the http to ws scheme swap in get_ws_url;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now it calls shared::urls::http_to_ws, so the swap has one definition.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <!-- Panel labels + center divider (keep) -->
  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ==================== BEFORE panel: x 55-945 ==================== -->
  <g>
    <rect x="80" y="250" width="480" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#7aa2f7">browser location</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">protocol + host of the page</text>
    <text x="104" y="366" font-size="22" fill="#565f89">read by get_base_url and get_ws_url</text>
  </g>

  <line x1="320" y1="400" x2="320" y2="490" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="336" y="450" font-size="22" fill="#565f89">protocol, host</text>

  <g>
    <rect x="80" y="495" width="860" height="160" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="535" font-size="26" fill="#f7768e">get_ws_url</text>
    <text x="104" y="575" font-size="23" fill="#a9b1d6">if protocol == "https:" then wss: else ws: - own copy</text>
    <text x="104" y="611" font-size="22" fill="#565f89">frontend/src/utils.rs - never calls the shared helper</text>
  </g>

  <g>
    <rect x="80" y="700" width="860" height="160" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="740" font-size="26" fill="#7aa2f7">shared::urls::http_to_ws</text>
    <text x="104" y="780" font-size="23" fill="#a9b1d6">leading-scheme-only swap, other schemes pass through</text>
    <text x="104" y="816" font-size="22" fill="#565f89">used by portal-auth (#2037) and launcher - not the frontend</text>
  </g>

  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">same swap, 2 definitions</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">copies drift - whole-string replace rewrote query strings</text>
  </g>

  <!-- ==================== AFTER panel: x 1040-1945 ==================== -->
  <g>
    <rect x="1065" y="250" width="480" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="290" font-size="26" fill="#7aa2f7">browser location</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">protocol + host of the page</text>
    <text x="1089" y="366" font-size="22" fill="#565f89">read by get_base_url and get_ws_url</text>
  </g>

  <line x1="1305" y1="400" x2="1305" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="1321" y="450" font-size="22" fill="#565f89">base URL</text>

  <g>
    <rect x="1065" y="495" width="860" height="160" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="535" font-size="26" fill="#9ece6a">get_ws_url</text>
    <text x="1089" y="575" font-size="23" fill="#a9b1d6">http_to_ws(get_base_url()) - delegation, no own logic</text>
    <text x="1089" y="611" font-size="22" fill="#565f89">the if/else on the protocol is gone</text>
  </g>

  <g>
    <rect x="1065" y="700" width="860" height="160" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="740" font-size="26" fill="#7aa2f7">shared::urls::http_to_ws</text>
    <text x="1089" y="780" font-size="23" fill="#a9b1d6">leading-scheme-only swap, other schemes pass through</text>
    <text x="1089" y="816" font-size="22" fill="#565f89">now also serves the frontend, via get_base_url</text>
  </g>

  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">same swap, 1 definition</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">one fix in shared::urls covers every caller</text>
  </g>

  <!-- Footer -->
  <text x="55" y="1172" font-size="22" fill="#565f89">Same URLs for http(s) pages; a non-http page scheme now passes through untouched instead of mapping to ws.</text>
</svg>
