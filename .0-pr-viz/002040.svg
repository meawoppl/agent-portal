<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect x="0" y="0" width="1200" height="720" fill="#1a1b26"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#565f89"/>
    </marker>
  </defs>
  <text x="32" y="36" font-family="sans-serif" font-size="15" letter-spacing="0.6" fill="#565f89">PR #2040 · Frontend get_ws_url joins the shared scheme helper</text>
  <text x="32" y="66" font-family="sans-serif" font-size="19" fill="#c0caf5">One scheme swap instead of two.</text>
  <line x1="32" y1="96" x2="1168" y2="96" stroke="#565f89" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="600" y1="112" x2="600" y2="690" stroke="#565f89" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="6 6"/>
  <text x="32" y="130" font-family="sans-serif" font-size="12" letter-spacing="1.6" fill="#f7768e">BEFORE</text>
  <text x="624" y="130" font-family="sans-serif" font-size="12" letter-spacing="1.6" fill="#9ece6a">AFTER</text>
  <text x="150" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#565f89">source</text>
  <text x="380" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#565f89">swap</text>
  <text x="742" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#565f89">source</text>
  <text x="972" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#565f89">swap</text>
  <rect x="40" y="210" width="220" height="60" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="150" y="245" text-anchor="middle" font-family="monospace" font-size="14" fill="#c0caf5">browser location</text>
  <rect x="40" y="340" width="220" height="60" fill="none" stroke="#565f89" stroke-width="1.5"/>
  <text x="150" y="375" text-anchor="middle" font-family="monospace" font-size="14" fill="#c0caf5">shared::urls</text>
  <line x1="264" y1="240" x2="290" y2="240" stroke="#565f89" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="294" y="210" width="172" height="60" fill="none" stroke="#f7768e" stroke-width="2"/>
  <text x="380" y="235" text-anchor="middle" font-family="monospace" font-size="14" fill="#f7768e">get_ws_url</text>
  <text x="380" y="256" text-anchor="middle" font-family="monospace" font-size="11" fill="#f7768e">hand-rolled if/else</text>
  <rect x="294" y="340" width="172" height="60" fill="none" stroke="#565f89" stroke-width="1.5"/>
  <text x="380" y="365" text-anchor="middle" font-family="monospace" font-size="14" fill="#c0caf5">http_to_ws</text>
  <text x="380" y="386" text-anchor="middle" font-family="monospace" font-size="11" fill="#565f89">portal-auth, launcher</text>
  <line x1="470" y1="240" x2="496" y2="240" stroke="#565f89" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="500" y="210" width="68" height="60" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
  <text x="534" y="245" text-anchor="middle" font-family="monospace" font-size="14" fill="#c0caf5">ws</text>
  <text x="40" y="440" font-family="sans-serif" font-size="12" fill="#f7768e">frontend never calls the shared helper</text>
  <rect x="40" y="470" width="528" height="52" fill="none" stroke="#f7768e" stroke-width="1.5"/>
  <text x="304" y="502" text-anchor="middle" font-family="monospace" font-size="14" fill="#f7768e">same swap, 2 definitions</text>
  <rect x="632" y="210" width="220" height="60" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="742" y="245" text-anchor="middle" font-family="monospace" font-size="14" fill="#c0caf5">browser location</text>
  <line x1="856" y1="240" x2="882" y2="240" stroke="#565f89" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="886" y="210" width="220" height="60" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="996" y="235" text-anchor="middle" font-family="monospace" font-size="14" fill="#c0caf5">get_base_url</text>
  <text x="996" y="256" text-anchor="middle" font-family="monospace" font-size="11" fill="#565f89">then http_to_ws</text>
  <rect x="632" y="340" width="220" height="60" fill="none" stroke="#565f89" stroke-width="1.5"/>
  <text x="742" y="375" text-anchor="middle" font-family="monospace" font-size="14" fill="#c0caf5">shared::urls</text>
  <line x1="856" y1="370" x2="882" y2="370" stroke="#565f89" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="886" y="340" width="220" height="60" fill="none" stroke="#9ece6a" stroke-width="2"/>
  <text x="996" y="365" text-anchor="middle" font-family="monospace" font-size="14" fill="#9ece6a">http_to_ws</text>
  <text x="996" y="386" text-anchor="middle" font-family="monospace" font-size="11" fill="#9ece6a">single definition</text>
  <line x1="996" y1="274" x2="996" y2="336" stroke="#565f89" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="916" y1="432" x2="942" y2="432" stroke="#565f89" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="946" y="402" width="160" height="60" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
  <text x="1026" y="437" text-anchor="middle" font-family="monospace" font-size="14" fill="#c0caf5">ws URL</text>
  <text x="632" y="502" font-family="sans-serif" font-size="12" fill="#9ece6a">get_ws_url = http_to_ws(get_base_url())</text>
  <rect x="632" y="532" width="474" height="52" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="869" y="564" text-anchor="middle" font-family="monospace" font-size="14" fill="#9ece6a">same swap, 1 definition</text>
  <text x="32" y="640" font-family="sans-serif" font-size="11" fill="#565f89">Same URLs as before - the http to ws swap just lives in shared::urls now.</text>
  <text x="32" y="664" font-family="sans-serif" font-size="11" fill="#565f89">Follows #2037, which did the same for portal-auth ws_to_http.</text>
</svg>
