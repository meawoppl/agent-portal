<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2085 - Add agent progress bars via agent-portal progress</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Agents had no way to show job progress; a new CLI command drives a</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">live bar above the input box, held in memory and never persisted.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">agent-portal CLI</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Only show and forward could surface state;</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">no command reports a running job's progress.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">agent-portal progress 3/12 --label X</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Value is 42, 42% or 3/12; --id runs up to 8 bars,</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">--done removes one. Posts to /progress.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Backend</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">No endpoint for agent-driven status; only tool</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">heartbeats reached the browser as live signals.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">SessionManager agent_progress store</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">post_agent_progress broadcasts an AgentProgress</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">snapshot; connect replays it; 10 min TTL sweep.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">Frontend</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Only the upload bar showed a percentage,</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">and only for the user's own file uploads.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">render_agent_progress above input bar</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Reuses upload-bar track and fill styling;</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">no fraction gives an indeterminate slide.</text>
</g>
</svg>
