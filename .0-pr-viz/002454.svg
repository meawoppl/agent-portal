<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2454 · Measure native profile and cache tradeoffs</text>
<text x="55" y="105" font-family="sans-serif" font-size="34" fill="#e6e9f5">Native and WASM share a size-focused release profile; optimize native builds using measured evidence.</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">Opt-in isolated runners compare compiler settings, cache retention, rebuilds and output identity.</text>
<path d="M55 175 H1945 M1000 190 V1140" stroke="#565f89" stroke-dasharray="6 6"/>
<text x="55" y="225" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="225" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="270" width="880" height="205" rx="14" fill="#1e202e" stroke="#7aa2f7"/>
<text x="80" y="312" font-family="sans-serif" font-size="28" fill="#7aa2f7">One release profile</text>
<text x="80" y="355" font-family="sans-serif" font-size="24" fill="#c0caf5">Fat LTO, one codegen unit, opt-level z</text>
<text x="80" y="390" font-family="sans-serif" font-size="24" fill="#c0caf5">No evidence for a native alternative</text>
<rect x="55" y="535" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="577" font-family="sans-serif" font-size="28" fill="#f7768e">Dependency-oriented cache</text>
<text x="80" y="620" font-family="sans-serif" font-size="24" fill="#c0caf5">Workspace and incremental artifacts excluded</text>
<text x="80" y="655" font-family="sans-serif" font-size="24" fill="#c0caf5">Warm restore does not imply a warm app build</text>
<rect x="55" y="800" width="880" height="205" rx="14" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="842" font-family="sans-serif" font-size="28" fill="#f7768e">Build duration alone</text>
<text x="80" y="885" font-family="sans-serif" font-size="24" fill="#c0caf5">No controlled profile comparison</text>
<text x="80" y="920" font-family="sans-serif" font-size="24" fill="#c0caf5">No binary-identity or retained-size comparison</text>
<rect x="1055" y="270" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="312" font-family="sans-serif" font-size="28" fill="#9ece6a">Opt-in benchmark matrix</text>
<text x="1080" y="355" font-family="sans-serif" font-size="24" fill="#c0caf5">Fat/z versus Thin/z, Thin/2 and Thin/3</text>
<text x="1080" y="390" font-family="sans-serif" font-size="24" fill="#c0caf5">Thin/3 incremental isolates retention effects</text>
<rect x="1055" y="535" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="577" font-family="sans-serif" font-size="28" fill="#9ece6a">Quota-safe local archive experiment</text>
<text x="1080" y="620" font-family="sans-serif" font-size="24" fill="#c0caf5">Record target, profile and dependency identity</text>
<text x="1080" y="655" font-family="sans-serif" font-size="24" fill="#c0caf5">Archive/restore; rebuild after a new git commit</text>
<text x="1080" y="690" font-family="sans-serif" font-size="24" fill="#c0caf5">Measure compression, restore time and bytes</text>
<rect x="1055" y="800" width="880" height="205" rx="14" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="842" font-family="sans-serif" font-size="28" fill="#9ece6a">Rebuild and correctness evidence</text>
<text x="1080" y="885" font-family="sans-serif" font-size="24" fill="#c0caf5">Cold/restored, unchanged, backend and dist edits</text>
<text x="1080" y="920" font-family="sans-serif" font-size="24" fill="#c0caf5">Cargo timings, binary size and HTTP identity</text>
<text x="1080" y="955" font-family="sans-serif" font-size="24" fill="#c0caf5">Production profiles stay unchanged until reviewed</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: HTTP is a smoke comparison. Network transfer costs remain unmeasured because shared cache storage is full.</text>
</svg>