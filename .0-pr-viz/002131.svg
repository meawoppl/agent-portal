<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="pr2131-title pr2131-desc">
  <title id="pr2131-title">PR 2131 Route antigravity empty filters via shared helper</title>
  <desc id="pr2131-desc">Before and after: six inline empty-string filters in the antigravity renderer carried their own copy of the check; now all six route through is_non_empty in shared strings.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="pr2131-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7768e"/>
    </marker>
    <marker id="pr2131-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="62" fill="#a9b1d6" font-family="sans-serif" font-size="24" letter-spacing="1">PR #2131 - Route antigravity empty filters via shared helper</text>
  <text x="55" y="116" fill="#e6e9f5" font-family="sans-serif" font-size="34" font-weight="700">Six inline empty-string filters in one renderer;</text>
  <text x="55" y="158" fill="#e6e9f5" font-family="sans-serif" font-size="34" font-weight="700">now all six share is_non_empty from shared strings.</text>
  <line x1="55" y1="178" x2="1945" y2="178" stroke="#3d4666" stroke-width="2"/>

  <text x="55" y="225" fill="#f7768e" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1055" y="225" fill="#9ece6a" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-width="3" stroke-dasharray="14 16"/>

  <g font-family="sans-serif">
    <rect x="70" y="280" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="324" fill="#f7768e" font-size="26" font-weight="700">Same filter in six places</text>
    <text x="100" y="365" fill="#c0caf5" font-size="23" font-family="monospace">.filter(|s| !s.is_empty())</text>
    <text x="100" y="399" fill="#c0caf5" font-size="23">step text, thinking, errors, actions</text>

    <rect x="70" y="480" width="830" height="160" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="524" fill="#f7768e" font-size="26" font-weight="700">Copies can drift apart</text>
    <text x="100" y="565" fill="#c0caf5" font-size="23">one site checks is_empty while another</text>
    <text x="100" y="599" fill="#c0caf5" font-size="23">trims first - nobody notices the split</text>

    <rect x="70" y="690" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="734" fill="#f7768e" font-size="26" font-weight="700">One file, six copies</text>
    <text x="100" y="775" fill="#c0caf5" font-size="23">antigravity renderer only, this time</text>
    <text x="100" y="809" fill="#c0caf5" font-size="23">a fix to one misses the other five</text>

    <rect x="70" y="890" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="934" fill="#f7768e" font-size="26" font-weight="700">Cost of the drift</text>
    <text x="100" y="975" fill="#c0caf5" font-size="23">six copies of one rule in the tree</text>
    <text x="100" y="1009" fill="#c0caf5" font-size="23">empty frames render unevenly one day</text>

    <rect x="1100" y="280" width="780" height="150" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="324" fill="#9ece6a" font-size="26" font-weight="700">One shared helper</text>
    <text x="1130" y="365" fill="#c0caf5" font-size="23" font-family="monospace">shared::strings::is_non_empty</text>
    <text x="1130" y="399" fill="#c0caf5" font-size="23">plus unit tests locking the shape</text>

    <rect x="1100" y="480" width="780" height="160" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="524" fill="#9ece6a" font-size="26" font-weight="700">Same six sites, routed over</text>
    <text x="1130" y="565" fill="#c0caf5" font-size="23">step text, thinking, errors, actions</text>
    <text x="1130" y="599" fill="#c0caf5" font-size="23">six one-line call sites, zero copies</text>

    <rect x="1100" y="690" width="780" height="150" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="734" fill="#9ece6a" font-size="26" font-weight="700">One surface, zero drift</text>
    <text x="1130" y="775" fill="#c0caf5" font-size="23">one home holds the empty check</text>
    <text x="1130" y="809" fill="#c0caf5" font-size="23">filters and tests in one place</text>

    <rect x="1100" y="890" width="780" height="150" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="934" fill="#9ece6a" font-size="26" font-weight="700">Future edits land everywhere</text>
    <text x="1130" y="975" fill="#c0caf5" font-size="23">one rule, one home, tests cover it</text>
    <text x="1130" y="1009" fill="#c0caf5" font-size="23">no second copy left to forget</text>
  </g>

  <g stroke-width="3" fill="none">
    <line x1="485" y1="438" x2="485" y2="472" stroke="#f7768e" marker-end="url(#pr2131-arr-red)"/>
    <line x1="485" y1="648" x2="485" y2="682" stroke="#f7768e" marker-end="url(#pr2131-arr-red)"/>
    <line x1="485" y1="848" x2="485" y2="882" stroke="#f7768e" marker-end="url(#pr2131-arr-red)"/>
    <line x1="1490" y1="438" x2="1490" y2="472" stroke="#9ece6a" marker-end="url(#pr2131-arr-green)"/>
    <line x1="1490" y1="648" x2="1490" y2="682" stroke="#9ece6a" marker-end="url(#pr2131-arr-green)"/>
    <line x1="1490" y1="848" x2="1490" y2="882" stroke="#9ece6a" marker-end="url(#pr2131-arr-green)"/>
  </g>

  <text x="55" y="1174" fill="#a9b1d6" font-family="sans-serif" font-size="22">Scope caveat: byte-identical output at every call site; dedup only, no logic change.</text>
</svg>
