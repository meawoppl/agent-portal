<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" font-family="sans-serif">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-size="24" fill="#565f89">PR 002235 / LINKED PORTAL BROWSER</text>
<text x="55" y="100" font-size="34" fill="#e6e9f5">One browser, several portals.</text>
<text x="55" y="140" font-size="34" fill="#e6e9f5">Every session keeps its owning portal and account.</text>
<line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666"/>
<line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-dasharray="12 14"/>
<text x="105" y="235" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1090" y="235" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="105" y="280" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="325" font-size="26" fill="#f7768e">Separate dashboards</text>
<text x="129" y="368" font-size="23" fill="#a9b1d6">Switch tabs and accounts to find sessions.</text>
<text x="129" y="406" font-size="23" fill="#a9b1d6">Identical session IDs cannot be combined safely.</text>
<line x1="525" y1="460" x2="525" y2="510" stroke="#565f89" stroke-width="3"/>
<rect x="105" y="510" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="555" font-size="26" fill="#f7768e">Home-only transport</text>
<text x="129" y="598" font-size="23" fill="#a9b1d6">Relative requests and cookie authentication</text>
<text x="129" y="636" font-size="23" fill="#a9b1d6">assume every action belongs to this server.</text>
<line x1="525" y1="690" x2="525" y2="740" stroke="#565f89" stroke-width="3"/>
<rect x="105" y="740" width="840" height="180" rx="8" fill="#1e202e" stroke="#f7768e"/>
<text x="129" y="785" font-size="26" fill="#f7768e">No linked client workflow</text>
<text x="129" y="828" font-size="23" fill="#a9b1d6">Server grants exist, but browsers cannot</text>
<text x="129" y="866" font-size="23" fill="#a9b1d6">enroll, revoke or display remote sessions.</text>
<rect x="1055" y="280" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="325" font-size="26" fill="#9ece6a">Explicit connection identity</text>
<text x="1079" y="368" font-size="23" fill="#a9b1d6">Rail, history and metrics are connection-keyed.</text>
<text x="1079" y="406" font-size="23" fill="#a9b1d6">Same UUID on two portals stays two sessions.</text>
<line x1="1475" y1="460" x2="1475" y2="510" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="510" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="555" font-size="26" fill="#9ece6a">Scoped foreign transport</text>
<text x="1079" y="598" font-size="23" fill="#a9b1d6">No cookies or redirects; one-use WS tickets.</text>
<text x="1079" y="636" font-size="23" fill="#a9b1d6">Blob media and stale-home-account protection.</text>
<line x1="1475" y1="690" x2="1475" y2="740" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="740" width="840" height="180" rx="8" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="785" font-size="26" fill="#9ece6a">Consent and lifecycle</text>
<text x="1079" y="828" font-size="23" fill="#a9b1d6">Approve remotely; optional metadata sync.</text>
<text x="1079" y="866" font-size="23" fill="#a9b1d6">Revoke grants and isolate remote failures.</text>
<text x="55" y="1172" font-size="22" fill="#e0af68">Browser checks: two origins, duplicate UUIDs, consent and unlink. Native handoffs remain explicit.</text>
</svg>