<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2435 · One click verifies and approves credential access</text>
<text x="55" y="106" font-family="sans-serif" font-size="34" fill="#e6e9f5">Separate verification required two actions, and background polls could swallow approval clicks.</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">Approve now verifies, submits once, and confirms the result with inline progress.</text>
<path d="M55 175 H1945 M1000 190 V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="70" y="230" font-family="sans-serif" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1070" y="230" font-family="sans-serif" font-size="24" fill="#9ece6a">AFTER</text>
<rect x="70" y="280" width="840" height="185" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="94" y="322" font-family="sans-serif" font-size="28" fill="#f7768e">Verify Portal session, then Approve</text>
<text x="94" y="368" font-family="sans-serif" font-size="24" fill="#c0caf5">Two separate controls for one intended approval.</text>
<text x="94" y="402" font-family="sans-serif" font-size="24" fill="#c0caf5">No progress label while the decision is submitted.</text>
<rect x="70" y="540" width="840" height="185" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="94" y="582" font-family="sans-serif" font-size="28" fill="#f7768e">One busy flag for polls and decisions</text>
<text x="94" y="628" font-family="sans-serif" font-size="24" fill="#c0caf5">A background GET disables the approval button.</text>
<text x="94" y="662" font-family="sans-serif" font-size="24" fill="#c0caf5">A click at that boundary can be ignored.</text>
<rect x="1070" y="280" width="840" height="185" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1094" y="322" font-family="sans-serif" font-size="28" fill="#9ece6a">Approve starts the complete flow</text>
<text x="1094" y="368" font-family="sans-serif" font-size="24" fill="#c0caf5">Verifying -&gt; Approving -&gt; Checking result.</text>
<text x="1094" y="402" font-family="sans-serif" font-size="24" fill="#c0caf5">Failure to verify sends no approval request.</text>
<rect x="1070" y="540" width="840" height="185" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1094" y="582" font-family="sans-serif" font-size="28" fill="#9ece6a">Separate action progress + poll generation</text>
<text x="1094" y="628" font-family="sans-serif" font-size="24" fill="#c0caf5">One click works while a status poll is pending.</text>
<text x="1094" y="662" font-family="sans-serif" font-size="24" fill="#c0caf5">Older poll responses cannot overwrite the result.</text>
<rect x="1070" y="800" width="840" height="185" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1094" y="842" font-family="sans-serif" font-size="28" fill="#9ece6a">Submit once, confirm with GET</text>
<text x="1094" y="888" font-family="sans-serif" font-size="24" fill="#c0caf5">Duplicate clicks are ignored during the operation.</text>
<text x="1094" y="922" font-family="sans-serif" font-size="24" fill="#c0caf5">Unknown outcomes are checked, never auto-replayed.</text>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: transcript credential approvals. Server ownership, CSRF, verification and expiry checks remain enforced.</text>
</svg>
