<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 2008 shared uuid prefix match</title>
  <desc id="desc">The uuid prefix shape lived in two places; now shared owns it once.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="58" fill="#565f89" font-family="Arial, sans-serif" font-size="24" letter-spacing="1">PR #2008 · Share UUID prefix matching via shared helper</text>
  <text x="55" y="112" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">The prefix-match shape lived in two places;</text>
  <text x="55" y="154" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">now shared owns it once.</text>
  <line x1="55" y1="184" x2="1945" y2="184" stroke="#565f89" stroke-width="2"/>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="75" y="235" fill="#f7768e" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">BEFORE</text>
  <rect x="75" y="275" width="830" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="105" y="320" fill="#7aa2f7" font-family="monospace" font-size="26">launcher message.rs</text>
  <text x="105" y="365" fill="#c0caf5" font-family="monospace" font-size="23">normalize + hex check + starts_with</text>
  <text x="105" y="401" fill="#c0caf5" font-family="monospace" font-size="23">trims, lowercases, own errors</text>
  <text x="105" y="437" fill="#565f89" font-family="Arial, sans-serif" font-size="23">CLI prefix resolution path.</text>
  <line x1="490" y1="475" x2="490" y2="535" stroke="#f7768e" stroke-width="4"/>
  <polygon points="490,555 480,530 500,530" fill="#f7768e"/>
  <rect x="75" y="570" width="830" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="105" y="615" fill="#7aa2f7" font-family="monospace" font-size="26">archive scan.rs</text>
  <text x="105" y="660" fill="#c0caf5" font-family="monospace" font-size="23">strip dashes + hex check + starts_with</text>
  <text x="105" y="696" fill="#c0caf5" font-family="monospace" font-size="23">no trim, no lowercase</text>
  <text x="105" y="732" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Same idea, weaker - case/padding miss.</text>
  <rect x="75" y="795" width="830" height="200" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
  <text x="105" y="840" fill="#f7768e" font-family="monospace" font-size="26">Two definitions of prefix</text>
  <text x="105" y="885" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">CLI and history filter could disagree</text>
  <text x="105" y="921" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">on what a prefix matches.</text>
  <text x="75" y="1060" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">Duplicated prefix logic.</text>
  <text x="75" y="1100" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Agrees today on clean input - by luck, not by construction.</text>

  <text x="1075" y="235" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">AFTER</text>
  <rect x="1095" y="275" width="830" height="200" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="320" fill="#7aa2f7" font-family="monospace" font-size="26">shared::normalize_uuid_prefix</text>
  <text x="1125" y="365" fill="#9ece6a" font-family="monospace" font-size="23">pub, tested, std-only, WASM-safe</text>
  <text x="1125" y="401" fill="#c0caf5" font-family="monospace" font-size="23">trim, strip dashes, lowercase, hex check</text>
  <text x="1125" y="437" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Single home for the prefix shape.</text>
  <line x1="1510" y1="475" x2="1510" y2="535" stroke="#9ece6a" stroke-width="4"/>
  <polygon points="1510,555 1500,530 1520,530" fill="#9ece6a"/>
  <rect x="1095" y="570" width="830" height="200" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="615" fill="#7aa2f7" font-family="monospace" font-size="26">shared::uuid_matches_prefix</text>
  <text x="1125" y="660" fill="#c0caf5" font-family="monospace" font-size="23">launcher resolve + archive filter</text>
  <text x="1125" y="696" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Both call one match; CLI errors unchanged.</text>
  <text x="1125" y="732" fill="#565f89" font-family="Arial, sans-serif" font-size="23">5 new tests, all green.</text>
  <line x1="1510" y1="770" x2="1510" y2="830" stroke="#9ece6a" stroke-width="4"/>
  <polygon points="1510,850 1500,825 1520,825" fill="#9ece6a"/>
  <rect x="1095" y="865" width="830" height="130" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="910" fill="#7aa2f7" font-family="monospace" font-size="26">history filter gains tolerance</text>
  <text x="1125" y="955" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Uppercase and padded prefixes now hit, like the CLI.</text>
  <text x="1095" y="1060" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">One definition - every caller agrees.</text>
  <text x="1095" y="1100" fill="#565f89" font-family="Arial, sans-serif" font-size="23">No behavior change for clean lowercase input.</text>

  <text x="55" y="1172" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Caveat: launcher keeps its own empty-vs-hex error messages - only the validation core moved to shared.</text>
</svg>
