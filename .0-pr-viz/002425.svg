<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2425 · Approve multiple credentials in one request</text>
<text x="55" y="105" font-family="sans-serif" font-size="34" fill="#e6e9f5">One credential used to mean one request and one execution binding.</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">A bounded set now gets one card and one atomic approval.</text>
<path d="M55 180 H1945 M1000 200 V1130" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="235" font-family="sans-serif" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="24" fill="#9ece6a">AFTER</text>
<rect x="55" y="285" width="890" height="210" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="330" font-family="sans-serif" font-size="28" fill="#7aa2f7">secret request</text>
<text x="80" y="390" font-family="sans-serif" font-size="25" fill="#c0caf5">One reference and environment per call.</text>
<text x="80" y="438" font-family="sans-serif" font-size="25" fill="#f7768e">Several credentials need separate cards.</text>
<rect x="1055" y="285" width="890" height="210" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="330" font-family="sans-serif" font-size="28" fill="#7aa2f7">secret request --credential</text>
<text x="1080" y="390" font-family="sans-serif" font-size="25" fill="#c0caf5">Repeat ENV=REFERENCE for 1-16 credentials.</text>
<text x="1080" y="438" font-family="sans-serif" font-size="25" fill="#9ece6a">One ID-only marker; one complete review card.</text>
<rect x="55" y="550" width="890" height="210" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="595" font-family="sans-serif" font-size="28" fill="#7aa2f7">Independent approval</text>
<text x="80" y="655" font-family="sans-serif" font-size="25" fill="#c0caf5">Each request produces its own binding.</text>
<text x="80" y="703" font-family="sans-serif" font-size="25" fill="#f7768e">No combined all-or-nothing decision.</text>
<rect x="1055" y="550" width="890" height="210" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="595" font-family="sans-serif" font-size="28" fill="#7aa2f7">One transaction</text>
<text x="1080" y="655" font-family="sans-serif" font-size="25" fill="#c0caf5">Every member retains its pinned scope checks.</text>
<text x="1080" y="703" font-family="sans-serif" font-size="25" fill="#9ece6a">Failure rolls back all new bindings.</text>
<rect x="55" y="815" width="890" height="210" rx="16" fill="#1e202e" stroke="#f7768e"/>
<text x="80" y="860" font-family="sans-serif" font-size="28" fill="#7aa2f7">secret run --binding</text>
<text x="80" y="920" font-family="sans-serif" font-size="25" fill="#c0caf5">One approved binding per command.</text>
<text x="80" y="968" font-family="sans-serif" font-size="25" fill="#f7768e">Cannot inject a credential set this way.</text>
<rect x="1055" y="815" width="890" height="210" rx="16" fill="#1e202e" stroke="#9ece6a"/>
<text x="1080" y="860" font-family="sans-serif" font-size="28" fill="#7aa2f7">Repeat --binding</text>
<text x="1080" y="920" font-family="sans-serif" font-size="25" fill="#c0caf5">Redeem all bindings; reject environment collisions.</text>
<text x="1080" y="968" font-family="sans-serif" font-size="25" fill="#9ece6a">Start the child only after every redemption succeeds.</text>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: atomic approval and command startup; a later revocation cannot recall values already redeemed.</text>
</svg>