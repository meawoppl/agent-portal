<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2302 · Answer Codex token refresh requests instead of leaving them pending</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Codex's request for fresh ChatGPT tokens was never answered, so it could wait;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">Portal now refuses it at once and tells the user to run codex login.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1040" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">ServerRequest::ChatgptAuthTokensRefresh</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">account/chatgptAuthTokens/refresh</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">no respond / respond_error ever sent</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">Codex app-server</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">waits on the reply indefinitely</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">turn can stall</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">classifier.rs transcript text</text>
  <text x="79" y="725" font-size="23" fill="#f7768e">"(not handled - the agent may pause)"</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">no action for the user</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">settle_unsupported_request</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">respond_error(id, -32000, TOKEN_REFRESH_UNSUPPORTED)</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">idle and active next_message loops</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">Write fails</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">IoEvent::Error(CommunicationError); break</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">request id logged; account id never</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">Transcript notice</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">sign in with codex login on that computer</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">then restart the session</text>

  <rect x="1045" y="845" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="1069" y="885" font-size="26" fill="#c0caf5">Residual: TODO(SDK #496)</text>
  <text x="1069" y="925" font-size="23" fill="#a9b1d6">request() buffers a mid-wait server request</text>
  <text x="1069" y="960" font-size="23" fill="#a9b1d6">filed upstream in rust-code-agent-sdks</text>
</svg>
