<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2301 · Tell session members when a session stops running</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Only the launcher's owner heard a session had stopped; its other members now</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">get a bare refetch signal that says nothing about why.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1040" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">Failed launch / exit</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">broadcast_to_user(&amp;owner, ...)</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">members hear nothing</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">Editor / viewer dashboards</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">session still listed as running</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">until a manual refresh</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">SessionExited.reason</text>
  <text x="79" y="725" font-size="23" fill="#a9b1d6">SessionExitReason, always sent</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">owner-only frame</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">notify_members_not_running</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">after UPDATE disconnected succeeds (gen-guarded)</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">proxy disconnect; failed launch; not launcher exit</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">Bare SessionExited { session_id, exit_code: null }</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">reason: Option, omitted; no error, no paths</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">old clients decode it; None only refetches</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">member_recipients</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">query error: no one, MEMBER_STATUS_FANOUT_FAILED</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">removed member: no row, no frame</text>

  <rect x="1045" y="845" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="1069" y="885" font-size="26" fill="#c0caf5">Owner unchanged</text>
  <text x="1069" y="925" font-size="23" fill="#a9b1d6">LaunchSessionResult with error, reason: Some(..)</text>
  <text x="1069" y="960" font-size="23" fill="#a9b1d6">bare frame never clears its banner</text>
</svg>
