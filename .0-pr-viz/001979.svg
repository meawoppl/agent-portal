<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 1979 remap agent interrupt to Ctrl+Z</title>
  <desc id="desc">Before, Ctrl+C interrupted an agent while competing with copy. After, Ctrl+Z interrupts globally and both dashboard footer modes advertise the binding.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="70" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" letter-spacing="1">PR #1979 · Remap agent interrupt to Ctrl+Z</text>
  <text x="55" y="124" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Interrupt moves away from the browser's copy chord;</text>
  <text x="55" y="166" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">the persistent dashboard hints now teach the new shortcut.</text>
  <line x1="55" y1="190" x2="1945" y2="190" stroke="#3d4666" stroke-width="2"/>
  <line x1="1000" y1="225" x2="1000" y2="1090" stroke="#3d4666" stroke-width="2" stroke-dasharray="12 14"/>
  <text x="70" y="260" fill="#f7768e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1070" y="260" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <rect x="70" y="295" width="820" height="300" rx="8" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="105" y="355" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Ctrl+C = interrupt</text>
  <text x="105" y="420" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">The handler needed selection detection to avoid</text>
  <text x="105" y="460" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">stealing the browser's copy operation.</text>
  <text x="105" y="525" fill="#e0af68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">footer: no interrupt hint</text>
  <rect x="1070" y="295" width="820" height="300" rx="8" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1105" y="355" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Ctrl+Z = interrupt</text>
  <text x="1105" y="420" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Capture-phase binding works in edit, nav,</text>
  <text x="1105" y="460" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">and Vim modes; Cmd+Z remains native undo.</text>
  <text x="1105" y="525" fill="#7dcfff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">footer: Ctrl+Z = interrupt</text>
  <rect x="270" y="700" width="1460" height="225" rx="12" fill="#1e202e" stroke="#7aa2f7" stroke-width="3"/>
  <text x="330" y="765" fill="#7aa2f7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">ONE ACTION, THREE DISCOVERY PATHS</text>
  <text x="330" y="830" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">Ctrl+Z globally</text>
  <text x="760" y="830" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">x in Nav mode</text>
  <text x="1135" y="830" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">? shortcuts overlay</text>
  <text x="1000" y="1055" text-anchor="middle" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="700">Focused session receives ClientToServer::Interrupt</text>
</svg>
