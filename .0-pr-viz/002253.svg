<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200"><rect width="2000" height="1200" fill="#1a1b26"/><g font-family="sans-serif"><text x="55" y="52" font-size="24" fill="#a9b1d6">PR #2253 · Fork visualization validation</text><text x="55" y="110" font-size="34" fill="#e6e9f5">Fork visual summaries now reach validation through an explicitly data-only checkout.</text><path d="M55 170H1945 M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/><text x="55" y="240" font-size="22" fill="#f7768e">BEFORE</text><text x="1055" y="240" font-size="22" fill="#9ece6a">AFTER</text><text x="70" y="370" font-size="30" fill="#c0caf5">pull_request_target + fork head</text><text x="1070" y="370" font-size="30" fill="#c0caf5">pull_request_target + fork head</text><text x="70" y="500" font-size="30" fill="#f7768e">checkout v7 refuses the fork</text><text x="1070" y="500" font-size="30" fill="#9ece6a">allow-unsafe-pr-checkout: true</text><text x="70" y="630" font-size="30" fill="#f7768e">SVG validation never runs</text><text x="1070" y="630" font-size="30" fill="#9ece6a">persist-credentials: false</text><text x="1070" y="760" font-size="30" fill="#c0caf5">Sparse .0-pr-viz data only</text><text x="1070" y="890" font-size="30" fill="#9ece6a">Trusted validator checks the SVG</text><text x="55" y="1172" font-size="22" fill="#a9b1d6">Never execute scripts from the fork checkout; base configuration and the upstream validator remain trusted inputs.</text></g></svg>