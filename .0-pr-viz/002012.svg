<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 2012 adopt error_body helper</title>
  <desc id="desc">Four dialogs read error text by hand; now all share utils error_body.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="58" fill="#565f89" font-family="Arial, sans-serif" font-size="24" letter-spacing="1">PR #2012 · Adopt error_body helper in remaining dialogs</text>
  <text x="55" y="112" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">Four error paths read response text by hand;</text>
  <text x="55" y="154" fill="#c0caf5" font-family="Arial, sans-serif" font-size="34">now every caller shares one helper.</text>
  <line x1="55" y1="184" x2="1945" y2="184" stroke="#565f89" stroke-width="2"/>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-width="2" stroke-dasharray="12 12"/>

  <text x="75" y="235" fill="#f7768e" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">BEFORE</text>
  <rect x="75" y="275" width="830" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="105" y="320" fill="#7aa2f7" font-family="monospace" font-size="26">launch_dialog + schedule_dialog</text>
  <text x="105" y="365" fill="#c0caf5" font-family="monospace" font-size="23">resp.text().await.unwrap_or_default()</text>
  <text x="105" y="401" fill="#c0caf5" font-family="monospace" font-size="23">blank body renders as trailing blank</text>
  <text x="105" y="437" fill="#565f89" font-family="Arial, sans-serif" font-size="23">No status fallback on empty text.</text>
  <line x1="490" y1="475" x2="490" y2="535" stroke="#f7768e" stroke-width="4"/>
  <polygon points="490,555 480,530 500,530" fill="#f7768e"/>
  <rect x="75" y="570" width="830" height="200" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="3"/>
  <text x="105" y="615" fill="#7aa2f7" font-family="monospace" font-size="26">launchers_panel + subdomains_tab</text>
  <text x="105" y="660" fill="#c0caf5" font-family="monospace" font-size="23">same hand-rolled read, twice more</text>
  <text x="105" y="696" fill="#c0caf5" font-family="monospace" font-size="23">one site re-checks is_empty itself</text>
  <text x="105" y="732" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Four copies of one fallback shape.</text>
  <rect x="75" y="795" width="830" height="200" rx="16" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
  <text x="105" y="840" fill="#f7768e" font-family="monospace" font-size="26">utils::error_body ignored</text>
  <text x="105" y="885" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">agent_login and agent_install use it;</text>
  <text x="105" y="921" fill="#c0caf5" font-family="Arial, sans-serif" font-size="23">these four predate or missed it.</text>
  <text x="75" y="1060" fill="#f7768e" font-family="Arial, sans-serif" font-size="23">Duplicated error-text fallback.</text>
  <text x="75" y="1100" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Whitespace-only bodies also slip through as blank.</text>

  <text x="1075" y="235" fill="#9ece6a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="4">AFTER</text>
  <rect x="1095" y="275" width="830" height="200" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="320" fill="#7aa2f7" font-family="monospace" font-size="26">utils::error_body(resp).await</text>
  <text x="1125" y="365" fill="#9ece6a" font-family="monospace" font-size="23">body text, or HTTP status fallback</text>
  <text x="1125" y="401" fill="#c0caf5" font-family="monospace" font-size="23">blank-aware via is_non_blank</text>
  <text x="1125" y="437" fill="#565f89" font-family="Arial, sans-serif" font-size="23">One home for the fallback shape.</text>
  <line x1="1510" y1="475" x2="1510" y2="535" stroke="#9ece6a" stroke-width="4"/>
  <polygon points="1510,555 1500,530 1520,530" fill="#9ece6a"/>
  <rect x="1095" y="570" width="830" height="200" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="615" fill="#7aa2f7" font-family="monospace" font-size="26">4 call sites converted</text>
  <text x="1125" y="660" fill="#c0caf5" font-family="monospace" font-size="23">launch, schedule, panel, subdomains</text>
  <text x="1125" y="696" fill="#565f89" font-family="Arial, sans-serif" font-size="23">8 added, 11 removed; fmt clean.</text>
  <text x="1125" y="732" fill="#565f89" font-family="Arial, sans-serif" font-size="23">clippy clean, frontend check green.</text>
  <line x1="1510" y1="770" x2="1510" y2="830" stroke="#9ece6a" stroke-width="4"/>
  <polygon points="1510,850 1500,825 1520,825" fill="#9ece6a"/>
  <rect x="1095" y="865" width="830" height="130" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="3"/>
  <text x="1125" y="910" fill="#7aa2f7" font-family="monospace" font-size="26">blank errors now read HTTP 500</text>
  <text x="1125" y="955" fill="#565f89" font-family="Arial, sans-serif" font-size="23">Non-empty bodies render byte-identical.</text>
  <text x="1095" y="1060" fill="#9ece6a" font-family="Arial, sans-serif" font-size="23">One helper - every dialog agrees.</text>
  <text x="1095" y="1100" fill="#565f89" font-family="Arial, sans-serif" font-size="23">No core behavior change.</text>

  <text x="55" y="1172" fill="#565f89" font-family="Arial, sans-serif" font-size="20">Caveat: subdomains empty-case text changes from Failed (HTTP N) to HTTP N - same status, shorter label.</text>
</svg>
