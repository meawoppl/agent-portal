<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2214 · Hide routine Codex guardian auto-approval warnings</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Every medium+ risk action Guardian approved became a PORTAL warning card;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now plain approvals classify to Noop, and only other guardian warnings render.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- BEFORE -->
  <g>
    <rect x="80" y="250" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#7aa2f7">Notification::GuardianWarning(p)</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">p.message: "Automatic approval review approved</text>
    <text x="104" y="364" font-size="23" fill="#a9b1d6">(risk: medium, authorization: high): ..."</text>
  </g>

  <line x1="510" y1="400" x2="510" y2="490" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim)"/>

  <g>
    <rect x="80" y="495" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="535" font-size="26" fill="#7aa2f7">classify_notification (classifier.rs)</text>
    <text x="104" y="575" font-size="23" fill="#f7768e">every GuardianWarning -> AgentOutput::Visible</text>
    <text x="104" y="611" font-size="22" fill="#565f89">PortalMessage::text("**Codex guardian warning**: ...")</text>
  </g>

  <line x1="510" y1="645" x2="510" y2="955" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="960" width="860" height="120" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="1006" font-size="26" fill="#c0caf5">PORTAL card for routine approved commands</text>
    <text x="104" y="1046" font-size="23" fill="#f7768e">reads like a problem; nothing went wrong</text>
  </g>

  <!-- AFTER -->
  <g>
    <rect x="1065" y="250" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="1089" y="290" font-size="26" fill="#7aa2f7">Notification::GuardianWarning(p)</text>
    <text x="1089" y="330" font-size="23" fill="#a9b1d6">p.message: "Automatic approval review approved</text>
    <text x="1089" y="364" font-size="23" fill="#a9b1d6">(risk: medium, authorization: high): ..."</text>
  </g>

  <line x1="1495" y1="400" x2="1495" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="495" width="860" height="190" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1089" y="535" font-size="26" fill="#9ece6a">is_guardian_approval(&amp;p.message)</text>
    <text x="1089" y="575" font-size="23" fill="#a9b1d6">starts_with("Automatic approval review approved")</text>
    <text x="1089" y="611" font-size="23" fill="#9ece6a">true  -> AgentOutput::Noop</text>
    <text x="1089" y="647" font-size="23" fill="#a9b1d6">false -> Visible "**Codex guardian warning**"</text>
  </g>

  <g>
    <rect x="1065" y="720" width="860" height="110" fill="#1e202e" stroke="#e0af68" stroke-width="1.5"/>
    <text x="1089" y="760" font-size="24" fill="#e0af68">free-text match: protocol has no approved flag</text>
    <text x="1089" y="796" font-size="22" fill="#a9b1d6">a reworded message falls back to showing the card</text>
  </g>

  <line x1="1495" y1="830" x2="1495" y2="955" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="960" width="860" height="120" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1089" y="1006" font-size="26" fill="#c0caf5">approvals stay silent</text>
    <text x="1089" y="1046" font-size="23" fill="#9ece6a">denials and other guardian warnings still surface</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Matches Codex's message prefix because GuardianWarningNotification carries only free text; no structured approve/deny field exists to key on.</text>
</svg>
