<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">PR 1992 dedupe portal-auth ws_to_http onto shared urls</title>
  <desc id="desc">Before, portal-auth hand-rolled its own ws_to_http with whole-string str::replace. After, it imports shared::urls::ws_to_http, which swaps only the leading scheme; the device_flow_login call site is unchanged.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="55" y="70" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" letter-spacing="1">PR #1992 · Dedupe portal-auth ws_to_http onto shared helper</text>
  <text x="55" y="124" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">portal-auth hand-rolled its own ws_to_http with whole-string replace;</text>
  <text x="55" y="166" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">now it calls shared::urls: leading scheme only, same output.</text>
  <line x1="55" y1="190" x2="1945" y2="190" stroke="#3d4666" stroke-width="2"/>
  <line x1="1000" y1="225" x2="1000" y2="1090" stroke="#3d4666" stroke-width="2" stroke-dasharray="12 14"/>
  <text x="70" y="260" fill="#f7768e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1070" y="260" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <rect x="70" y="295" width="820" height="610" rx="8" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="105" y="350" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="700">Local copy in portal-auth</text>
  <text x="105" y="415" fill="#e6e9f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">pub fn ws_to_http(url: &amp;str)</text>
  <text x="105" y="465" fill="#e6e9f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">url.replace("ws://", "http://")</text>
  <text x="105" y="515" fill="#e6e9f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">.replace("wss://", "https://")</text>
  <line x1="330" y1="550" x2="330" y2="615" stroke="#f7768e" stroke-width="5"/>
  <text x="105" y="670" fill="#f7768e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Rewrites every occurrence</text>
  <text x="105" y="725" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Whole-string replace also rewrites</text>
  <text x="105" y="765" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">scheme text embedded past the prefix.</text>
  <text x="105" y="835" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Second copy of logic launcher/</text>
  <text x="105" y="875" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">already replaced with the helper.</text>
  <rect x="1070" y="295" width="820" height="610" rx="8" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1105" y="350" fill="#c0caf5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="700">One import, function deleted</text>
  <text x="1105" y="415" fill="#7aa2f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">use shared::urls::ws_to_http;</text>
  <text x="1105" y="465" fill="#e6e9f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">let auth_base = ws_to_http(</text>
  <text x="1105" y="515" fill="#e6e9f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">backend_url); // unchanged</text>
  <line x1="1330" y1="550" x2="1330" y2="615" stroke="#9ece6a" stroke-width="5"/>
  <text x="1105" y="670" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Swaps the leading scheme only</text>
  <text x="1105" y="725" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Helper carries unit tests for</text>
  <text x="1105" y="765" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">passthrough + round-trip.</text>
  <text x="1105" y="835" fill="#7dcfff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">1 insertion, 6 deletions</text>
  <text x="1105" y="875" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Identical URLs for real inputs.</text>
  <text x="55" y="1160" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Scope: device_flow_login auth_base; same http output on ws/wss backend URLs, embedded ws(s):// in query strings now left alone.</text>
</svg>
