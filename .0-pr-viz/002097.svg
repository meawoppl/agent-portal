<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <rect width="2000" height="1200" fill="#1a1b26"/>
  <desc id="desc">Before, each forwarded port chip mixed the Portal pane open action, the new-tab open action, and the stop control into visually connected targets. After, forward-chip-open, forward-chip-external, and forward-chip-revoke are distinct controls.</desc>
  <text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2097 - Separate port forward chip actions</text>
  <text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Forwarded ports now have separate click targets for Portal pane, new tab,</text>
  <text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">and stop-forward actions.</text>
  <path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
  <text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
  <text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>

  <g>
    <rect x="55" y="290" width="870" height="240" rx="12" fill="#1e202e" stroke="#f7768e"/>
    <text x="90" y="340" font-family="sans-serif" font-size="26" fill="#f7768e">One combined chip</text>
    <rect x="130" y="390" width="430" height="70" rx="8" fill="#1a1b26" stroke="#565f89"/>
    <text x="166" y="435" font-family="monospace" font-size="30" fill="#7dcfff">:49022 open</text>
    <rect x="595" y="390" width="70" height="70" rx="8" fill="#1a1b26" stroke="#565f89"/>
    <text x="618" y="435" font-family="monospace" font-size="30" fill="#a9b1d6">x</text>
    <text x="90" y="492" font-family="sans-serif" font-size="23" fill="#c0caf5">The port label and new-tab affordance read as one target.</text>
  </g>

  <g>
    <rect x="1055" y="290" width="870" height="240" rx="12" fill="#1e202e" stroke="#9ece6a"/>
    <text x="1090" y="340" font-family="sans-serif" font-size="26" fill="#9ece6a">Three explicit controls</text>
    <rect x="1130" y="390" width="240" height="70" rx="8" fill="#1a1b26" stroke="#9ece6a"/>
    <text x="1167" y="435" font-family="monospace" font-size="30" fill="#9ece6a">:49022</text>
    <rect x="1395" y="390" width="78" height="70" rx="8" fill="#1e202e" stroke="#7aa2f7"/>
    <text x="1416" y="435" font-family="monospace" font-size="30" fill="#7aa2f7">tab</text>
    <rect x="1500" y="390" width="78" height="70" rx="8" fill="#1e202e" stroke="#565f89"/>
    <text x="1516" y="435" font-family="monospace" font-size="30" fill="#a9b1d6">stop</text>
    <text x="1090" y="492" font-family="sans-serif" font-size="23" fill="#c0caf5">Each action has its own border, label, hover, and focus state.</text>
  </g>

  <g>
    <rect x="55" y="610" width="870" height="190" rx="12" fill="#1e202e" stroke="#e0af68"/>
    <text x="90" y="655" font-family="sans-serif" font-size="26" fill="#e0af68">Ambiguous intent</text>
    <text x="90" y="704" font-family="sans-serif" font-size="23" fill="#c0caf5">Clicking the chip looked like it might open a tab, open the</text>
    <text x="90" y="740" font-family="sans-serif" font-size="23" fill="#c0caf5">embedded pane, or dismiss the surface depending on the glyph.</text>
  </g>

  <g>
    <rect x="1055" y="610" width="870" height="190" rx="12" fill="#1e202e" stroke="#7aa2f7"/>
    <text x="1090" y="655" font-family="sans-serif" font-size="26" fill="#7aa2f7">Named behavior in markup</text>
    <text x="1090" y="704" font-family="sans-serif" font-size="23" fill="#c0caf5">forward-chip-open emits the split-surface callback.</text>
    <text x="1090" y="740" font-family="sans-serif" font-size="23" fill="#c0caf5">forward-chip-external links to /forwards/open in a new tab.</text>
  </g>

  <g>
    <rect x="55" y="880" width="870" height="160" rx="12" fill="#1e202e" stroke="#565f89"/>
    <text x="90" y="925" font-family="sans-serif" font-size="26" fill="#a9b1d6">Health color on the whole group</text>
    <text x="90" y="974" font-family="sans-serif" font-size="23" fill="#c0caf5">The wrapper carried the state color, visually tying all actions.</text>
  </g>

  <g>
    <rect x="1055" y="880" width="870" height="160" rx="12" fill="#1e202e" stroke="#9ece6a"/>
    <text x="1090" y="925" font-family="sans-serif" font-size="26" fill="#9ece6a">Health color on open targets only</text>
    <text x="1090" y="974" font-family="sans-serif" font-size="23" fill="#c0caf5">The stop-forward button stays visually separate from live state.</text>
  </g>

  <text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: frontend chip markup and CSS only; no forwarding protocol behavior changed.</text>
</svg>
