<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2422 · One secret request, one approval card</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Status broadcasts repeated a stored notice, creating duplicate approval cards.</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">Request identity now anchors one card across live delivery, replay and grouping.</text>
<path d="M55 178H1945 M1000 205V1130" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="230" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="317" font-family="sans-serif" font-size="28" fill="#f7768e">Same persisted notice delivered again</text>
<text x="79" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">Approval and retry broadcasts carry request_id</text>
<text x="79" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">SessionView appends another transcript entry</text>
<rect x="1055" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="317" font-family="sans-serif" font-size="28" fill="#9ece6a">Cached secret_request_id</text>
<text x="1079" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">Live, hydration and replay deduplicate notices</text>
<text x="1079" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">Keep the first transcript position</text>
<rect x="55" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="547" font-family="sans-serif" font-size="28" fill="#f7768e">Repeated timestamp-based keys</text>
<text x="79" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">Portal groups contain duplicate keyed children</text>
<text x="79" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Card lifecycle and loading state become unstable</text>
<rect x="1055" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="547" font-family="sans-serif" font-size="28" fill="#9ece6a">Stable standalone MessageGroup</text>
<text x="1079" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">Group key: secret-request-{id}</text>
<text x="1079" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">One card retains its state as neighbors change</text>
<rect x="55" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="777" font-family="sans-serif" font-size="28" fill="#f7768e">Old row timestamp rewinds replay</text>
<text x="79" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">Reconnect can repeat newer messages</text>
<text x="79" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Status fetch can leave Refresh disabled</text>
<rect x="1055" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="777" font-family="sans-serif" font-size="28" fill="#9ece6a">Monotonic watermark and bounded fetch</text>
<text x="1079" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">Old timestamps cannot rewind replay</text>
<text x="1079" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">10-second timeout releases Refresh for retry</text>
<text x="1055" y="1010" font-family="sans-serif" font-size="26" fill="#9ece6a">Approved bindings display Access expires</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: frontend lifecycle and labels; approval authority and encrypted secret storage remain unchanged.</text>
