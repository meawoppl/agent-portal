<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2270 · Add a Plugins browser backed by a launcher plugin RPC</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Plugins were only visible inside a session, and launch suggestions scanned</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">the server's disk; now every plugin view asks the launcher that hosts them.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">Launch dialog suggestions</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">GET /api/plugins?workingDirectory=...</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">discover_plugins() scans the backend host's disk</text>
  <line x1="505" y1="395" x2="505" y2="440" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">PluginRequest / PluginAction (#2166)</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">typed contract defined in shared</text>
  <text x="79" y="560" font-size="23" fill="#f7768e">no route, no launcher handler, no UI</text>

  <rect x="55" y="645" width="900" height="190" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Where plugins appear</text>
  <text x="79" y="725" font-size="23" fill="#a9b1d6">in-session plugin panel only</text>
  <text x="79" y="765" font-size="23" fill="#f7768e">prompts, homepage, doctor, path, version: empty</text>
  <text x="79" y="800" font-size="23" fill="#a9b1d6">skill descriptions: always None</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">POST /api/launchers/{id}/plugins</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">ServerToLauncher::Plugin, gated plugins.manage.v1</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">owner-only; named actions, never a command line</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">plugin_rpc::handle on the launcher</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">Inventory -&gt; host_inventory(working_directory)</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">other actions: explicit error until their PRs</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="190" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">Settings / Plugins + launch dialog</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">computer picker, directory match, detect reasons</text>
  <text x="1069" y="765" font-size="23" fill="#a9b1d6">cards: agents, prompts, docs, path, version</text>
  <text x="1069" y="800" font-size="23" fill="#a9b1d6">suggestions from the selected launcher</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Unchanged: per-session selection (GET/PATCH /api/plugins?sessionId=) still uses ServerToLauncher::SessionPlugins.</text>
</svg>
