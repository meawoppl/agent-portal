<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2275 · Install, update, remove and doctor plugins from the browser</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Plugin lifecycle was shell-only; the browser now runs it on the chosen</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">computer and shows the captured output, exit code and refreshed inventory.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">Settings / Plugins (#2270)</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">read-only cards</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">install/update/remove/doctor need a shell</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">plugin_rpc::handle</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">Inventory only</text>
  <text x="79" y="560" font-size="23" fill="#f7768e">Install / Update / Remove / Doctor: "not yet"</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Update availability</text>
  <text x="79" y="725" font-size="23" fill="#a9b1d6">agent-portal plugin update NAME --check</text>
  <text x="79" y="760" font-size="23" fill="#f7768e">one plugin at a time, terminal only</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">Card actions + install box</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">Update, Doctor, Reinstall, Uninstall, Install</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">destructive ones confirm and name the computer</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">run_cli: agent-portal plugin ... as a child</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">output + exit_code + refreshed inventory</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">LIFECYCLE lock; killed at 570 s if hung</text>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">PluginAction::CheckUpdates</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">every plugin's git source, checked in parallel</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">"update available" badge on the card</text>

  <text x="55" y="1172" font-size="22" fill="#565f89">Unchanged: the CLI's install transaction (move aside, setup, restore on failure) is reused as-is, so a failed install stays retryable.</text>
</svg>
