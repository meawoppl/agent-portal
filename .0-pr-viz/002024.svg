<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-label="Visual summary: agent-portal now supports a fast top-level --version flag that prints runtime version, git hash, and build time.">
  <rect width="2000" height="1200" fill="#16161e"/>
  <text x="72" y="112" fill="#e6e9f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="700">agent-portal --version is explicit</text>
  <text x="72" y="166" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">The launcher can now report the exact runtime version without starting the daemon path.</text>

  <g transform="translate(100 280)">
    <rect x="0" y="0" width="520" height="560" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
    <text x="36" y="64" fill="#7aa2f7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">New CLI flag</text>
    <rect x="42" y="120" width="436" height="124" rx="10" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
    <text x="70" y="192" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="29">agent-portal --version</text>
    <text x="42" y="320" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Parsed on the top-level Args struct as a global flag.</text>
    <text x="42" y="370" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Handled immediately after Args::parse().</text>
    <text x="42" y="474" fill="#7dcfff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">No config, auth, service, or update work.</text>
  </g>

  <g transform="translate(740 280)">
    <rect x="0" y="0" width="520" height="560" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
    <text x="36" y="64" fill="#bb9af7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Printed identity</text>
    <rect x="42" y="116" width="436" height="250" rx="10" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
    <text x="70" y="170" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">agent-portal 2.14.N</text>
    <text x="70" y="226" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">(GIT_HASH;</text>
    <text x="70" y="282" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24"> built BUILD_TIME)</text>
    <text x="42" y="448" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Uses shared::VERSION, shared::GIT_HASH, and shared::BUILD_TIME.</text>
  </g>

  <g transform="translate(1380 280)">
    <rect x="0" y="0" width="520" height="560" rx="12" fill="#1e202e" stroke="#565f89" stroke-width="3"/>
    <text x="36" y="64" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Regression guard</text>
    <rect x="42" y="120" width="436" height="176" rx="10" fill="#16161e" stroke="#3d4666" stroke-width="2"/>
    <text x="70" y="178" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">version_flag_parses_</text>
    <text x="70" y="228" fill="#c0caf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">without_subcommand</text>
    <text x="42" y="380" fill="#a9b1d6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Covers the intended no-subcommand invocation.</text>
    <text x="42" y="474" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Smoke-tested with the built binary.</text>
  </g>

  <path d="M620 560 C675 560 690 560 735 560" fill="none" stroke="#7aa2f7" stroke-width="7" stroke-linecap="round"/>
  <path d="M1260 560 C1315 560 1330 560 1375 560" fill="none" stroke="#9ece6a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="680" cy="560" r="10" fill="#7aa2f7"/>
  <circle cx="1320" cy="560" r="10" fill="#9ece6a"/>

  <g transform="translate(300 990)">
    <rect x="0" y="0" width="420" height="86" rx="10" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
    <text x="32" y="54" fill="#7aa2f7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">fast local version check</text>
    <rect x="490" y="0" width="420" height="86" rx="10" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
    <text x="522" y="54" fill="#bb9af7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">build identity included</text>
    <rect x="980" y="0" width="420" height="86" rx="10" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
    <text x="1012" y="54" fill="#9ece6a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">parser test added</text>
  </g>
</svg>
