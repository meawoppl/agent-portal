<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Forward tunnel streams now close from either endpoint</title>
  <desc id="desc">Before, local endpoint EOF left streams stuck until the 512-slot limit. After, either endpoint ending triggers cleanup and releases the slot.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>
  <g transform="translate(40 40) scale(2)">
  <text x="48" y="58" fill="#c0caf5" font-family="sans-serif" font-size="28" font-weight="700">Tunnel lifecycle: either endpoint can finish</text>
  <text x="48" y="92" fill="#565f89" font-family="sans-serif" font-size="16">The relay now observes local EOF and peer Close concurrently.</text>
  <rect x="48" y="130" width="402" height="330" rx="18" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="76" y="172" fill="#f7768e" font-family="sans-serif" font-size="22" font-weight="700">Before</text>
  <rect x="82" y="215" width="128" height="58" rx="10" fill="#3d4666"/>
  <text x="146" y="250" text-anchor="middle" fill="#c0caf5" font-family="sans-serif" font-size="16">HTTP EOF</text>
  <path d="M210 244 H292" stroke="#f7768e" stroke-width="5" stroke-dasharray="10 8"/>
  <path d="M292 244 l-14 -9 v18z" fill="#f7768e"/>
  <rect x="292" y="215" width="124" height="58" rx="10" fill="#3d4666"/>
  <text x="354" y="250" text-anchor="middle" fill="#c0caf5" font-family="sans-serif" font-size="16">relay waits</text>
  <text x="249" y="320" text-anchor="middle" fill="#f7768e" font-family="sans-serif" font-size="18">slot remains registered</text>
  <text x="249" y="366" text-anchor="middle" fill="#c0caf5" font-family="monospace" font-size="25">512 / 512</text>
  <text x="249" y="402" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="15">new requests: at-capacity</text>
  <rect x="510" y="130" width="402" height="330" rx="18" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="538" y="172" fill="#9ece6a" font-family="sans-serif" font-size="22" font-weight="700">After</text>
  <rect x="544" y="215" width="128" height="58" rx="10" fill="#3d4666"/>
  <text x="608" y="250" text-anchor="middle" fill="#c0caf5" font-family="sans-serif" font-size="16">HTTP EOF</text>
  <path d="M672 244 H754" stroke="#9ece6a" stroke-width="5"/>
  <path d="M754 244 l-14 -9 v18z" fill="#9ece6a"/>
  <rect x="754" y="215" width="124" height="58" rx="10" fill="#3d4666"/>
  <text x="816" y="240" text-anchor="middle" fill="#c0caf5" font-family="sans-serif" font-size="15">remove slot</text>
  <text x="816" y="259" text-anchor="middle" fill="#c0caf5" font-family="sans-serif" font-size="15">send Close</text>
  <text x="711" y="320" text-anchor="middle" fill="#9ece6a" font-family="sans-serif" font-size="18">cleanup runs immediately</text>
  <text x="711" y="366" text-anchor="middle" fill="#c0caf5" font-family="monospace" font-size="25">slots return to pool</text>
  <text x="711" y="402" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="15">works symmetrically on backend and proxy</text>
  <text x="480" y="505" text-anchor="middle" fill="#7aa2f7" font-family="sans-serif" font-size="16">Regression: dropping Hyper's duplex endpoint reaps the registered stream without waiting for peer Close.</text>
  </g>
</svg>
