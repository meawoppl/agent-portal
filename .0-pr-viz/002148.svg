<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2148 - Drop speculative cause from login rejection message</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">A rejected sign-in code blamed expiry, which misled users when the</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">real fault was elsewhere; the message now says only what to do.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">login.rs CodeRejected message</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Appended a guess: the code may have expired,</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">been used, or come from an earlier window.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">login.rs CodeRejected message</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">Appends only the action: start a new sign-in</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">and paste the new code.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Why the guess was wrong</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">Every 400 from the CLI looks alike; during the</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">bracketed-paste bug the code was fine.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">Same error, no false lead</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">The underlying CodeRejected text is unchanged;</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">the speculation about expiry is removed.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">Recovery path</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Users were told to paste the fresh code promptly</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">as if they had been too slow.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">Recovery path</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Users are told to restart the sign-in and paste</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">the new code; the flow itself is unchanged.</text>
</g>
</svg>
