<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" font-family="'Segoe UI','Noto Sans','DejaVu Sans',ui-sans-serif,system-ui,sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #1961 · Keep hold-open dictation visible across restarts</text>
  <text x="55" y="100" font-size="34" fill="#e6e9f5">Final browser speech used to disappear during forced restarts;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">now the captured mode and transcript ride every restart.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="250" width="860" height="145" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="108" y="292" font-size="26" fill="#7aa2f7">VoiceInputMsg::Final(text)</text>
    <text x="108" y="332" font-size="23" fill="#a9b1d6">browser emits a final segment during hold-open</text>
    <text x="108" y="366" font-size="22" fill="#f7768e">stored internally; preview can stay stale or blank</text>
  </g>

  <line x1="510" y1="395" x2="510" y2="475" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="530" y="440" font-size="22" fill="#f7768e">forced onend</text>

  <g>
    <rect x="80" y="495" width="860" height="160" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="108" y="538" font-size="26" fill="#7aa2f7">VoiceInputMsg::Ended</text>
    <text x="108" y="578" font-size="23" fill="#a9b1d6">restart calls start_session_async from scratch</text>
    <text x="108" y="612" font-size="22" fill="#f7768e">new recognizer re-reads localStorage mode</text>
  </g>

  <line x1="510" y1="655" x2="510" y2="735" stroke="#f7768e" stroke-width="2" marker-end="url(#arr-red)"/>

  <g>
    <rect x="80" y="755" width="860" height="155" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="108" y="798" font-size="26" fill="#c0caf5">user sees a gap</text>
    <text x="108" y="838" font-size="23" fill="#f7768e">dictation looks missing until another UI update</text>
    <text x="108" y="872" font-size="22" fill="#565f89">mid-recording setting changes can split behavior</text>
  </g>

  <g>
    <rect x="80" y="975" width="860" height="105" fill="#1e202e" stroke="#e0af68" stroke-width="1.5"/>
    <text x="108" y="1018" font-size="24" fill="#e0af68">max-duration also read the current setting</text>
    <text x="108" y="1052" font-size="22" fill="#a9b1d6">not necessarily the mode this recording started with</text>
  </g>

  <g>
    <rect x="1065" y="250" width="860" height="145" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1093" y="292" font-size="26" fill="#7aa2f7">VoiceInputMsg::Final(text)</text>
    <text x="1093" y="332" font-size="23" fill="#a9b1d6">when hold_open and still recording</text>
    <text x="1093" y="366" font-size="22" fill="#9ece6a">emits on_interim_transcription before caching</text>
  </g>

  <line x1="1495" y1="395" x2="1495" y2="475" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="1515" y="440" font-size="22" fill="#9ece6a">visible carryover</text>

  <g>
    <rect x="1065" y="495" width="860" height="160" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1093" y="538" font-size="26" fill="#7aa2f7">start_session_async(seed, hold_open)</text>
    <text x="1093" y="578" font-size="23" fill="#a9b1d6">restart gets carryover text and captured mode</text>
    <text x="1093" y="612" font-size="22" fill="#9ece6a">continuous and final_acc are seeded together</text>
  </g>

  <line x1="1495" y1="655" x2="1495" y2="735" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <g>
    <rect x="1065" y="755" width="860" height="155" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1093" y="798" font-size="26" fill="#c0caf5">VoiceInputMsg::Ended restarts safely</text>
    <text x="1093" y="838" font-size="23" fill="#9ece6a">same recording, same mode, same transcript</text>
    <text x="1093" y="872" font-size="22" fill="#565f89">MAX_NO_PROGRESS_RESTARTS still gates wedged loops</text>
  </g>

  <g>
    <rect x="1065" y="975" width="860" height="105" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1093" y="1018" font-size="24" fill="#9ece6a">browser_max_session_ms(self.hold_open)</text>
    <text x="1093" y="1052" font-size="22" fill="#a9b1d6">duration uses the mode captured at recording start</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Scope: browser SpeechRecognition hold-open path; server STT still records until tapped and uploads after stop.</text>
</svg>
