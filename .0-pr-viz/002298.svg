<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2298 · Relay why an input failed to deliver</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">A proxy delivery failure reached the browser as a bare "Delivery failed";</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">it now carries a fixed reason, bounded by the backend, on the matching input.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1040" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">input_delivery.rs / wiggum.rs</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">error!("Agent rejected input: {}", message)</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">emit_input_progress(.., Failed): no reason</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">InputProgressAck { session_id, client_msg_id, stage }</text>
  <text x="79" y="525" font-size="23" fill="#f7768e">no field for why</text>
  <text x="79" y="560" font-size="23" fill="#a9b1d6">backend relays message: None</text>

  <rect x="55" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="685" font-size="26" fill="#c0caf5">Browser row</text>
  <text x="79" y="725" font-size="23" fill="#f7768e">"Delivery failed"</text>
  <text x="79" y="760" font-size="23" fill="#a9b1d6">every failure looks the same</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">emit_input_failure(.., reason: &amp;'static str)</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">AGENT_STOPPED / AGENT_REJECTED / AGENT_CLOSED</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">never the prompt or a raw provider error</text>
  <line x1="1495" y1="395" x2="1495" y2="440" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">InputProgressAck { .., message: Option }</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">failure_reason: no controls, 200 chars, empty = None</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">relayed only with Failed; old acks decode</text>
  <line x1="1495" y1="595" x2="1495" y2="640" stroke="#9ece6a" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="1045" y="645" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="685" font-size="26" fill="#c0caf5">Browser row</text>
  <text x="1069" y="725" font-size="23" fill="#9ece6a">"The agent rejected this input"</text>
  <text x="1069" y="760" font-size="23" fill="#a9b1d6">no reason: still "Delivery failed"</text>

  <rect x="1045" y="845" width="900" height="150" rx="10" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="1069" y="885" font-size="26" fill="#c0caf5">Unchanged</text>
  <text x="1069" y="925" font-size="23" fill="#a9b1d6">session check, correlation, terminal recording</text>
  <text x="1069" y="960" font-size="23" fill="#a9b1d6">replay and success stages</text>
</svg>
