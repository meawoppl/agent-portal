<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2317 · Show the server version on the Computers page</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">The Computers page listed launcher versions with nothing to compare them to;</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">it now shows the server's version and marks launchers that are behind it.</text>
  <line x1="55" y1="166" x2="1945" y2="166" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1045" y="215" font-size="22" font-weight="bold" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="640" stroke="#3d4666" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- BEFORE -->
  <rect x="55" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="285" font-size="26" fill="#c0caf5">Launchers header</text>
  <text x="79" y="325" font-size="23" fill="#a9b1d6">description only</text>
  <text x="79" y="360" font-size="23" fill="#f7768e">server_version fetched but never shown</text>

  <rect x="55" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
  <text x="79" y="485" font-size="26" fill="#c0caf5">Version column</text>
  <text x="79" y="525" font-size="23" fill="#a9b1d6">v2.15.1785</text>
  <text x="79" y="560" font-size="23" fill="#f7768e">no way to tell it is out of date</text>

  <!-- AFTER -->
  <rect x="1045" y="245" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="285" font-size="26" fill="#c0caf5">Launchers header</text>
  <text x="1069" y="325" font-size="23" fill="#9ece6a">Server version: v2.15.1799</text>
  <text x="1069" y="360" font-size="23" fill="#a9b1d6">from /api/config server_version</text>

  <rect x="1045" y="445" width="900" height="150" rx="10" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="1069" y="485" font-size="26" fill="#c0caf5">Version column</text>
  <text x="1069" y="525" font-size="23" fill="#9ece6a">v2.15.1785 BEHIND (launcher_behind)</text>
  <text x="1069" y="560" font-size="23" fill="#a9b1d6">unknown or unparseable versions not flagged</text>
</svg>
