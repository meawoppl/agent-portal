<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2096 - Fill the rail pill with agent progress</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Progress bars were visible only inside an open session; the rail pill</text>
<text x="55" y="148" font-family="sans-serif" font-size="34" fill="#e6e9f5">now shows a soft green fill so any session running a job stands out.</text>
<path d="M55 190 H1945 M1000 207 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g>
<rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#f7768e">Wire</text>
<text x="79" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">AgentProgress went to a session's own web</text>
<text x="79" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">clients only; the rail had no progress signal.</text>
</g>
<g>
<rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#9ece6a">ServerToClient::SessionProgress</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">session_id + fraction on every member's user</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">channel; sent when the whole percent changes.</text>
</g>
<g>
<rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">SessionManager store</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">Held bars only; the TTL sweep could not tell</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">anyone but session viewers that a bar expired.</text>
</g>
<g>
<rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">SessionProgress state remembers members</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">Members come from the last post; connect replays</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">via add_user_client_with_progress; sweep clears.</text>
</g>
<g>
<rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#f7768e">SessionPill</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Only the context bar and activity ticks;</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">no sign of a running agent job.</text>
</g>
<g>
<rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">render_progress_fill in the pill</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Green wash grows left to right behind the text,</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">fed by ClientWsState::session_progress.</text>
</g>
</svg>
