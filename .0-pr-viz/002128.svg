<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="pr2128-title pr2128-desc">
  <title id="pr2128-title">PR 2128 Route whitespace collapsing via shared helper</title>
  <desc id="pr2128-desc">Before and after: three snippet and preview builders carried their own split-whitespace-collect-join copy; now they share one collapse_whitespace helper in shared strings.</desc>
  <rect width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="pr2128-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7768e"/>
    </marker>
    <marker id="pr2128-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ece6a"/>
    </marker>
  </defs>

  <text x="55" y="62" fill="#a9b1d6" font-family="sans-serif" font-size="24" letter-spacing="1">PR #2128 - Route whitespace collapsing via shared helper</text>
  <text x="55" y="116" fill="#e6e9f5" font-family="sans-serif" font-size="34" font-weight="700">Three snippet builders carried their own whitespace-collapse copy;</text>
  <text x="55" y="158" fill="#e6e9f5" font-family="sans-serif" font-size="34" font-weight="700">now all three share one helper in shared strings.</text>
  <line x1="55" y1="178" x2="1945" y2="178" stroke="#3d4666" stroke-width="2"/>

  <text x="55" y="225" fill="#f7768e" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">BEFORE</text>
  <text x="1055" y="225" fill="#9ece6a" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="4">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1140" stroke="#565f89" stroke-width="3" stroke-dasharray="14 16"/>

  <g font-family="sans-serif">
    <rect x="70" y="280" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="324" fill="#f7768e" font-size="26" font-weight="700">Same line in three files</text>
    <text x="100" y="365" fill="#c0caf5" font-size="23" font-family="monospace">split_whitespace().collect join(" ")</text>
    <text x="100" y="399" fill="#c0caf5" font-size="23">peek_summary, permissions, work_queue</text>

    <rect x="70" y="480" width="830" height="160" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="524" fill="#f7768e" font-size="26" font-weight="700">Copies can drift apart</text>
    <text x="100" y="565" fill="#c0caf5" font-size="23">one site joins with two spaces</text>
    <text x="100" y="599" fill="#c0caf5" font-size="23">or forgets the trim - nobody notices</text>

    <rect x="70" y="690" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="734" fill="#f7768e" font-size="26" font-weight="700">Three crates, three copies</text>
    <text x="100" y="775" fill="#c0caf5" font-size="23">backend handlers plus the launcher</text>
    <text x="100" y="809" fill="#c0caf5" font-size="23">a fix to one misses the other two</text>

    <rect x="70" y="890" width="830" height="150" rx="18" fill="#1a1b26" stroke="#f7768e" stroke-width="3"/>
    <text x="100" y="934" fill="#f7768e" font-size="26" font-weight="700">Cost of the drift</text>
    <text x="100" y="975" fill="#c0caf5" font-size="23">three copies of one rule in the tree</text>
    <text x="100" y="1009" fill="#c0caf5" font-size="23">snippets render unevenly one day</text>

    <rect x="1100" y="280" width="780" height="150" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="324" fill="#9ece6a" font-size="26" font-weight="700">One shared helper</text>
    <text x="1130" y="365" fill="#c0caf5" font-size="23" font-family="monospace">shared::strings::collapse_whitespace</text>
    <text x="1130" y="399" fill="#c0caf5" font-size="23">plus unit tests locking the shape</text>

    <rect x="1100" y="480" width="780" height="160" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="524" fill="#9ece6a" font-size="26" font-weight="700">Same three sites, routed over</text>
    <text x="1130" y="565" fill="#c0caf5" font-size="23">peek cap, permission snippet, queue preview</text>
    <text x="1130" y="599" fill="#c0caf5" font-size="23">three one-line call sites, zero copies</text>

    <rect x="1100" y="690" width="780" height="150" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="734" fill="#9ece6a" font-size="26" font-weight="700">Three surfaces, zero drift</text>
    <text x="1130" y="775" fill="#c0caf5" font-size="23">one home holds the collapse rule</text>
    <text x="1130" y="809" fill="#c0caf5" font-size="23">joins, trims, and tests in one place</text>

    <rect x="1100" y="890" width="780" height="150" rx="18" fill="#1a1b26" stroke="#9ece6a" stroke-width="3"/>
    <text x="1130" y="934" fill="#9ece6a" font-size="26" font-weight="700">Future edits land everywhere</text>
    <text x="1130" y="975" fill="#c0caf5" font-size="23">one rule, one home, tests cover it</text>
    <text x="1130" y="1009" fill="#c0caf5" font-size="23">no second copy left to forget</text>
  </g>

  <g stroke-width="3" fill="none">
    <line x1="485" y1="438" x2="485" y2="472" stroke="#f7768e" marker-end="url(#pr2128-arr-red)"/>
    <line x1="485" y1="648" x2="485" y2="682" stroke="#f7768e" marker-end="url(#pr2128-arr-red)"/>
    <line x1="485" y1="848" x2="485" y2="882" stroke="#f7768e" marker-end="url(#pr2128-arr-red)"/>
    <line x1="1490" y1="438" x2="1490" y2="472" stroke="#9ece6a" marker-end="url(#pr2128-arr-green)"/>
    <line x1="1490" y1="648" x2="1490" y2="682" stroke="#9ece6a" marker-end="url(#pr2128-arr-green)"/>
    <line x1="1490" y1="848" x2="1490" y2="882" stroke="#9ece6a" marker-end="url(#pr2128-arr-green)"/>
  </g>

  <text x="55" y="1174" fill="#a9b1d6" font-family="sans-serif" font-size="22">Scope caveat: byte-identical output at every call site; dedup only, no logic change.</text>
</svg>
