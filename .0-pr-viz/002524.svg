<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="monospace" font-size="24" fill="#a9b1d6">PR #2524 · Browser redaction under load</text>
<text x="55" y="103" font-family="monospace" font-size="34" fill="#e6e9f5">Browser frames wait briefly for database capacity.</text>
<text x="55" y="146" font-family="monospace" font-size="34" fill="#e6e9f5">The current redaction generation still gates delivery.</text>
<path d="M55 175H1945 M1000 190V1140" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="monospace" font-size="22" fill="#f7768e">BEFORE</text>
<rect x="55" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">Browser frame</text>
<text x="79" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Read the session owner and redaction generation.</text>
<path d="M500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">Pool saturated</text>
<text x="79" y="669" font-family="monospace" font-size="23" fill="#c0caf5">An immediate checkout miss closes the socket.</text>
<path d="M500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="55" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="79" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">Reconnect</text>
<text x="79" y="939" font-family="monospace" font-size="23" fill="#c0caf5">Replay adds pressure to the same database pool.</text>
<text x="1055" y="230" font-family="monospace" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="1055" y="300" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="345" font-family="monospace" font-size="26" fill="#7aa2f7">with_socket_redaction</text>
<text x="1079" y="399" font-family="monospace" font-size="23" fill="#c0caf5">Wait up to three seconds for a checkout.</text>
<path d="M1500 500v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="570" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="615" font-family="monospace" font-size="26" fill="#7aa2f7">Checkout succeeds</text>
<text x="1079" y="669" font-family="monospace" font-size="23" fill="#c0caf5">Validate current rules and process the frame.</text>
<path d="M1500 770v70" stroke="#565f89" stroke-width="3"/>
<rect x="1055" y="840" width="890" height="200" rx="14" fill="#1e202e" stroke="#565f89"/>
<text x="1079" y="885" font-family="monospace" font-size="26" fill="#7aa2f7">Checkout times out</text>
<text x="1079" y="939" font-family="monospace" font-size="23" fill="#c0caf5">Close with REDACTION_DB_POOL_BUSY.</text>
<text x="55" y="1172" font-family="monospace" font-size="22" fill="#a9b1d6">Replay releases its checkout before enqueueing; socket waits run off the async worker.</text>
</svg>
