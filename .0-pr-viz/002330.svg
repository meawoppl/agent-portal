<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2330 · Persistent computer groups</text>
<text x="55" y="110" font-family="sans-serif" font-size="34" fill="#e6e9f5">Hostname changes split one computer into two rail sections.</text>
<text x="55" y="155" font-family="sans-serif" font-size="34" fill="#e6e9f5">Group by launcher identity so all its sessions stay together.</text>
<path d="M1000 190 V1140" stroke="#565f89" stroke-dasharray="8 10"/>
<text x="60" y="230" font-family="sans-serif" font-size="24" fill="#f7768e">BEFORE</text>
<text x="1060" y="230" font-family="sans-serif" font-size="24" fill="#9ece6a">AFTER</text>
<rect x="60" y="280" width="820" height="180" rx="14" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
<text x="84" y="322" font-family="sans-serif" font-size="28" fill="#565f89">One launcher, two saved hostnames</text>
<text x="84" y="370" font-family="sans-serif" font-size="24" fill="#c0caf5">Mac.localdomain: 3 sessions</text>
<text x="84" y="406" font-family="sans-serif" font-size="24" fill="#c0caf5">Matthews-MacBook-Pro-2.local: 3 sessions</text>
<rect x="1060" y="280" width="820" height="180" rx="14" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
<text x="1084" y="322" font-family="sans-serif" font-size="28" fill="#565f89">One launcher, two saved hostnames</text>
<text x="1084" y="370" font-family="sans-serif" font-size="24" fill="#c0caf5">Mac.localdomain: 3 sessions</text>
<text x="1084" y="406" font-family="sans-serif" font-size="24" fill="#c0caf5">Matthews-MacBook-Pro-2.local: 3 sessions</text>
<rect x="60" y="540" width="820" height="180" rx="14" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
<text x="84" y="582" font-family="sans-serif" font-size="28" fill="#f7768e">Hostname decides membership</text>
<text x="84" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Sorting uses hostname text.</text>
<text x="84" y="666" font-family="sans-serif" font-size="24" fill="#c0caf5">Rail boundaries compare displayed labels.</text>
<rect x="1060" y="540" width="820" height="180" rx="14" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1084" y="582" font-family="sans-serif" font-size="28" fill="#9ece6a">host_group_key decides membership</text>
<text x="1084" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Portal connection + persistent launcher_id</text>
<text x="1084" y="666" font-family="sans-serif" font-size="24" fill="#c0caf5">sort_by_host keeps each identity contiguous.</text>
<rect x="60" y="800" width="820" height="180" rx="14" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
<text x="84" y="842" font-family="sans-serif" font-size="28" fill="#f7768e">Two sections for one computer</text>
<text x="84" y="890" font-family="sans-serif" font-size="24" fill="#c0caf5">A hostname change splits the session list.</text>
<text x="84" y="926" font-family="sans-serif" font-size="24" fill="#c0caf5">Matching labels can also join different computers.</text>
<rect x="1060" y="800" width="820" height="180" rx="14" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
<text x="1084" y="842" font-family="sans-serif" font-size="28" fill="#9ece6a">One section, six sessions</text>
<text x="1084" y="890" font-family="sans-serif" font-size="24" fill="#c0caf5">Rail boundaries and child grouping share the key.</text>
<text x="1084" y="926" font-family="sans-serif" font-size="24" fill="#c0caf5">Keyboard navigation follows the same ordering.</text>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: sessions without a launcher still group by hostname; labels use a deterministic nonempty name.</text>
</svg>