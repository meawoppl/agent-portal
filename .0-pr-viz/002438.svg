<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2438 · Web management, scoped agent approvals</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Remove the extra CLI/computer enrollment layer. Humans use the OAuth web UI;</text>
<text x="55" y="150" font-family="sans-serif" font-size="34" fill="#e6e9f5">agents retain request, approved run and approved template injection.</text>
<path d="M55 178H1945 M1000 205V1130" stroke="#565f89" stroke-dasharray="8 8"/>
<text x="55" y="230" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="230" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<rect x="55" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="317" font-family="sans-serif" font-size="28" fill="#f7768e">Two human access paths</text>
<text x="79" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">OAuth web management plus separate CLI enrollment</text>
<text x="79" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">Approved CLI access panel lists computer tokens</text>
<rect x="1055" y="275" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="317" font-family="sans-serif" font-size="28" fill="#9ece6a">OAuth-backed web management</text>
<text x="1079" y="365" font-family="sans-serif" font-size="24" fill="#c0caf5">Settings handles management and verified Copy</text>
<text x="1079" y="400" font-family="sans-serif" font-size="24" fill="#c0caf5">No CLI credential panel or enrollment screen</text>
<rect x="55" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="547" font-family="sans-serif" font-size="28" fill="#f7768e">Long-lived CLI vault credentials</text>
<text x="79" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">secret authorize issues aps_secret_ tokens</text>
<text x="79" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Human CLI can manage and read saved values</text>
<rect x="1055" y="505" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="547" font-family="sans-serif" font-size="28" fill="#9ece6a">Browser-only vault authority</text>
<text x="1079" y="595" font-family="sans-serif" font-size="24" fill="#c0caf5">General vault routes reject all bearer credentials</text>
<text x="1079" y="630" font-family="sans-serif" font-size="24" fill="#c0caf5">Legacy authorize/read endpoints return 410 Gone</text>
<rect x="55" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="777" font-family="sans-serif" font-size="28" fill="#f7768e">Computer-token cleanup</text>
<text x="79" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">Per-token revocation and a local credential file</text>
<text x="79" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Parallel human CLI and agent execution paths</text>
<rect x="1055" y="735" width="840" height="190" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="777" font-family="sans-serif" font-size="28" fill="#9ece6a">Retire tokens; preserve scoped agent flow</text>
<text x="1079" y="825" font-family="sans-serif" font-size="24" fill="#c0caf5">Migration revokes old tokens and enrollments</text>
<text x="1079" y="860" font-family="sans-serif" font-size="24" fill="#c0caf5">Agent request / run --binding / inject --approval</text>
<text x="55" y="1172" font-family="sans-serif" font-size="22" fill="#a9b1d6">Consent is not OS/browser isolation. Encrypted versions and audit records remain; rollback does not revive tokens.</text>
</svg>