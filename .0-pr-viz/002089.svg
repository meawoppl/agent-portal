<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<rect width="2000" height="1200" fill="#1a1b26"/>
<text x="55" y="52" font-family="sans-serif" font-size="24" fill="#a9b1d6">PR #2089 - Share device OAuth state prefix helper</text>
<text x="55" y="108" font-family="sans-serif" font-size="34" fill="#e6e9f5">Five copies of the device-state prefix share one const and helper.</text>
<path d="M55 178 H1945 M1000 195 V1130" stroke="#565f89" fill="none"/>
<text x="55" y="235" font-family="sans-serif" font-size="22" fill="#f7768e">BEFORE</text>
<text x="1055" y="235" font-family="sans-serif" font-size="22" fill="#9ece6a">AFTER</text>
<g><rect x="55" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#7aa2f7"/>
<text x="79" y="327" font-family="sans-serif" font-size="26" fill="#7aa2f7">Four literals plus two checks</text>
<text x="79" y="371" font-family="monospace" font-size="23" fill="#c0caf5">starts_with("device:") in auth.rs and</text>
<text x="79" y="407" font-family="monospace" font-size="23" fill="#c0caf5">oauth.rs; format! and strip_prefix too.</text>
</g>
<g><rect x="1055" y="285" width="870" height="180" rx="12" fill="#1e202e" stroke="#7aa2f7"/>
<text x="1079" y="327" font-family="sans-serif" font-size="26" fill="#7aa2f7">DEVICE_OAUTH_STATE_PREFIX</text>
<text x="1079" y="371" font-family="sans-serif" font-size="23" fill="#c0caf5">One const plus is_device_oauth_state,</text>
<text x="1079" y="407" font-family="sans-serif" font-size="23" fill="#c0caf5">used at all five sites.</text>
</g>
<g><rect x="55" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#f7768e"/>
<text x="79" y="612" font-family="sans-serif" font-size="26" fill="#f7768e">Free to drift apart</text>
<text x="79" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">A prefix rename touches four spots, and</text>
<text x="79" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">classifier and validator can disagree.</text>
</g>
<g><rect x="1055" y="570" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="612" font-family="sans-serif" font-size="26" fill="#9ece6a">One prefix rule</text>
<text x="1079" y="656" font-family="sans-serif" font-size="23" fill="#c0caf5">Flow label and state check read the same</text>
<text x="1079" y="692" font-family="sans-serif" font-size="23" fill="#c0caf5">const; new helper has a unit test.</text>
</g>
<g><rect x="55" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#a9b1d6"/>
<text x="79" y="897" font-family="sans-serif" font-size="26" fill="#a9b1d6">Behavior unchanged</text>
<text x="79" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">Pure move of the literal and the check;</text>
<text x="79" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">no request handling changes.</text>
</g>
<g><rect x="1055" y="855" width="870" height="180" rx="12" fill="#1e202e" stroke="#9ece6a"/>
<text x="1079" y="897" font-family="sans-serif" font-size="26" fill="#9ece6a">Compiler-verified sweep</text>
<text x="1079" y="941" font-family="sans-serif" font-size="23" fill="#c0caf5">3 oauth unit tests pass; backend clippy</text>
<text x="1079" y="977" font-family="sans-serif" font-size="23" fill="#c0caf5">and fmt clean.</text>
</g>
<path d="M490 477 V547 l-8 -12 m8 12 l8 -12" stroke="#565f89" fill="none" stroke-width="3"/>
<path d="M490 762 V832 l-8 -12 m8 12 l8 -12" stroke="#565f89" fill="none" stroke-width="3"/>
<path d="M1490 477 V547 l-8 -12 m8 12 l8 -12" stroke="#565f89" fill="none" stroke-width="3"/>
<path d="M1490 762 V832 l-8 -12 m8 12 l8 -12" stroke="#565f89" fill="none" stroke-width="3"/>
<text x="55" y="1170" font-family="sans-serif" font-size="22" fill="#a9b1d6">Scope: prefix-only refactor; device vs web flow semantics unchanged.</text>
</svg>
