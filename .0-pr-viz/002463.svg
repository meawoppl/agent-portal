<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Advertise launcher support for child session requests</title>
  <desc id="desc">Before, the launcher could execute child launches but omitted launcher.cli_spawn from its registration, so the backend rejected requests. After, the actual registration advertises the capability, allowing requests to proceed through the existing owner approval policy. A regression tests the serialized registration.</desc>
  <rect width="2000" height="1200" fill="#1a1b26"/>
  <g font-family="Arial, sans-serif">
    <text x="55" y="54" font-size="24" fill="#a9b1d6" letter-spacing="1">PR #2463 · Advertise launcher support for child session requests</text>
    <text x="55" y="110" font-size="34" fill="#e6e9f5">Child requests failed because launcher registration omitted an implemented capability.</text>
    <text x="55" y="155" font-size="34" fill="#e6e9f5">Advertise it on every connection so requests can reach the existing approval policy.</text>
    <path d="M55 180 H1945" stroke="#3d4666"/>
    <path d="M1000 205 V1100" stroke="#3d4666" stroke-dasharray="8 10"/>
    <text x="75" y="235" font-size="22" fill="#f7768e" font-weight="bold" letter-spacing="4">BEFORE</text>
    <text x="1055" y="235" font-size="22" fill="#9ece6a" font-weight="bold" letter-spacing="4">AFTER</text>

    <g>
      <rect x="75" y="275" width="850" height="160" rx="16" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
      <text x="105" y="320" font-size="26" fill="#7aa2f7">LauncherRegister</text>
      <text x="105" y="365" font-size="25" fill="#c0caf5">CLI exposes session start.</text>
      <text x="105" y="405" font-size="25" fill="#f7768e">Capabilities omit launcher.cli_spawn.</text>
    </g>
    <g>
      <rect x="1055" y="275" width="870" height="160" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
      <text x="1085" y="320" font-size="26" fill="#7aa2f7">LauncherRegister</text>
      <text x="1085" y="365" font-size="25" fill="#c0caf5">Connection loop uses registration().</text>
      <text x="1085" y="405" font-size="25" fill="#9ece6a">Capabilities include launcher.cli_spawn.</text>
    </g>
    <path d="M500 435 V500 M490 486 L500 500 L510 486" fill="none" stroke="#565f89" stroke-width="3"/>
    <path d="M1490 435 V500 M1480 486 L1490 500 L1500 486" fill="none" stroke="#565f89" stroke-width="3"/>
    <g>
      <rect x="75" y="500" width="850" height="160" rx="16" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
      <text x="105" y="545" font-size="26" fill="#7aa2f7">Backend: validate_launch</text>
      <text x="105" y="590" font-size="25" fill="#c0caf5">Requires launcher.cli_spawn.</text>
      <text x="105" y="630" font-size="25" fill="#f7768e">Missing flag blocks the request.</text>
    </g>
    <g>
      <rect x="1055" y="500" width="870" height="160" rx="16" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
      <text x="1085" y="545" font-size="26" fill="#7aa2f7">Backend: validate_launch</text>
      <text x="1085" y="590" font-size="25" fill="#c0caf5">Requires launcher.cli_spawn.</text>
      <text x="1085" y="630" font-size="25" fill="#9ece6a">Advertised flag satisfies the capability gate.</text>
    </g>
    <path d="M500 660 V725 M490 711 L500 725 L510 711" fill="none" stroke="#f7768e" stroke-width="3"/>
    <path d="M1490 660 V725 M1480 711 L1490 725 L1500 711" fill="none" stroke="#9ece6a" stroke-width="3"/>
    <g>
      <rect x="75" y="725" width="850" height="150" rx="16" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
      <text x="105" y="772" font-size="26" fill="#f7768e">unsupported_launcher</text>
      <text x="105" y="820" font-size="25" fill="#c0caf5">Supported child launch never reaches approval.</text>
    </g>
    <g>
      <rect x="1055" y="725" width="870" height="150" rx="16" fill="#1e202e" stroke="#e0af68" stroke-width="2"/>
      <text x="1085" y="772" font-size="26" fill="#e0af68">Existing approval and launch policy</text>
      <text x="1085" y="820" font-size="25" fill="#c0caf5">Owner consent, parent identity and limits apply.</text>
    </g>
    <g>
      <rect x="75" y="935" width="850" height="135" rx="16" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
      <text x="105" y="980" font-size="26" fill="#c0caf5">The test gap</text>
      <text x="105" y="1025" font-size="25" fill="#c0caf5">Backend fixtures already supplied the flag.</text>
    </g>
    <g>
      <rect x="1055" y="935" width="870" height="135" rx="16" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
      <text x="1085" y="980" font-size="26" fill="#9ece6a">Regression exercises the real producer</text>
      <text x="1085" y="1025" font-size="25" fill="#c0caf5">Serialized registration must carry the wire flag.</text>
    </g>
    <path d="M55 1130 H1945" stroke="#3d4666"/>
    <text x="55" y="1172" font-size="22" fill="#a9b1d6">Activation requires a coordinated launcher upgrade/restart; active sessions can be interrupted. No live restart is part of this PR.</text>
  </g>
</svg>
