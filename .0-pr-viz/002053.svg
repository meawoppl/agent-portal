<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"
     font-family="'Segoe UI', 'Noto Sans', 'DejaVu Sans', ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="2000" height="1200" fill="#16161e"/>

  <defs>
    <marker id="arr-dim-2053" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green-2053" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-red-2053" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f7768e"/>
    </marker>
  </defs>

  <text x="55" y="52" font-size="24" letter-spacing="1" fill="#565f89">PR #2053 - plugin runtime platform</text>

  <text x="55" y="100" font-size="34" fill="#e6e9f5">Plugins were installed code plus ad-hoc commands; now the launcher exposes</text>
  <text x="55" y="140" font-size="34" fill="#e6e9f5">a managed runtime: pane lifecycle, toolchain homes, status, and metadata.</text>
  <line x1="55" y1="165" x2="1945" y2="165" stroke="#3d4666" stroke-width="1"/>

  <text x="55" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#f7768e">BEFORE</text>
  <text x="1040" y="212" font-size="22" font-weight="700" letter-spacing="4" fill="#9ece6a">AFTER</text>
  <line x1="1000" y1="190" x2="1000" y2="1135" stroke="#3d4666" stroke-width="1.5" stroke-dasharray="2 6"/>

  <g>
    <rect x="80" y="250" width="860" height="150" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="290" font-size="26" fill="#c0caf5">agent-portal-plugin.toml</text>
    <text x="104" y="330" font-size="23" fill="#a9b1d6">install, surface, skills, prompts</text>
    <text x="104" y="366" font-size="22" fill="#565f89">no commands, toolchains, or capability metadata</text>
  </g>

  <line x1="320" y1="400" x2="320" y2="490" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr-dim-2053)"/>

  <g>
    <rect x="80" y="500" width="860" height="165" fill="#1e202e" stroke="#f7768e" stroke-width="2"/>
    <text x="104" y="540" font-size="26" fill="#f7768e">plugin open</text>
    <text x="104" y="580" font-size="23" fill="#a9b1d6">starts then forwards, but has no durable surface state</text>
    <text x="104" y="616" font-size="22" fill="#565f89">dead panes and restarts are hard to inspect or reuse</text>
  </g>

  <line x1="320" y1="665" x2="320" y2="750" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arr-red-2053)"/>

  <g>
    <rect x="80" y="760" width="860" height="150" fill="#1e202e" stroke="#f7768e" stroke-width="1.5"/>
    <text x="104" y="800" font-size="26" fill="#c0caf5">setup scripts own their filesystem story</text>
    <text x="104" y="840" font-size="23" fill="#f7768e">SDKs and caches can spill wherever the tool defaults</text>
    <text x="104" y="876" font-size="22" fill="#565f89">bad fit for KiCad, ESP-IDF, FPGA toolchains</text>
  </g>

  <g>
    <rect x="80" y="965" width="860" height="120" fill="#1e202e" stroke="#3d4666" stroke-width="1.5"/>
    <text x="104" y="1011" font-size="26" fill="#c0caf5">docs still read like a plan</text>
    <text x="104" y="1051" font-size="23" fill="#a9b1d6">runtime primitive and skills contract not current</text>
  </g>

  <g>
    <rect x="1060" y="250" width="860" height="150" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1084" y="290" font-size="26" fill="#9ece6a">manifest extensions</text>
    <text x="1084" y="330" font-size="23" fill="#a9b1d6">[[commands]], [[toolchains]], [capabilities]</text>
    <text x="1084" y="366" font-size="22" fill="#565f89">info/runtime --json surfaces plugin shape to agents and UI</text>
  </g>

  <line x1="1285" y1="400" x2="1285" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green-2053)"/>
  <line x1="1725" y1="400" x2="1725" y2="490" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green-2053)"/>

  <g>
    <rect x="1060" y="500" width="420" height="240" fill="#1e202e" stroke="#7aa2f7" stroke-width="1.5"/>
    <text x="1084" y="540" font-size="26" fill="#7aa2f7">managed panes</text>
    <text x="1084" y="580" font-size="22" fill="#a9b1d6">start / status / stop</text>
    <text x="1084" y="612" font-size="22" fill="#a9b1d6">surface.json state</text>
    <text x="1084" y="644" font-size="22" fill="#a9b1d6">health reuse, stale discard</text>
    <text x="1084" y="690" font-size="22" fill="#9ece6a">open delegates to start</text>
  </g>

  <g>
    <rect x="1500" y="500" width="420" height="240" fill="#1e202e" stroke="#7aa2f7" stroke-width="1.5"/>
    <text x="1524" y="540" font-size="26" fill="#7aa2f7">managed toolchains</text>
    <text x="1524" y="580" font-size="22" fill="#a9b1d6">setup plugin or one SDK</text>
    <text x="1524" y="612" font-size="22" fill="#a9b1d6">.portal/toolchains root</text>
    <text x="1524" y="644" font-size="22" fill="#a9b1d6">{toolchain_home} placeholder</text>
    <text x="1524" y="690" font-size="22" fill="#9ece6a">HOME and XDG pinned</text>
  </g>

  <line x1="1285" y1="740" x2="1285" y2="825" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green-2053)"/>
  <line x1="1725" y1="740" x2="1725" y2="825" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green-2053)"/>

  <g>
    <rect x="1060" y="835" width="860" height="135" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
    <text x="1084" y="878" font-size="26" fill="#9ece6a">runtime dirs become the stable plugin contract</text>
    <text x="1084" y="918" font-size="23" fill="#a9b1d6">.portal/home, cache, config, data, state, surfaces, toolchains</text>
    <text x="1084" y="950" font-size="21" fill="#565f89">future ESP32/FPGA plugin can install SDKs without muddying repos</text>
  </g>

  <g>
    <rect x="1060" y="1000" width="860" height="105" fill="#1e202e" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="1084" y="1042" font-size="26" fill="#c0caf5">PLUGIN_ARCHITECTURE.md now describes the real platform</text>
    <text x="1084" y="1078" font-size="23" fill="#9ece6a">skill headers stay first-class, runtime UI is the next layer</text>
  </g>

  <text x="55" y="1172" font-size="22" fill="#565f89">Verified: cargo fmt --check; cargo check -p agent-portal; cargo test -p agent-portal plugin::tests.</text>
</svg>
