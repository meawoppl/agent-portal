name: Native Build Benchmark

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

# Deliberately opt-in; these are experiments, never required PR gates.
concurrency:
  group: native-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  frontend:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-benchmark')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-benchmark-frontend
          targets: wasm32-unknown-unknown
          trunk: 'true'
      - name: Measure unchanged optimized WASM pipeline
        shell: bash
        run: |
          mkdir -p benchmark-results
          rustc -Vv > benchmark-results/frontend-environment.txt
          printf '\nrunner=%s image=%s commit=%s\n' "$RUNNER_OS/$RUNNER_ARCH" "$ImageVersion" "$(git rev-parse HEAD)" >> benchmark-results/frontend-environment.txt
          cd frontend
          /usr/bin/time -v trunk build --release --verbose > ../benchmark-results/frontend-build.log 2>&1
          du -sb dist >> ../benchmark-results/frontend-environment.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-frontend
          overwrite: true
          path: frontend/dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-wasm-timings
          overwrite: true
          path: benchmark-results

  native:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline-fat-z
            lto: fat
            opt: z
            units: 1
            incremental: 'false'
          - name: thin-z
            lto: thin
            opt: z
            units: 16
            incremental: 'false'
          - name: thin-3
            lto: thin
            opt: '3'
            units: 16
            incremental: 'false'
          - name: thin-2
            lto: thin
            opt: '2'
            units: 16
            incremental: 'false'
          - name: thin-3-incremental
            lto: thin
            opt: '3'
            units: 16
            incremental: 'true'
    env:
      CARGO_TARGET_DIR: benchmark-target
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.units }}
      CARGO_PROFILE_RELEASE_INCREMENTAL: ${{ matrix.incremental }}
      CARGO_INCREMENTAL: ${{ matrix.incremental == 'true' && '1' || '0' }}
      RUSTFLAGS: ''
      DATABASE_URL: postgresql://benchmark:benchmark@127.0.0.1:5432/benchmark
      SESSION_SECRET: native-build-benchmark-only-not-a-real-secret-000000000000000000000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: benchmark
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U benchmark" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-frontend
          overwrite: true
          path: frontend/dist
      - name: Compute compatible cache namespace
        id: key
        shell: bash
        run: |
          toolchain="$(rustc -Vv | sha256sum | cut -d' ' -f1)"
          # Profile, flags (fixed above), architecture, dependencies, and the
          # benchmark implementation are compatibility boundaries. Source SHA
          # and run attempt are save-only suffixes, so immutable entries do not
          # trap later compatible builds behind a stale exact hit.
          echo "prefix=native-experiment-v1-ubuntu24-${RUNNER_ARCH}-${toolchain}-${{ matrix.name }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', 'scripts/benchmarks/native-build.py') }}" >> "$GITHUB_OUTPUT"
      - name: Restore retained native artifacts
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: benchmark-target
          key: ${{ steps.key.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.key.outputs.prefix }}-
      - name: Benchmark native profile
        run: python3 scripts/benchmarks/native-build.py --disposable-checkout --output benchmark-results --cache-hit '${{ steps.cache.outputs.cache-matched-key }}'
      - name: Match dependency-only retention for non-incremental variants
        if: matrix.incremental != 'true'
        shell: bash
        run: |
          # cargo clean -p removes workspace outputs, leaving third-party
          # dependencies. Incremental variants retain the whole target tree.
          python3 - <<'PY'
          import json, subprocess
          m=json.loads(subprocess.check_output(['cargo','metadata','--no-deps','--format-version=1']))
          names=[p['name'] for p in m['packages'] if p['id'] in m['workspace_members']]
          subprocess.run(['cargo','clean','--release']+[v for n in names for v in ['-p',n]],check=True)
          PY
      - name: Record retained cache size
        run: du -sb benchmark-target > benchmark-results/cache-size.txt
      - name: Save source-aware native artifacts
        uses: actions/cache/save@v4
        with:
          path: benchmark-target
          key: ${{ steps.key.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-benchmark-${{ matrix.name }}
          overwrite: true
          path: benchmark-results
